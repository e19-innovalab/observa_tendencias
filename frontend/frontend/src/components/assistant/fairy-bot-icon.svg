<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2E6E"/>
      <stop offset="1" stop-color="#1F1840"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FE8F0"/>
      <stop offset="1" stop-color="#C9B6FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Wings (behind head) -->
  <g fill="url(#wing)" opacity="0.85">
    <ellipse cx="140" cy="250" rx="74" ry="40" transform="rotate(-28 140 250)"/>
    <ellipse cx="152" cy="336" rx="50" ry="26" transform="rotate(22 152 336)"/>
    <ellipse cx="372" cy="250" rx="74" ry="40" transform="rotate(28 372 250)"/>
    <ellipse cx="360" cy="336" rx="50" ry="26" transform="rotate(-22 360 336)"/>
  </g>

  <!-- Antenna / wand -->
  <line x1="256" y1="222" x2="256" y2="172" stroke="#F4F1FF" stroke-width="8" stroke-linecap="round"/>
  <path d="M256 108 Q261 135 288 140 Q261 145 256 172 Q251 145 224 140 Q251 135 256 108Z" fill="#FFD66B"/>

  <!-- Head -->
  <rect x="156" y="220" width="200" height="160" rx="48" fill="#F4F1FF"/>

  <!-- Face -->
  <rect x="204" y="276" width="24" height="36" rx="12" fill="#2B2350"/>
  <rect x="284" y="276" width="24" height="36" rx="12" fill="#2B2350"/>
  <path d="M236 338 Q256 354 276 338" fill="none" stroke="#2B2350" stroke-width="8" stroke-linecap="round"/>
  <circle cx="190" cy="330" r="10" fill="#FFB3C7" opacity="0.8"/>
  <circle cx="322" cy="330" r="10" fill="#FFB3C7" opacity="0.8"/>

  <!-- Tiny sparkles -->
  <path d="M384 128 Q386 140 398 142 Q386 144 384 156 Q382 144 370 142 Q382 140 384 128Z" fill="#FFD66B" opacity="0.9"/>
  <path d="M120 404 Q121.5 413 130 414 Q121.5 415 120 424 Q118.5 415 110 414 Q118.5 413 120 404Z" fill="#9FE8F0" opacity="0.9"/>
</svg>
