[project]
name = "rumbo-backend"
version = "0.1.0"
description = "Rumbo: backend del observatorio laboral y educativo del Cono Sur"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandera>=0.20",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
