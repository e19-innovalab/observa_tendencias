# Búsquedas de prueba: cómo escribe la gente un oficio (con palabras de Argentina, Chile y
# Uruguay) y qué código CIUO-08 debería encontrar. "codes": respuestas aceptadas (la primera es
# la principal). evaluate.py cuenta un acierto si alguno aparece en los primeros k resultados.
#
# STATUS: revisado y aprobado por Paula Vergara el 2026-11-01, contra la definición de cada
# grupo en ISCO-08 Vol. 1 (OIT, 2012):
#   https://webapps.ilo.org/ilostat-files/ISCO/newdocs-08-2021/ISCO-08/ISCO-08%20EN%20Vol%201.pdf
# Donde ESCO asigna otro grupo a la misma palabra (p. ej. kinesiólogo → 2269 en ESCO), manda
# ISCO-08. Primera versión: borrador del equipo del mismo día, con los mismos códigos.

