# Application settings that are not secrets and do not change between environments.
# Environment-specific values (database, CORS origins, API key) live in backend/.env.

app_name: Observa Tendencias
api_prefix: /api/v1
version: "0.1.0"

# Paths are relative to the backend/ folder (where this config/ folder lives).
paths:
  processed_data: ../data/processed/data_analytics
  files:
    coverage: informe_cobertura.csv
    jobs: ofertas_linkedin.csv
    graduate_trends: egresados_tendencias.csv
    graduate_projections: egresados_proyecciones.csv
  csv_encoding: utf-8-sig

# Developer tools. explorer: page at /explorer to try indicators, trends and projections
# visually against the API. Turn off in production.
dev_tools:
  explorer: true

pagination:
  default_limit: 50
  max_limit: 500
  observations_max_limit: 5000
  # Size of the "top" and "bottom" rankings of the employability index.
  ranking_size: 20

cors:
  allow_methods: [GET, POST, PATCH]
  allow_headers: ["*"]

# Dashboard tabs (mockup: Panorama regional) mapped to indicator domains.
domains:
  economic: Socioeconómicos
  labor: Laborales
  education: Educativos

# Data types required by the MVP brief: every value says which one it is.
data_types:
  observed: Dato observado
  calculated: Indicador calculado
  projected: Proyección

# Trend states (codes produced by app/analytics/trends.py) and how to read them given the
# indicator's higher_is_better: favorable / unfavorable / neutral.
trend_states:
  growing: Crecimiento
  stable: Estabilidad
  declining: Disminución
  insufficient_data: Datos insuficientes
assessments:
  favorable: Favorable
  unfavorable: Desfavorable
  neutral: Neutral

# Employability index labels.
employability:
  levels:
    low: Baja
    medium: Media
    high: Alta
    insufficient_data: Datos insuficientes
    not_applicable: No aplica a la región
  # Mejores / Peores: at most max_per_group occupations of the same ISCO group (first
  # group_digits digits), so one family does not fill the list. group_scope: all (across
  # countries) or country (per country). Rows say how many of their group were left out.
  ranking:
    max_per_group: 2
    group_digits: 2
    group_scope: all
  dimensions:
    net_demand: Demanda neta
    salary_ppp: Salario (USD PPA)
    insertion_rate: Tasa de inserción
    automation_risk: Riesgo de automatización (exposición a IA generativa)
  # Short explanations shown when hovering over the terms that come with each dimension.
  terms:
    normalized: >-
      El valor de esta dimensión llevado a una escala de 0 a 100 dentro del grupo comparado
      (todas las ocupaciones de los 3 países ese año): 100 es el mejor valor del grupo y 0 el peor.
    contribution: >-
      Cuántos puntos suma esta dimensión al ISE: el valor escalado multiplicado por su peso
      efectivo. Los aportes de todas las dimensiones suman el ISE.
  # How a value of each unit is written ({value}: the number, already formatted).
  unit_formats:
    ppp_usd_month: "USD PPA {value} / mes"
    usd_month: "USD {value} / mes"
  # Value shown first in a dimension's card instead of the one the index uses (same country,
  # occupation and period); the index value is still shown below it.
  display_values:
    salary_ppp:
      indicator: mean_monthly_earnings_usd
      label: Salario (USD)
      note: >-
        En dólares al tipo de cambio de mercado. El ISE usa el salario en USD PPA (paridad de
        poder adquisitivo), que corrige las diferencias de precios entre países.
  # Shown with the ranking while some dimension has no source. {dimensions}: their names and
  # weights; {weights}: the weights the other dimensions take; {min_coverage}: analytics.yaml.
  no_source_note: >-
    {dimensions} todavía no tiene fuente oficial. Mientras tanto, el ISE se calcula con las demás
    dimensiones y ese peso se reparte entre ellas en proporción a sus pesos: {weights}. Si a una
    ocupación le falta además otra dimensión, se hace lo mismo con las que tenga, siempre que
    reúnan al menos el {min_coverage} del peso total.
  # Shown next to the methodology: what each dimension measures and its possible range. The
  # range actually observed comes from the data (/employability -> dimension_ranges).
  dimension_info:
    net_demand:
      definition: >-
        Crecimiento anual promedio del empleo del grupo ocupacional. Argentina y Uruguay: grupos
        de 2 dígitos CIUO-08 (OIT). Chile: grandes grupos de 1 dígito CIUO-08.CL (ENE, SIMEL).
      unit: "% anual"
      possible_range: Sin límite fijo. Negativo si el empleo cae, positivo si crece.
    salary_ppp:
      definition: Ingreso laboral mensual promedio del gran grupo ocupacional (CIUO-08, 1 dígito).
      unit: USD PPA por mes
      possible_range: Desde 0, sin máximo.
    insertion_rate:
      definition: Proporción de egresados que consiguen empleo al poco tiempo de egresar.
      unit: "%"
      possible_range: 0 a 100 %.
      # Shown while the dimension has no source (analytics.yaml -> indicator: null).
      source_status: >-
        Sin fuente oficial todavía. Chile: Mi Futuro (SIES, MINEDUC) calcula la empleabilidad al
        primer año por carrera, pero no la publica como archivo descargable; la base se le pide
        al SIES. Argentina y Uruguay: no se encontró una fuente oficial por carrera u ocupación.
    automation_risk:
      definition: >-
        Exposición a la IA generativa (OIT, 2025). Cada tarea de la ocupación tiene un puntaje
        de 0 (no se puede automatizar) a 1 (la IA generativa podría hacerla sola, sin una
        persona); el valor es el promedio de las tareas.
      unit: Índice 0 a 1
      possible_range: 0 a 1. En el índice se invierte (menos exposición, más puntaje).

# Moctezuma indicator labels (method: analytics.yaml -> moctezuma).
moctezuma:
  levels:
    low: Baja asimetría
    medium: Asimetría media
    high: Alta asimetría
    insufficient_data: Datos insuficientes
    not_applicable: No aplica a la región
  sides:
    pace: Ritmo del cambio
    readiness: Capacidad de respuesta
  dimensions:
    ai_exposure: Exposición a la IA generativa
    digital_diffusion: Velocidad de digitalización
    training_growth: Crecimiento de la formación (titulados)
    education_fit: Ajuste educativo (menos subcalificación)
    tertiary_base: Base educativa (matrícula superior)
  # Historical version (1519) and the worked examples, served by /moctezuma/reference.
  history_file: reference/moctezuma_history.yaml
  # Occupation of the worked example and of the reading guide (ISCO-08 code).
  example_occupation: "2512"
  # What each side meant in 1519 (shown under each side's definition).
  side_history:
    pace: La llegada de caballos, acero, pólvora y nuevas enfermedades, que alcanzó su máximo en dos años.
    readiness: La población que quedaba para sostener la sociedad, su economía y su conocimiento.
  # What each side measures (returned by /moctezuma -> sides, shown next to the ranking).
  side_info:
    pace: >-
      Qué tan rápido y con cuánta intensidad llega el cambio tecnológico a una ocupación. Combina
      cuánto de sus tareas puede hacer la IA generativa con la velocidad a la que se digitaliza el
      país. Va de 0 a 100 dentro del grupo comparado: 100 es el cambio más rápido e intenso del
      grupo y 0 el más lento.
    readiness: >-
      Qué tan preparada está la sociedad para incorporar ese cambio en la ocupación: si crece la
      formación de nuevas personas para ese trabajo, si quienes ya lo hacen tienen la educación
      que pide y qué tan amplia es la base de educación superior del país. Va de 0 a 100 dentro
      del grupo comparado: 100 es la mayor capacidad del grupo y 0 la menor.
  # What each dimension measures, its unit and possible range (as employability.dimension_info).
  dimension_info:
    ai_exposure:
      definition: >-
        Exposición de las tareas de la ocupación a la IA generativa (OIT, 2025): promedio de las
        tareas, de 0 (la IA no puede hacerla) a 1 (podría hacerla sola). Es la misma para los tres
        países y todos los años.
      unit: Índice 0 a 1
      possible_range: 0 a 1. Más exposición, más ritmo.
    digital_diffusion:
      definition: >-
        Crecimiento anual promedio de la población que usa internet en el país en los últimos 3
        años (Banco Mundial). Todas las ocupaciones del país comparten el valor.
      unit: "% anual"
      possible_range: Sin límite fijo; cerca de 0 cuando casi toda la población ya usa internet.
    training_growth:
      definition: >-
        Crecimiento anual promedio de los titulados de las carreras que forman para la ocupación
        en los últimos 3 años (mismas fuentes y correspondencias que las brechas de habilidades).
      unit: "% anual"
      possible_range: Sin límite fijo. Negativo si egresan menos personas, positivo si más.
    education_fit:
      definition: >-
        Subcalificación: porcentaje de los ocupados del gran grupo con menos educación de la que
        pide la ocupación (OIT). Cuenta en contra: menos subcalificación, más capacidad.
      unit: "%"
      possible_range: 0 a 100 %.
    tertiary_base:
      definition: >-
        Matrícula bruta en educación superior del país (Banco Mundial). Todas las ocupaciones del
        país comparten el valor.
      unit: "% de la población en edad teórica"
      possible_range: Desde 0; puede superar 100 % porque cuenta a estudiantes de cualquier edad.

ludita:
  levels:
    low: Poco parecido
    medium: Parecido intermedio
    high: Muy parecido
    insufficient_data: Datos insuficientes
    not_applicable: No aplica a la región
  sides:
    exposure: Exposición
    vitality: Vitalidad
  dimensions:
    ai_exposure: Exposición a la IA generativa
    employment_growth: Crecimiento del empleo
    training_growth: Crecimiento de la formación (titulados)
  side_info:
    exposure: >-
      Cuánto de las tareas de la ocupación puede hacer la IA generativa, sea automatizándolas o
      complementándolas. Va de 0 a 100 dentro del grupo comparado: 100 es la ocupación más
      expuesta del grupo.
    vitality: >-
      Si el mercado sigue apostando por la ocupación: crece la gente que trabaja en ella y crece
      la gente que se forma para hacerla. Va de 0 a 100 dentro del grupo comparado: 100 es el
      mayor crecimiento del grupo y 0 la mayor caída.
  dimension_info:
    ai_exposure:
      definition: >-
        Exposición de las tareas de la ocupación a la IA generativa (OIT, 2025): promedio de las
        tareas, de 0 (la IA no puede hacerla) a 1 (podría hacerla sola). Es la misma para los tres
        países y todos los años.
      unit: Índice 0 a 1
      possible_range: 0 a 1. Más exposición, más parecido al tejedor.
    employment_growth:
      definition: >-
        Crecimiento anual promedio de los ocupados del grupo ocupacional en los últimos 3 años, sin
        contar 2020 y 2021 (OIT; Chile: INE vía SIMEL). Las ocupaciones del grupo comparten el valor.
      unit: "% anual"
      possible_range: Sin límite fijo. Negativo si el empleo se achica.
    training_growth:
      definition: >-
        Crecimiento anual promedio de los titulados de las carreras que forman para la ocupación
        en los últimos 3 años (mismas fuentes y correspondencias que las brechas de habilidades).
      unit: "% anual"
      possible_range: Sin límite fijo. Negativo si egresan menos personas.
  # Paths (quadrants of exposure and vitality), named after the historical cases.
  paths:
    weaver:
      label: Camino del tejedor
      short: Expuesta y el mercado se retira
      description: >-
        La IA puede hacer buena parte de las tareas y el empleo y la formación caen. Es el
        patrón de los tejedores manuales después del telar mecánico y de las operadoras
        telefónicas después del discado.
    teller:
      label: Camino del cajero
      short: Expuesta y el mercado crece
      description: >-
        La IA puede hacer buena parte de las tareas pero el empleo o la formación crecen: la
        tecnología cambia el trabajo sin achicarlo, como pasó con los cajeros de banco durante
        décadas después del cajero automático.
    other_causes:
      label: Se achica por otras causas
      short: Poco expuesta y el mercado se retira
      description: >-
        La IA generativa no explica la caída: puede ser la economía, otra tecnología o la demanda.
    out_of_reach:
      label: Fuera del alcance, por ahora
      short: Poco expuesta y el mercado crece
      description: >-
        Pocas tareas expuestas y el empleo o la formación crecen.
  history:
    file: reference/ludita_history.yaml
    # Years after the arrival shown in "Los primeros años".
    zoom_years: 10
    # Today's curve next to the historical ones: employment of these occupation groups (rolled
    # up as in motion), indexed to arrival_year = 100.
    today:
      label: Personal de apoyo administrativo, hoy
      technology: IA generativa
      arrival_year: 2022
      arrival_note: >-
        Noviembre de 2022: lanzamiento de ChatGPT. El personal de apoyo administrativo es el gran
        grupo más expuesto a la IA generativa según la OIT.
      indicator: employment
      group_digits: 1
      groups: ["4"]
      source_short: empleo por ocupación de OIT e INE Chile

red_queen:
  levels:
    low: Cambio lento
    medium: Cambio medio
    high: Cambio rápido
    insufficient_data: Datos insuficientes
  dimensions:
    technology_turnover: Recambio de tecnologías (O*NET)
    skill_turnover: Recambio de habilidades (ESCO)
  dimension_info:
    technology_turnover:
      definition: >-
        Qué parte de las tecnologías que usa la ocupación (programas, equipos, plataformas)
        cambia por año según O*NET, la base de ocupaciones de Estados Unidos, llevada a CIUO-08
        con el cruce ESCO–O*NET.
      unit: "% anual"
      possible_range: 0 a 100 %. 0 es un perfil que no cambia.
    skill_turnover:
      definition: >-
        Qué parte de las habilidades y conocimientos que ESCO asigna a la ocupación cambia por año
        entre versiones de la clasificación europea.
      unit: "% anual"
      possible_range: 0 a 100 %. 0 es un perfil que no cambia.

sisyphus:
  levels:
    low: Rinde estudiar
    medium: Rinde a medias
    high: La piedra vuelve a caer
    insufficient_data: Datos insuficientes
    not_applicable: No aplica
  sides:
    stone: La piedra
    reward: La recompensa
  dimensions:
    overeducation: Sobreeducación
    earnings_vs_tertiary: Ingreso frente al de un título
  side_info:
    stone: >-
      Cuánta gente del grupo tiene más estudios de los que pide su puesto: el esfuerzo de estudiar
      que el trabajo no usa. Va de 0 a 100 entre los grupos de los tres países.
    reward: >-
      Cuánto paga el grupo frente a lo que gana en promedio quien tiene educación superior en el
      país. Va de 0 a 100 entre los grupos de los tres países: 100 es el que más se acerca.
  dimension_info:
    overeducation:
      definition: >-
        Ocupados del gran grupo con un nivel educativo mayor al que pide (OIT, enfoque normativo),
        como porcentaje de los ocupados con ocupación y educación informadas.
      unit: "%"
      possible_range: 0 a 100 %.
    earnings_vs_tertiary:
      definition: >-
        Ingreso mensual medio del gran grupo dividido por el ingreso mensual medio de los
        asalariados con educación superior del país, el mismo año (OIT, USD PPA).
      unit: Cociente
      possible_range: Desde 0. 1 es pagar lo mismo que un título en promedio.
  quadrants:
    sisyphus:
      label: La piedra vuelve a caer
      short: Mucha sobreeducación y paga poco
      description: >-
        Mucha gente con más estudios de los que pide el puesto, en un trabajo que paga lejos de lo que suele pagar un título: el esfuerzo de estudiar no vuelve.
    overqualified_paid:
      label: Sobra título, pero paga
      short: Mucha sobreeducación y paga relativamente bien
      description: >-
        Sobran estudios para el puesto, pero el puesto paga más cerca de un título: el estudio rinde aunque no se use del todo.
    low_pay:
      label: Paga poco, pero no por el título
      short: Poca sobreeducación y paga poco
      description: >-
        Paga poco, pero casi nadie tiene más estudios de los que pide: el problema no es el título que sobra.
    fits:
      label: El estudio rinde
      short: Poca sobreeducación y paga relativamente bien
      description: >-
        Pocos estudios de sobra y el puesto paga más cerca de un título.

# Brecha generacional (Panorama, /generational-gap): youth unemployment over total, same source.
generational_gap:
  title: Brecha generacional
  youth_indicator: youth_unemployment_rate_survey
  total_indicator: unemployment_rate
  description: >-
    Cuántas veces más desocupación tienen los jóvenes de 15 a 24 años que el conjunto de la fuerza
    de trabajo. Las dos tasas salen de las mismas encuestas de hogares (OIT, ILOSTAT). 1 sería no
    tener brecha.
  # {country}, {ratio}, {year}: filled with the latest year that has both rates.
  headline: "En {country}, un joven de 15 a 24 años tiene {ratio} veces más chance de estar desocupado que el promedio ({year})."

# Ocupaciones en movimiento (Tendencias, /occupation-groups/motion): one bubble per occupation
# group and country, per year. Values of the catalog occupations are rolled up to groups of
# group_digits digits: each source group (the digits the series is published at) counts once,
# then the group value is the sum or mean of its source groups (aggregate).
motion:
  title: Las ocupaciones en movimiento
  description: >-
    Cada burbuja es un gran grupo de ocupaciones en un país: más a la derecha, mejor pago; más
    grande, más gente trabajando. Tocá ▶ para ver cómo se movieron año a año.
  group_digits: 1
  first_year: 2015
  # A country-group-year still shows when x or size is missing, using the latest value at most
  # this many years older (flagged in the response).
  max_carry_years: 1
  # Salaries are shown in USD (market exchange rate) and always next to the USD PPA value the
  # indexes use (x_secondary), as in the employability cards.
  x:
    indicator: mean_monthly_earnings_usd
    aggregate: mean
    label: Ingreso mensual promedio (USD)
    scale: log
  x_secondary:
    indicator: mean_monthly_earnings_ppp
    aggregate: mean
    label: Ingreso mensual promedio (USD PPA)
  size:
    indicator: employment
    aggregate: sum
    label: Personas ocupadas (miles)
  default_y: growth
  y:
    growth:
      short_label: Crecimiento del empleo
      indicator: employment
      aggregate: sum
      measure: yoy
      # Groups smaller than this (thousands of people) the year before are left out: survey
      # samples that small swing widely from year to year.
      min_base: 30
      label: Crecimiento del empleo (% anual)
      description: >-
        Variación de los ocupados del grupo respecto del año anterior. 2020 marca la caída por la
        pandemia y 2021 el rebote.
      reference: 0
      # Axis range; values outside are drawn at the edge and flagged.
      domain: [-30, 30]
    ai_exposure:
      short_label: Exposición a IA
      indicator: genai_exposure
      aggregate: mean
      measure: level
      applies_to_all_years: true
      label: Exposición a la IA generativa (0 a 1)
      description: >-
        Promedio de la exposición de las ocupaciones del grupo (OIT, 2025). Es la misma todos los
        años: las burbujas solo se mueven en horizontal y en tamaño.
    employability:
      short_label: Empleabilidad (ISE)
      methodology: employability_index
      label: Índice de empleabilidad (ISE, 0 a 100)
      description: >-
        Promedio del ISE de las ocupaciones del grupo con puntaje en ese año.
      reference: 50
      domain: [0, 100]
  notes:
    - >-
      Cada burbuja es un gran grupo de ocupaciones (CIUO-08, 1 dígito) en un país. Chile publica
      el empleo por ocupación desde 2017; Argentina y Uruguay, antes.
    - >-
      El ingreso es del gran grupo (OIT), en dólares al tipo de cambio de mercado; al lado se
      muestra en USD PPA (paridad de poder adquisitivo), la medida que usan el ISE y los demás
      índices porque corrige las diferencias de precios entre países. En dólares de mercado las
      devaluaciones mueven las burbujas aunque los salarios en moneda local no cambien. En el
      eje horizontal la escala es logarítmica: cada paso igual es el mismo porcentaje de
      diferencia.

# Datasets: downloaded and uploaded files. Paths are relative to the backend/ folder; every
# file is kept (never overwritten) so each load can be traced to the exact file.
datasets:
  raw_dir: ../data/raw/datasets
  uploads_dir: ../data/uploads
  max_upload_bytes: 50000000
  max_errors_reported: 50
  preview_rows: 20
  # Whatever is uploaded is checked before reading it: the real format (not just the extension),
  # macros, size once unzipped (xlsx are zip files) and number of rows.
  max_rows: 200000
  max_unzipped_bytes: 300000000
  # Errors grouped by type, as the screen shows them first: rows and values listed per group.
  group_rows_shown: 8
  group_values_shown: 5
  group_titles:
    missing_value: "Faltan valores en la columna «{column}»"
    unknown_indicator: "Indicadores que no existen"
    unknown_country: "Países fuera del catálogo"
    unknown_sector: "Sectores que no existen"
    unknown_occupation: "Ocupaciones CIUO que no existen"
    bad_frequency: "Frecuencias inválidas"
    not_numeric: "Valores que no son números"
    bad_period: "Períodos que no se pueden leer"
    out_of_range: "Valores fuera de rango"
  group_hints:
    missing_value: "Completá la celda o borrá la fila."
    unknown_indicator: "Usá un código de la hoja «indicadores» de la plantilla."
    unknown_country: "Usá ARG, CHL o URY."
    unknown_sector: "Usá un código de la hoja «sectores» de la plantilla, o dejala vacía."
    unknown_occupation: "Usá un código CIUO-08 de 4 dígitos de la hoja «ocupaciones», o dejala vacía."
    bad_frequency: "A (anual), Q (trimestral) o M (mensual)."
    not_numeric: "Solo números, con punto o coma decimal y sin símbolos (%, $)."
    bad_period: "Anual: 2024 · trimestral: 2024-Q2 · mensual: 2024-03."
    out_of_range: "Revisá la unidad del indicador."
  # Values that already exist from an official source (same indicator, country, sector,
  # occupation and period): the upload warns, and loading needs an explicit confirmation. The
  # uploaded values are kept as a separate source; nothing official is overwritten.
  overlap_examples: 3
  # Template for long-format profiles (GET /datasets/profiles/{code}/template). The data sheet
  # has only the headers (no example rows, so examples are never loaded by mistake); the codes
  # sheets come from the catalog and indicators.yaml.
  template:
    file_name: "plantilla_{code}"
    sheets:
      data: datos
      help: instrucciones
      indicators: indicadores
      countries: paises
      sectors: sectores
      occupations: ocupaciones
    instructions:
      - "Una fila por valor. Completá la hoja «datos» sin cambiar los encabezados."
      - "Obligatorias: indicador, pais, periodo, frecuencia y valor. Opcionales: sector y ocupacion."
      - "indicador: un código de la hoja «indicadores». pais: ARG, CHL o URY."
      - "periodo y frecuencia: 2024 con A (anual), 2024-Q2 con Q (trimestral) o 2024-03 con M (mensual)."
      - "valor: solo el número, en la unidad del indicador (columna «unidad» de la hoja «indicadores»)."
      - "Al subirlo, declarás la fuente oficial (nombre y URL). Primero se revisa; nada se carga hasta que lo confirmes."
    examples_title: "Ejemplo de filas (no las copies tal cual: son para ver el formato)"
    examples:
      - {indicador: unemployment_rate, pais: ARG, periodo: "2024", frecuencia: A, valor: 7.2}
      - {indicador: employment, pais: CHL, periodo: "2024", frecuencia: A, valor: 950.5, ocupacion: "2221"}
    headers:
      code: codigo
      name: nombre
      unit: unidad
  # Example files to try the check (served by GET /datasets/profiles/{code}/examples/{name}):
  # real values already published by ILOSTAT and the World Bank, so the valid one also shows the
  # overlap warning (config/datasets/ejemplos/README.md).
  example_files:
    plantilla_generica:
      valido: datasets/ejemplos/ejemplo_valido.csv
      con_errores: datasets/ejemplos/ejemplo_con_errores.csv
  messages:
