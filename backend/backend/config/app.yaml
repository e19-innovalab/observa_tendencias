# Skills (ESCO). Types are the tail of ESCO's skill-type URI.
skills:
  types:
    knowledge: Conocimiento
    skill: Habilidad o competencia
  # Skills shown in an occupation profile (the API can return more with ?limit=).
  profile_top: 10
  # Skill gap rankings (/skills/gaps, views top/bottom): only skills with a full gap used by
  # at least this many occupations, so niche skills of a single occupation do not fill the list.
  gap_ranking_min_occupations: 3
  # Skills by sector use ESCO's own categories (occupation_skills.relation), not a share of
  # weight. A skill belongs to a sector when it is essential for at least one of the sector's
  # occupations; /skills/gaps?sector= keeps those (relation=any also adds the optional ones).
  # Each gap lists the sectors that use it and how; a skill essential in two or more sectors is
  # cross-sector ("transversal"). E.g. dietary food preparation: essential for dietitians
  # (health), optional for cooks (tourism). Its gap is computed over all its occupations.
  sector_relation: essential
  relations:
    essential: Esencial
    optional: Opcional
  # Group for the occupations that use a skill but belong to no strategic sector.
  no_sector_label: Otras ocupaciones
  # Shown next to the gaps of the years whose graduates come from a supplementary source
  # (analytics.yaml -> skill_gaps.supply_supplements), per country.
  supply_notes:
    ARG: >-
      Los titulados de 2024 vienen del adelanto parcial del Anuario Estadístico del Sistema
      Universitario 2024 (DIU), publicado en agosto de 2026; el anuario final puede corregirlos.
      Pregrado y grado se separan con las proporciones de 2023 (estimación).
  sufficiency:
    full: Demanda y oferta con datos
    partial: Datos insuficientes
    none: Sin datos
  weight_note: >-
    Peso = promedio, entre las ocupaciones ESCO del grupo CIUO, de 1 si la habilidad es
    esencial, 0,5 si es opcional y 0 si no figura.

# CIUO-08 hierarchy levels, by number of digits of the code.
isco_levels:
  1: Gran grupo
  2: Subgrupo principal
  3: Subgrupo
  4: Grupo primario (ocupación)

# Alert labels (types and severities produced by app/analytics/alerts.py).
alerts:
  types:
    significant_change: Variación significativa
    trend_reversal: Cambio de tendencia
    index_level_change: Cambio de nivel del ISE
    new_skill_gap: Nueva brecha de habilidades
    stale_source: Fuente desactualizada
    source_format_changed: Formato de archivo cambiado
  severities:
    high: Alta
    medium: Media
    low: Baja
  # Shown in "¿Cómo se generan las alertas?". Thresholds are not written here: /alerts/rules
  # reads them from analytics.yaml so the page always shows the values in use.
  type_info:
    significant_change: >-
      El último dato cambió mucho respecto del período inmediatamente anterior, o el cambio es
      atípico comparado con los cambios previos de la misma serie.
    trend_reversal: >-
      La tendencia de la última ventana (crecimiento, estabilidad o disminución) es distinta de
      la de la ventana que termina un período antes.
    index_level_change: >-
      Una ocupación destacada cambió de nivel del ISE (Baja, Media, Alta) respecto del año
      anterior.
    new_skill_gap: >-
      La brecha entre demanda y oferta formativa de una habilidad superó el umbral por primera
      vez. Todavía sin datos de habilidades.
    stale_source: >-
      La fuente no tiene una actualización exitosa hace más tiempo del esperado para su
      frecuencia.
    source_format_changed: >-
      El archivo oficial descargado no coincide con el formato validado (hoja, columnas,
      períodos, valores o revisiones de datos ya publicados). No se carga nada hasta revisarlo.
  severity_info:
    high: El cambio supera varias veces el umbral; conviene revisarlo primero.
    medium: Cambio relevante que supera el umbral.
    low: Aviso de mantenimiento (por ejemplo, una fuente sin actualizar).

# How period-over-period change is expressed when the request does not say: units listed in
# absolute_units change in their own unit (percentage points for percent); the rest as a ratio.
comparison:
  absolute_units: [percent]

# Inicio screen cards. change: absolute (percentage points for percent units) or relative (%).
dashboard:
  highlights:
    - indicator: unemployment_rate
      change: absolute
    - indicator: labor_force_participation
      change: absolute
    - indicator: lower_secondary_completion
      change: absolute
    - indicator: internet_users
      change: absolute

# Source status shown next to every chart.
source_status:
  ok: ok
  stale: stale
  unavailable: unavailable
  never_run: never_run

# Notices returned with datasets that are not official statistics or are processed by the team.
notices:
  jobs: "LinkedIn (Apify), clasificación por reglas; no es una fuente oficial"
  graduates: >-
    SIES (Chile) y datos.gob.ar (Argentina), procesado por el equipo de datos.
    Las proyecciones son orientativas.

# LinkedIn job postings view (same texts as the first Next.js prototype). /jobs/summary returns
# it so any client shows the same notice, sector order and page size.
jobs_view:
  notice: >-
    Las ofertas vienen de LinkedIn (recolección con Apify) y el sector se asigna por reglas según
    la industria de la empresa. No es una fuente oficial y es una instantánea de una semana, no
    una tendencia.
  footnote: >-
    Una cifra de 200 postulantes en LinkedIn debe leerse como «200 o más».
  source_label: LinkedIn (Apify)
  period_label: última semana
  # Rows of the sector x province table, in this order; the rule-based "other" bucket goes last
  # and is left out of "sector con más ofertas".
  sector_order: [Tecnología, Economía del conocimiento, Salud, Energía, Turismo]
  other_sector: Otros
  # The value LinkedIn experience levels use for "no level".
  no_level: Not Applicable
  # Competition per posting: median applicants per posting, by sector. LinkedIn shows "200+" as
  # 200, so postings at the cap are counted apart and a median at the cap reads "200 o más".
  # Sectors with fewer postings with applicant data than the minimum get no median.
  applicants_cap: 200
  competition_min_postings: 10
  page_size: 25

# Text search (/occupations?q=, app/core/search.py). aliases_file: local names of occupations
# (Argentina, Chile, Uruguay) with their CIUO-08 code; a search that matches a name also returns
# its occupations ("remisero" → 8322).
search:
  aliases_file: reference/ocupaciones_nombres_locales.yaml

# Assistant ("Preguntale al Observatorio"): answers questions with the observatory's own data. It
# can only call the read-only API endpoints listed under tools (in-process, same answers the
# frontend gets); it has no database, web or write access. Every question is logged in
# assistant_logs (question, tools used, answer, tokens, time) and counts toward the daily limits.
# Secrets live in backend/.env: ANTHROPIC_API_KEY (provider anthropic) and ASSISTANT_LOCAL_API_KEY
# (only if the local server asks for one).
assistant:
  enabled: true
  # Role permission needed to ask (app.yaml -> auth.roles); the user must be logged in.
  permission: view
  # local: an open model behind an OpenAI-compatible server (Ollama or llama.cpp's llama-server,
  # both run GGUF files on CPU). anthropic: Claude through the Anthropic API.
  provider: local
  providers:
    local:
      # Ollama: http://localhost:11434/v1 · llama-server: http://localhost:8080/v1
      base_url: http://localhost:11434/v1
      model: qwen2.5:7b-instruct
      max_tokens: 1024
      temperature: 0.2
      timeout_seconds: 180
    anthropic:
      model: claude-opus-5-5
      # Thinking depth: low keeps answers fast and cheap; raise it if answers fall short.
      effort: low
      # Includes the model's thinking, so it is higher than for the local model.
      max_tokens: 8000
      timeout_seconds: 120
      # On a safety decline the API re-runs the request on Anthropic's recommended fallback model
      # (server-side). Empty: no fallback, the decline is returned as an error.
      fallbacks: default
  # Tool calls per question; after that the model must answer with what it has.
  max_tool_calls: 4
  max_question_chars: 500
  # Earlier turns of the conversation sent back with each question (the client keeps them).
  history_turns: 6
  # Questions answered by the model per day. Scripted answers (templates, no cost) do not count.
  limits:
    questions_per_user_per_day: 30
    questions_per_day: 500
  # Tool results are trimmed before the model reads them: lists to this many items, then the
  # whole text to this many characters; keys listed here are removed (texts for screens).
  tool_result_max_items: 10
  tool_result_max_chars: 6000
  tool_result_drop_keys: [texts]
  # Numbers check: every number in the answer must appear in what the tools returned (or in the
  # question). Tolerance is relative; a share (0.64) also matches its percentage (64 %). Whole
  # numbers up to ignore_up_to (counts like "3 países") and years are not checked.
  # on_unverified: warn (answer shown with a warning) | block (answer replaced by the message).
  numbers_check:
    enabled: true
    tolerance: 0.005
    ignore_up_to: 10
    year_range: [1990, 2100]
    on_unverified: block
  system_prompt: |
    Sos el asistente del Observatorio de Tendencias de InnovaLab, que estudia el trabajo y la
    formación en Argentina (ARG), Chile (CHL) y Uruguay (URY). Respondés en español rioplatense,
    claro y breve (hasta 150 palabras), para personas que no son especialistas.

    Reglas:
    - Usá solo datos que te devuelvan las herramientas. Nunca inventes ni redondees de memoria un
      número: copiá los valores tal como vienen (podés redondear a 1 decimal).
    - Si una pregunta nombra una ocupación por su nombre, buscá primero su código CIUO con
      buscar_ocupacion. Si hay varias posibles, elegí la más cercana y decí cuál usaste.
    - Decí siempre de qué año y país es cada dato. Si hay datos insuficientes, decilo.
    - Si las herramientas no tienen la respuesta, decí que el observatorio no tiene ese dato. No
      respondas con conocimiento general sobre otros temas.
    - El ISE (Índice Sintético de Empleabilidad) va de 0 a 100. Los salarios en USD PPA sirven
      para comparar países; en USD son al tipo de cambio de mercado.
    - No des consejos personales de carrera; describí lo que muestran los datos.
  # Line added to the question with what the user is looking at (only the fields sent).
  context_template: "La persona está mirando: {fields}."
  context_fields:
    page: página
    country: país
    occupation: ocupación (CIUO)
    sector: sector
  final_round_note: "Ya no podés usar más herramientas. Respondé con los datos que obtuviste."
  # Codes the model may use without searching: 4-digit CIUO codes written in the question, the
  # history or the context. Any other code must come from a tool with "provides" (the search):
  # params with must_be_known reject codes the model made up from memory.
  known_code_pattern: "\\b\\d{4}\\b"
  # Read-only API endpoints the model may call. params: what the model fills (JSON schema
  # types); fixed: values always sent; path placeholders ({code}) are filled from params.
  # link: page of the frontend that shows the same data, returned with the answer.
  # provides: key of the results whose values become known codes (see known_code_pattern).
  tools:
    - name: buscar_ocupacion
      description: Busca ocupaciones por nombre (palabras en cualquier orden, sin importar tildes) o por código CIUO-08. Devuelve código y nombre.
      path: /occupations
      params:
        q: {type: string, description: "Nombre o código CIUO de la ocupación", required: true}
      provides: occupation_code
    - name: ficha_ocupacion
      description: Ficha de una ocupación (código CIUO de 4 dígitos) en los tres países, con el ISE, sus dimensiones (demanda neta, salario, inserción, riesgo de automatización), los salarios y el año de cada dato.
      path: /occupations/{code}
      params:
        code: {type: string, description: "Código CIUO-08 de 4 dígitos (de buscar_ocupacion)", required: true, must_be_known: true}
      link: {path: "/ocupaciones/{code}", label: "Ficha de la ocupación"}
    - name: historia_ocupacion
      description: Evolución del ISE de una ocupación por año.
      path: /employability/history
      params:
        occupation: {type: string, description: "Código CIUO-08 de 4 dígitos (de buscar_ocupacion)", required: true, must_be_known: true}
        country: {type: string, description: "ARG, CHL o URY (vacío: los tres)"}
      link: {path: "/ocupaciones/{occupation}", query: [country], label: "Ficha de la ocupación"}
    - name: ranking_ocupaciones
      description: Ranking de ocupaciones por ISE en un país (las mejores o las peores), opcionalmente de un sector.
      path: /employability
      params:
        country: {type: string, description: "ARG, CHL o URY", required: true}
        view: {type: string, enum: [top, bottom], description: "top: mejores · bottom: peores"}
        sector: {type: string, description: "Código de sector (opcional)"}
        year: {type: integer, description: "Año (vacío: el último)"}
      fixed: {limit: 10}
      link: {path: "/ocupaciones", query: [country], label: "Ranking de ocupaciones"}
    - name: sectores
      description: Resumen por sector económico de un país (ISE medio, salario medio y cantidad de ocupaciones).
      path: /employability/sectors
      params:
        country: {type: string, description: "ARG, CHL o URY", required: true}
        year: {type: integer, description: "Año (vacío: el último)"}
      link: {path: "/sectores", query: [country], label: "Sectores"}
    - name: habilidades_ocupacion
      description: Habilidades y conocimientos de una ocupación según ESCO (esenciales y opcionales).
      path: /occupations/{code}/skills
      params:
        code: {type: string, description: "Código CIUO-08 de 4 dígitos (de buscar_ocupacion)", required: true, must_be_known: true}
      fixed: {limit: 10}
      link: {path: "/ocupaciones/{code}", label: "Ficha de la ocupación"}
    - name: brechas_habilidades
      description: Habilidades con mayor (o menor) brecha entre lo que pide el trabajo y lo que forma la educación, en un país; opcionalmente de una ocupación o un sector.
      path: /skills/gaps
      params:
        country: {type: string, description: "ARG, CHL o URY", required: true}
        occupation: {type: string, description: "Código CIUO-08 (opcional, de buscar_ocupacion)", must_be_known: true}
        sector: {type: string, description: "Código de sector (opcional)"}
        view: {type: string, enum: [top, bottom], description: "top: mayores brechas · bottom: menores"}
      fixed: {limit: 10}
      link: {path: "/habilidades", query: [country], label: "Brechas de habilidades"}
    - name: metodologia
      description: Cómo se calcula un indicador del observatorio (parámetros y descripción).
      path: /methodologies/{methodology_type}
      params:
        methodology_type:
          type: string
          enum: [employability_index, skill_gap, trend, projection]
          description: "employability_index: ISE · skill_gap: brechas · trend: tendencias · projection: proyecciones"
          required: true
      link: {path: "/metodologia", label: "Metodología"}
  # Scripted answers: frequent questions are answered from templates with the API's data, without a
  # model (exact numbers, instant, no cost). The question type comes from the words below; the
  # occupation from a CIUO code, a local name (search.aliases_file) or the search; the country from
  # its name or the page being looked at. What does not fit a template goes to the model.
  scripted:
    enabled: true
    # Words that say what is asked (accents and case do not matter; phrases allowed).
    intent_words:
      methodology: ["como se calcula", "como se mide", "metodologia", "que es el ise", "que mide el ise", "que significa el ise"]
      sectors: [sector, sectores, rama, ramas]
      ranking_top: [mejores, mejor, "mas empleables", "mas empleabilidad", "mas alto", "mas altos", top]
      ranking_bottom: [peores, peor, "menos empleables", "mas bajo", "mas bajos"]
      skills: [habilidades, habilidad, competencias, conocimientos, "necesita saber", "tiene que saber", "que necesita", "que se necesita", "que hace falta"]
      salary: [gana, ganan, ganar, paga, pagan, sueldo, sueldos, salario, salarios, cobra, cobran, ingreso, ingresos, plata]
      employability: ["como le va", "como les va", conviene, empleabilidad, ise, futuro, demanda, "como esta", "como estan"]
    # Words ignored when looking for the occupation in the question.
    stopwords: [que, cual, cuales, cuanto, cuanta, cuantos, como, donde, de, del, la, el, los, las, un, una, unos, unas, en, a, al, y, o, u, para, por, ser, es, son, hay, me, mi, se, le, les, lo, con, sin, sobre, esta, este, esa, ese, ocupacion, ocupaciones, trabajo, trabajar, profesion, oficio, carrera, gente, persona, personas, hoy, ahora, actualmente, promedio, medio, media, mes, mensual, pais, paises, tiene, tienen, hoy, dia, anio, ano, segun, datos, observatorio, nos, decime, dime, quiero, saber, mas, menos, necesita, necesitan, requiere, requieren, debe, deben, tener, hace, falta, sirve, sabe, saben, puede]
    # Ways to name each country (besides its name and ISO3 code in catalog.yaml).
    country_words:
      ARG: [argentina, argentino, argentinos, argentinas, arg]
      CHL: [chile, chileno, chilenos, chilenas, chl]
      URY: [uruguay, uruguayo, uruguayos, uruguayas, ury]
    # Occupations offered when the question matches several; more than this goes to the model.
    max_options: 4
    ranking_size: 5
    skills_size: 8
    decimals: 1
    # Shown as the model in the log and the response.
    model_label: plantillas
    templates:
      occupation: "**{name}** (CIUO {code})"
      alias_note: "«{term}» corresponde a **{name}** (CIUO {code})."
      salary_title: "Salario medio de {occupation}:"
      salary_line: "- {country}: USD {usd} por mes (USD PPA {ppp}) en {year}."
      salary_line_ppp: "- {country}: USD PPA {ppp} por mes en {year}."
      salary_missing: "- {country}: sin dato de salario."
      salary_group_note: "Ojo: este salario no se publica para la ocupación sola; es el promedio del grupo {group} «{group_name}» ({countries})."
      employability_title: "Índice de empleabilidad (ISE, de 0 a 100) de {occupation}:"
      employability_line: "- {country}: {score} ({level}) en {year}."
      employability_missing: "- {country}: datos insuficientes para calcular el ISE."
      skills: "Habilidades y conocimientos esenciales de {occupation} según ESCO: {items}."
      skills_missing: "ESCO no tiene habilidades cargadas para {occupation}."
      ranking_top: "Ocupaciones con mayor ISE en {country} ({year}):"
      ranking_bottom: "Ocupaciones con menor ISE en {country} ({year}):"
      ranking_line: "{n}. {name}: {score}"
      sectors_score: "Sectores de {country} por ISE medio ({year}):"
      sectors_salary: "Sectores de {country} por salario medio ({year}):"
      sectors_score_line: "{n}. {name}: ISE {score} ({level})"
      sectors_salary_line: "{n}. {name}: USD {usd} por mes (USD PPA {ppp})"
      methodology: "El ISE (Índice Sintético de Empleabilidad) va de 0 a 100 y combina: {parts}. Cada dimensión se lleva a una escala de 0 a 100 dentro del grupo comparado; si falta un dato, su peso se reparte entre las demás. Versión {version}."
      methodology_part: "{label} ({weight} %)"
      ask_occupation: "Encontré varias ocupaciones para «{query}». ¿Cuál querés?"
      ask_country: "¿De qué país?"
      option_occupation: "{code} · {name}"
  messages:
    disabled: "El asistente no está disponible."
    empty_question: "Escribí una pregunta."
    too_long: "La pregunta es muy larga (máximo {max} caracteres)."
    user_limit: "Llegaste al límite de {limit} preguntas por día. Probá mañana."
    global_limit: "El asistente llegó al límite de preguntas de hoy. Probá mañana."
    provider_unavailable: "El asistente no responde en este momento. Probá en unos minutos."
    refused: "No puedo responder esa pregunta."
    cancelled: "Pregunta cancelada."
    unknown_code: "El código {value} no salió de buscar_ocupacion. Buscá primero la ocupación por su nombre y usá un código de los resultados."
    no_answer: "No encontré una respuesta con los datos del observatorio."
    unverified_warning: "Algunos números de esta respuesta no coinciden con los datos consultados: {numbers}. Verificalos en las páginas enlazadas."
    blocked: "No pude verificar los números de la respuesta con los datos del observatorio. Consultá las páginas enlazadas."
    blocked_no_links: "No pude verificar los números de la respuesta con los datos del observatorio. Probá preguntar por una ocupación o un sector con otras palabras, o buscalo en el buscador de arriba."
  # Texts for the screen (the frontend shows them as they are). name: what the bot is called.
  texts:
    name: Baqueano
    title: Preguntale al Observatorio
    tab: Preguntale al Baqueano
    intro: "Conozco los datos del observatorio. Preguntame por una ocupación, un sector, un país o cómo se calcula un indicador."
    placeholder: "Por ejemplo: ¿cómo le va a Enfermería en Chile?"
    disclaimer: "Responde con los datos del observatorio. Puede equivocarse: verificá en las páginas enlazadas."
    thinking: "Buscando en los datos… puede tardar hasta un minuto."
    send: Preguntar
    stop: Detener
    stopped: "Cancelaste la pregunta. No cuenta para tu límite del día."
    new_chat: Nueva conversación
    close: Cerrar
    links: "Ver en el observatorio:"
    remaining: "Te quedan {n} preguntas hoy."
    error: "No pude responder. Probá de nuevo en un rato."
  # Example questions shown before the first one (one click asks it).
  examples:
    - "¿Cómo le va a Enfermería en Chile?"
    - "¿Qué sector tiene el salario medio más alto en Uruguay?"
    - "¿Cómo se calcula el ISE?"

# Login and user accounts. Roles grant permissions: view (the observatory), manage_data (upload
# files, refresh sources, mark alerts), manage_users (accounts and roles). The token secret is
# AUTH_SECRET in .env; without it nobody can log in.
auth:
  token_ttl_hours: 12
  password_min_length: 10
  default_role: viewer
  roles:
    admin:
      label: Administrador
      permissions: [view, manage_data, manage_users]
    editor:
      label: Editor
      permissions: [view, manage_data]
    viewer:
      label: Consultas
      permissions: [view]
  statuses:
    active: Activo
    suspended: Suspendido
  messages:
    no_secret: "El inicio de sesión no está configurado (falta AUTH_SECRET en backend/.env)"
    bad_credentials: "Correo o contraseña incorrectos"
    suspended: "La cuenta está suspendida. Consultá con un administrador."
    not_authenticated: "Iniciá sesión para continuar"
    invalid_token: "La sesión venció o no es válida. Volvé a iniciar sesión."
    forbidden: "Tu rol no tiene permiso para esta acción"
    email_taken: "Ya existe un usuario con ese correo"
    user_not_found: "Usuario no encontrado"
    short_password: "La contraseña debe tener al menos {min} caracteres"
    unknown_role: "Rol desconocido: {role}"
    unknown_sector: "Sector desconocido: {sector}"
    unknown_country: "País fuera del catálogo: {country}"
    wrong_password: "La contraseña actual no es correcta"
    last_admin: "No se puede quitar el rol ni suspender al último administrador activo"

messages:
  db_unavailable: "No se pudo conectar a la base de datos. Revisá DATABASE_URL en backend/.env"
