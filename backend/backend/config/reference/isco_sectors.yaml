# CIUO-08 (ISCO-08) groups -> the catalog's strategic sectors, for the occupations that are not
# featured (featured occupations keep the sector set in catalog.yaml). The occupation takes the
# sector of the LONGEST matching code prefix (a 4-digit code beats its 3-digit group).
#
# Approximation: sectors are defined by economic activity (CIIU/ISIC, catalog.yaml -> isic_codes)
# and occupations are not activities. Each group goes to the sector whose activities mainly employ
# it. Groups not listed belong to no strategic sector (teachers, clerks, trades, operators...);
# they still appear when no sector is selected. ICT occupations go to Tecnología even though
# J62-J63 is also part of Economía del conocimiento.
# STATUS: draft, NOT REVIEWED.

reviewed: false

