# CINE-F 2013 (ISCED-F 2013): Clasificación Internacional Normalizada de la Educación, campos de
# educación y formación (UNESCO, Instituto de Estadística). Fixed standard, not an API: broad (2
# digits), narrow (3) and detailed (4) fields. Used as the common key for careers of the three
# countries (careers -> detailed field -> CIUO-08 occupations, see cine_f_ciuo.yaml).
#
# Source of the Spanish names: the "CINE-F 2013 Internacional UNESCO" column of DANE (Colombia),
#   "CINE-F 2013 A.C.", section 7.1, pages 24-27
#   https://www.dane.gov.co/files/noticias/CINE/cine-2013/Documento-CINE-F-2013-AC.pdf
# Original (UNESCO-UIS, 2014, ISBN 978-92-9189-157-3):
#   https://uis.unesco.org/en/files/isced-fields-education-and-training-2013-en-pdf
# Colombia's own additions (0315, 0918, 1016) are not included. Interdisciplinary codes (x88) and
# 9999 (unknown) are not used by the crosswalks and are left out.

