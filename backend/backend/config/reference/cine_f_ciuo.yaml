# CINE-F 2013 detailed field -> CIUO-08 (ISCO-08) unit groups the field mainly trains for. One table
# shared by Argentina, Chile and Uruguay: each country's careers are first assigned a detailed field
# (carreras_<country>_cine.yaml) and their graduates reach occupations through this table.
#
# STATUS: draft, NOT REVIEWED (reviewed: false). There is no official CINE-F -> CIUO correspondence.
# Criteria (same as the per-country crosswalks it replaces, data/scripts/referencias/README.md, 5):
# - the occupations a graduate of the field is mainly trained for, not every possible job;
# - "*": university and professional degrees (CIUO major groups 1-2 mostly);
#   "tecnico": technical degrees (técnico, tecnólogo, tecnicatura...), mostly major group 3. A field
#   without "tecnico" uses "*" for both.
# - [] : generic or interdisciplinary fields that do not train for a specific occupation; their
#   graduates count for no occupation.
# Graduates of a field are split equally among its codes.

reviewed: false
# Field names (CINE-F 2013), shown next to each career in the review view.
classification: reference/cine_f_2013.yaml

