# Crosswalk: Argentine university disciplines ("disciplina específica", DIU data published by the
# Subsecretaría de Ciencia, Tecnología e Innovación) → ISCO-08 / CIUO-08 unit groups they mainly
# train for. Used for the supply side of skill gaps.
#
# STATUS: draft written by profession, NOT REVIEWED (reviewed: false). There is no official
# crosswalk. Same rules as the Chilean one (data/scripts/referencias/README.md, section 5).
#
# Differences with Chile:
# - The unit is a discipline, broader than a career ("Ingeniería" covers every engineering), so
#   most rows list several occupations; graduates are split equally among them.
# - Two levels: Grado (degrees) and Pregrado (short university degrees, mostly technical). A row
#   can give codes per level: {Pregrado: [...], "*": [...]} where "*" is every other level.
# - Universities only: non-university tertiary institutes are not in the source file.

reviewed: false
country: ARG
source_profile: arg_egresados_universitarios
levels: [Grado, Pregrado]

