# Crosswalk: Chilean generic careers (Mi Futuro, "área carrera genérica", undergraduate) →
# ISCO-08 / CIUO-08 unit groups they mainly train for. Used for the supply side of skill gaps.
#
# STATUS: draft written by profession, NOT REVIEWED (reviewed: false). There is no official
# crosswalk between Chilean careers and ISCO-08. ESCO's text search was tried and discarded: it
# matches words, not professions (e.g. "enfermería" → nursing aide 5321, "psicología" →
# psychology professor 2310). Review it before publishing gap results; change a row and run
# `python -m app.jobs.recompute` to apply.
#
# Rules used for the draft:
# - Professional careers → the professional group (2xxx); technical careers ("Técnico en …")
#   → the associate-professional or skilled group (3xxx-7xxx) of the same field.
# - Several codes when a career leads to several occupations; graduates are split equally.
# - Generic categories ("Otros …", "Bachillerato …", common engineering plan) → no codes:
#   they do not point to an occupation, and are left out of the supply side.

