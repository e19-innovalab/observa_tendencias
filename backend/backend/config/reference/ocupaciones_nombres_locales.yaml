# Nombres locales de ocupaciones (Argentina, Chile, Uruguay) que ESCO no tiene, con su grupo
# CIUO-08. ESCO está escrito en español de España; estas son las palabras que se usan acá.
#
# Criterio: el grupo se elige según la definición de ISCO-08 Vol. 1 (OIT, 2012), igual que en
# ml/occupation_match/testset.yaml. "also": otros grupos donde la palabra también cae (según el contexto).
# countries: dónde se usa la palabra con ese sentido (ARG, CHL, URY). La misma palabra puede
# tener otro sentido en otro país (p. ej. "colectivero": colectivo es un bus en Argentina y un
# taxi compartido en Chile); en ese caso hay una entrada por país.
# review: true marca las entradas con dudas, para mirar primero.
#
# Uso (app.yaml -> search.aliases_file):
# - el buscador (/occupations?q=, app/core/search.py): "remisero" encuentra 8322;
# - el asistente (app/assistant/scripted.py): reconoce la ocupación de la pregunta;
# - el prototipo ml/occupation_match: build_data.py agrega cada nombre como kind "local" para
#   evaluar y entrenar (evaluate.py oculta las frases que también están en su testset.yaml).
#
# STATUS: revisado y aprobado por Paula Vergara el 2026-11-01, contra ISCO-08 Vol. 1 (OIT, 2012).
# Primera versión: borrador del equipo del mismo día. En la revisión se corrigieron 22 entradas
# marcadas con dudas; las que cambiaron de código lo dicen en "note" ("revisado: …; antes …").

