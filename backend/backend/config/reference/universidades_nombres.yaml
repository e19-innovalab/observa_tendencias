# Nombres de universidades e institutos: nombre publicado por la fuente -> nombre normalizado.
# Lo usa app/datasets/universities.py (analytics.yaml -> universities.names_file).
#
# Criterio: el nombre oficial completo, con mayúsculas y tildes. Varias formas publicadas de la misma
# institución van al mismo nombre y sus egresados se suman por año. Las marcas de nota de los
# anuarios argentinos, como "Salvador (4)", se quitan antes de buscar acá, salvo que la forma con
# la marca tenga su propia entrada. Un nombre publicado que no esté acá se carga tal como viene
# y queda avisado en la corrida.
#
# Instituciones sucesoras con otra figura legal siguen separadas: el Instituto Universitario
# Nacional del Arte (hasta 2014) y la Universidad Nacional de las Artes (desde 2015).
#
# review: nombres para confirmar contra la fuente.
review:
  - Instituto Universitario para el Desarrollo Productivo y Tecnológico
  - Instituto Universitario Nacional de Derechos Humanos Madres de Plaza de Mayo
  - Universidad del Gran Rosario

