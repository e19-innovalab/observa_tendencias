# Carreras de Uruguay: une los nombres que cambian entre anuarios del MEC, para que una serie por nombre
# no muestre un cambio de nombre como crecimiento. Lo usa app/analytics/graduate_trends_run.py
# (analytics.yaml -> graduate_trends.countries.URY.names_file).
#
# Se aplica en este orden, sobre cada nombre publicado:
# 1. reglas: expresión regular -> reemplazo, sin distinguir mayúsculas. Quitan sedes y corrigen formas
#    generales ("Licenciado en X" -> "Licenciatura en X").
# 2. equivalencias: nombre final -> nombres normalizados (minúsculas, sin tildes) ya pasados por las
#    reglas. Varias formas de la misma carrera suman sus egresados por año.
# Un nombre que no aparece queda como lo publica la fuente.
#
# Criterio: se unen los nombres cuando uno termina y el otro empieza en el mismo momento, o cuando
# son la misma carrera con otra redacción. No se unen carreras distintas de distintas instituciones
# solo por parecerse, salvo las marcadas en review.
#
# STATUS: borrador sin revisar.
# review: uniones que son una decisión, para confirmar:
# - Abogacía: "Doctor en Derecho y Ciencias Sociales" termina en 2023 y Abogacía crece en 2024.
# - Notariado: "Escribano Público" termina en 2023 y Notariado salta de 20 a 253 en 2024.
# - Medicina: el título de Udelar ("Doctor en Medicina") con la carrera de otra institución.
# - Veterinaria y Odontología: igual que Medicina.
# - Obstetricia: "Obstetra Partera" y "Licenciada en Obstetricia" de Paysandú.
# - Licenciatura en Diseño Industrial: las opciones y perfiles se publican juntos desde 2023.
reviewed: false
review:
  - Abogacía
  - Notariado
  - Medicina
  - Veterinaria
  - Odontología
  - Obstetricia
  - Licenciatura en Diseño Industrial

reglas:
  # Sede o convenio entre paréntesis al final: no cambian la carrera.
  - ['\s*\((montevideo|salto|paysand[uú]|maldonado|tacuaremb[oó]|rivera|treinta y tres|itr cs|paysand[uú] - entre r[ií]os|(cetp|dgetp)\s*-\s*utu-utec)\)\s*$', '']
  # Título en lugar de carrera, y errores de tipeo que se repiten.
  - ['^lic\.\s+en\b', 'Licenciatura en']
  - ['^(licenciad[oa]|liccenciado|licencitura|licenicatura)\s+en\b', 'Licenciatura en']
  - ['^licenciatura\s+(an[aá]lisis|comunicaci[oó]n)\b', 'Licenciatura en \1']
  - ['^tecn[oó]logo/a\b', 'Tecnólogo']
  - ['^t[eé]cnico universitario en\b', 'Tecnicatura Universitaria en']
  - ['^t[eé]cnico en (anatom[ií]a|hemoterapia|podolog[ií]a|radiois[oó]topos|recreaci[oó]n|tecnolog[ií]as de la imagen|desarrollo regional|artes)\b', 'Tecnicatura en \1']
  # Mayúsculas de algunos anuarios ("Licenciatura En Negocios Internacionales E Integración").
  - ['(?<=\s)en(?=\s)', 'en']
  - ['(?<=\s)de(?=\s)', 'de']
  - ['(?<=\s)del(?=\s)', 'del']
  - ['(?<=\s)y(?=\s)', 'y']
  - ['(?<=\s)e(?=\s)', 'e']
  - ['(?<=\s)para(?=\s)', 'para']

