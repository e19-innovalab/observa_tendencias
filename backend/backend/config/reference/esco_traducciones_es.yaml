  A1.10:
    nombre: controlar la frustración
    en: Stay calm and react in a constructive way to own or others' anger or when faced with obstacles
      or complaints.
    es: Mantener la calma y reaccionar de manera constructiva ante el enojo propio o ajeno, o ante obstáculos
