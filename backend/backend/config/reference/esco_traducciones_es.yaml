  S6.1:
    nombre: clasificar y envasar, embalar y empaquetar mercancías y materiales
    en: Sorting, packaging, separating or arranging materials, according to established patterns or procedures.
    es: Clasificar, envasar, separar u ordenar materiales de acuerdo con patrones o procedimientos establecidos.
  S6.1.0:
    nombre: clasificar y envasar, embalar y empaquetar mercancías y materiales
    en: Sorting, packaging, separating or arranging materials, according to established patterns or procedures.
    es: Clasificar, envasar, separar u ordenar materiales de acuerdo con patrones o procedimientos establecidos.
  S6.1.1:
    nombre: clasificar materiales o productos
    en: Arranging materials into predetermined categories or groups, according to established patterns
      of procedures.
    es: Ordenar materiales en categorías o grupos predeterminados, de acuerdo con patrones o procedimientos
      establecidos.
  S6.11:
    nombre: limpiar
    en: Cleaning buildings, work areas, equipment, machinery and vehicles.
    es: Limpiar edificios, áreas de trabajo, equipos, maquinaria y vehículos.
  S6.11.0:
    nombre: limpiar
    en: Cleaning buildings, work areas, equipment, machinery and vehicles.
    es: Limpiar edificios, áreas de trabajo, equipos, maquinaria y vehículos.
  S6.11.1:
    nombre: limpiar herramientas, equipos, piezas de trabajo y vehículos
    en: Performing cleaning routines after tools, equipment, machinery and vehicles have been used and
      cleaning workpieces during or after fabrication.
    es: Realizar rutinas de limpieza después de utilizar herramientas, equipos, maquinaria y vehículos,
      y limpiar piezas de trabajo durante o después de su fabricación.
  S6.11.2:
    nombre: limpiar el interior y el exterior de edificios
    en: Cleaning interior spaces and furnishings and the exterior of buildings and similar structures.
    es: Limpiar espacios interiores y mobiliario, así como el exterior de edificios y estructuras similares.
  S6.11.3:
    nombre: limpiar espacios al aire libre
    en: Cleaning outdoor public spaces such as streets or parks.
    es: Limpiar espacios públicos al aire libre, como calles o parques.
  S6.1.2:
    nombre: marcar materiales u objetos para su identificación
    en: Marking or labelling objects or materials for identification by type or individually.
    es: Marcar o etiquetar objetos o materiales para su identificación por tipo o de forma individual.
  S6.12:
    nombre: lavar y mantener textiles y prendas de vestir
    en: Washing or cleaning clothing and other textile products by hand or using a washing or laundry
      machine, maintaining textile items in good order.
    es: Lavar o limpiar prendas de vestir y otros productos textiles a mano o con una lavadora o máquina
      de lavandería, y mantener los artículos textiles en buen estado.
  S6.12.0:
    nombre: lavar y mantener textiles y prendas de vestir
    en: Washing or cleaning clothing and other textile products by hand or using a washing or laundry
      machine, maintaining textile items in good order.
    es: Lavar o limpiar prendas de vestir y otros productos textiles a mano o con una lavadora o máquina
      de lavandería, y mantener los artículos textiles en buen estado.
  S6.1.3:
    nombre: embalar, envasar y empaquetar objetos
    en: Enclosing or protecting products for distribution or storage according to a coordinated system
      of preparing goods for transport, warehousing, logistics, sale, and use.
    es: Envolver o proteger productos para su distribución o almacenamiento conforme a un sistema coordinado
      de preparación de mercancías para el transporte, el almacenamiento, la logística, la venta y el
      uso.
  S6.13:
    nombre: manipular y eliminar residuos y materiales peligrosos
    en: Collecting, storing and disposing of unwanted materials or hazardous, according to established
      waste management procedures.
    es: Recoger, almacenar y eliminar materiales no deseados o peligrosos, conforme a los procedimientos
      establecidos de gestión de residuos.
  S6.13.0:
    nombre: manipular y eliminar residuos y materiales peligrosos
    en: Collecting, storing and disposing of unwanted materials or hazardous, according to established
      waste management procedures.
    es: Recoger, almacenar y eliminar materiales no deseados o peligrosos, conforme a los procedimientos
      establecidos de gestión de residuos.
  S6.13.1:
    nombre: manipular y eliminar materiales peligrosos
    en: Handling, collecting, storing and disposing of materials that pose substantial threats to public
      or personal health or the environment.
    es: Manipular, recoger, almacenar y eliminar materiales que representan amenazas considerables para
      la salud pública o personal o para el medio ambiente.
  S6.13.2:
    nombre: eliminar residuos o escombros no peligrosos
    en: Collecting and disposing of unwanted non-hazardous materials according to established waste management
      procedures.
    es: Recoger y eliminar materiales no peligrosos no deseados conforme a los procedimientos establecidos
      de gestión de residuos.
  S6.2:
    nombre: mover y elevar
    en: Performing physical activities to move, load, unload or store objects or to climb structures,
      by hand or with the aid of equipment.
    es: Realizar actividades físicas para mover, cargar, descargar o almacenar objetos o para escalar
      estructuras, a mano o con la ayuda de equipos.
  S6.2.1:
    nombre: cargar y descargar mercancías y materiales
    en: Loading, securing or unloading products, materials, or equipment for transportation, storage or
      further processing by hand or using hand-held or manually operated equipment.
    es: Cargar, asegurar o descargar productos, materiales o equipos para su transporte, almacenamiento
      o procesamiento posterior, a mano o con equipos portátiles o de accionamiento manual.
  S6.2.2:
    nombre: mover o elevar materiales, equipos o suministros
    en: Moving or lifting goods, materials supplies or resources, by hand or with the aid of equipment,
      using actions such as lifting, pushing, carrying or shovelling.
    es: Mover o elevar mercancías, materiales, suministros o recursos, a mano o con la ayuda de equipos,
      mediante acciones como levantar, empujar, transportar o palear.
  S6.2.3:
    nombre: almacenar mercancías y materiales
    en: Placing goods and materials in storage by hand, or with the aid of hand-held or manually operated
      equipment.
    es: Colocar mercancías y materiales en almacenamiento a mano o con la ayuda de equipos portátiles
      o de accionamiento manual.
  S6.2.4:
    nombre: escalar
    en: Climbing equipment and structures.
    es: Escalar equipos y estructuras.
  S6.3:
    nombre: transformar y mezclar materiales
    en: Transforming materials from one form to another by mixing, blending, heating or chemical reaction,
      by hand or using handheld tools and equipment.
    es: Transformar materiales de una forma a otra mediante mezcla, combinación, calentamiento o reacción
      química, a mano o con herramientas y equipos portátiles.
  S6.3.0:
    nombre: transformar y mezclar materiales
    en: Transforming materials from one form to another by mixing, blending, heating or chemical reaction,
      by hand or using handheld tools and equipment.
    es: Transformar materiales de una forma a otra mediante mezcla, combinación, calentamiento o reacción
      química, a mano o con herramientas y equipos portátiles.
  S6.3.1:
    nombre: preparar mezclas o soluciones
    en: Mixing and blending various types of solid or liquid materials, by hand or using handheld tools
      and equipment.
    es: Mezclar y combinar diversos tipos de materiales sólidos o líquidos, a mano o con herramientas
      y equipos portátiles.
  S6.3.3:
    nombre: preparar materiales industriales para su transformación o uso
    en: Preparing various types of materials for further processing or for use, by employing techniques
      such as heating, skimming to remove impurities or immersing objects in cleaning or coating solutions.
    es: Preparar diversos tipos de materiales para su procesamiento posterior o para su uso, empleando
      técnicas como el calentamiento, el desnatado para eliminar impurezas o la inmersión de objetos en
      soluciones de limpieza o recubrimiento.
  S6.3.6:
    nombre: recoger y preparar muestras o materiales para hacer ensayos
    en: Taking, preparing or preserving as required samples or specimens of products, liquids chemicals
      or organic materials in order for them to be ready for testing and analysis.
    es: Tomar, preparar o conservar, según corresponda, muestras o especímenes de productos, líquidos,
      sustancias químicas o materiales orgánicos para que estén listos para su ensayo y análisis.
  S6.4:
    nombre: ocuparse de plantas y cultivos
    en: Propagating, cultivating, pruning, caring for and harvesting plants and crops.
    es: Propagar, cultivar, podar, cuidar y cosechar plantas y cultivos.
  S6.4.0:
    nombre: ocuparse de plantas y cultivos
    en: Propagating, cultivating, pruning, caring for and harvesting plants and crops.
    es: Propagar, cultivar, podar, cuidar y cosechar plantas y cultivos.
  S6.4.1:
    nombre: cultivar terrenos y plantar cultivos
    en: Preparing and maintaining land for agricultural or horticultural use and promoting the growth
      of plants.
    es: Preparar y mantener terrenos para uso agrícola u hortícola y favorecer el crecimiento de las plantas.
  S6.4.2:
    nombre: plantar cultivos, árboles u otras especies vegetales
    en: Propagating and planting trees, flowers and other plants for production of food crops and other
      products, enhancing the environment or for scientific research.
    es: Propagar y plantar árboles, flores y otras plantas para la producción de cultivos alimentarios
      y otros productos, la mejora del medio ambiente o la investigación científica.
  S6.4.3:
    nombre: podar, cortar y cosechar árboles, cultivos y otras plantas
    en: Reducing the size, removing limbs, or cutting down trees, shrubs and other crops, by hand or with
      hand-held tools for purposes such as improving appearance, promoting the growth of fruits, and harvesting.
    es: Reducir el tamaño, eliminar ramas o talar árboles, arbustos y otros cultivos, a mano o con herramientas
      portátiles, con fines como mejorar su apariencia, favorecer el crecimiento de los frutos y cosechar.
  S6.5:
    nombre: ensamblar y fabricar productos
    en: Fabricating, assembling or repairing products or work aids by hand, or using hand-held tools and
      equipment.
    es: Fabricar, ensamblar o reparar productos o ayudas de trabajo a mano o con herramientas y equipos
      portátiles.
  S6.5.0:
    nombre: ensamblar y fabricar productos
    en: Fabricating, assembling or repairing products or work aids by hand, or using hand-held tools and
      equipment.
    es: Fabricar, ensamblar o reparar productos o ayudas de trabajo a mano o con herramientas y equipos
      portátiles.
  S6.5.1:
    nombre: fabricar instrumentos de precisión o artículos de joyería
    en: Assembling, fabricating or repairing precision instruments, such as optical devices, clocks and
      musical instruments, by hand or using hand-held tools and equipment.
    es: Ensamblar, fabricar o reparar instrumentos de precisión, como dispositivos ópticos, relojes e
      instrumentos musicales, a mano o con herramientas y equipos portátiles.
  S6.5.2:
    nombre: fabricar productos sanitarios y prótesis
    en: Fabricating, maintaining or repairing medical, dental, orthotic or prosthetic devices.
    es: Fabricar, mantener o reparar dispositivos médicos, dentales, ortésicos o protésicos.
  S6.5.3:
    nombre: ensamblar productos eléctricos y electrónicos
    en: Assembling electrical and electronic products, excluding medical or prosthetic devices, by hand
      or using hand-held tools and equipment.
    es: Ensamblar productos eléctricos y electrónicos, excepto dispositivos médicos o protésicos, a mano
      o con herramientas y equipos portátiles.
  S6.5.4:
    nombre: ensamblar productos mecánicos
    en: Assembling mechanical products by hand or using hand-held tools and equipment.
    es: Ensamblar productos mecánicos a mano o con herramientas y equipos portátiles.
  S6.5.5:
    nombre: ensamblar muebles
    en: Assembling and repairing furniture by hand or using hand-held tools and equipment.
    es: Ensamblar y reparar muebles a mano o con herramientas y equipos portátiles.
  S6.5.6:
    nombre: fabricar prendas de vestir y productos textiles
    en: Fabricating, altering and repairing garments and textile products by hand or using hand-held tools
      and equipment.
    es: Fabricar, modificar y reparar prendas de vestir y productos textiles a mano o con herramientas
      y equipos portátiles.
  S6.5.7:
    nombre: fabricar productos alimenticios y afines
    en: Fabricating food, drink and related products by hand or using hand-held tools and equipment.
    es: Fabricar alimentos, bebidas y productos afines a mano o con herramientas y equipos portátiles.
  S6.5.8:
    nombre: fabricar productos del tabaco
    en: Fabricating tobacco products by hand or using hand-held tools and equipment.
    es: Fabricar productos del tabaco a mano o con herramientas y equipos portátiles.
  S6.6:
    nombre: elaborar moldes, formas, modelos y patrones
    en: Making moulds, casts and two-dimensional patterns or templates and making three-dimensional models
      of products.
    es: Elaborar moldes, vaciados y patrones o plantillas bidimensionales, y elaborar modelos tridimensionales
      de productos.
  S6.6.1:
    nombre: elaborar moldes y vaciadores de producción
    en: Constructing moulds for the manufacture of objects in various materials, and making casts by filling
      moulds with liquid materials for solidification.
    es: Construir moldes para la fabricación de objetos en diversos materiales y elaborar vaciados rellenando
      los moldes con materiales líquidos para su solidificación.
  S6.6.2:
    nombre: elaborar patrones y plantillas
    en: Creating two dimensional patterns or templates for purposes such as cutting and fabricating articles
      in different shapes and sizes, or placement of items.
    es: Crear patrones o plantillas bidimensionales con fines como cortar y fabricar artículos de diferentes
      formas y tamaños, o colocar elementos.
  S6.6.3:
    nombre: elaborar modelos
    en: Constructing physical three-dimensional models of products.
    es: Construir modelos físicos tridimensionales de productos.
  S6.7:
    nombre: utilizar herramientas manuales
    en: Using the hands and tools that can be held in the hands, including power tools.
    es: Utilizar las manos y herramientas que pueden sostenerse con las manos, incluidas las herramientas
      eléctricas.
  S6.7.0:
    nombre: utilizar herramientas manuales
    en: Using the hands and tools that can be held in the hands, including power tools.
    es: Utilizar las manos y herramientas que pueden sostenerse con las manos, incluidas las herramientas
      eléctricas.
  S6.7.1:
    nombre: cortar materiales y taladrar orificios
    en: Cutting various types of materials using handheld tools and equipment.
    es: Cortar diversos tipos de materiales con herramientas y equipos portátiles.
  S6.7.2:
    nombre: configurar materiales para crear productos
    en: Altering the shape of various types of materials by hand or using hand tools.
    es: Modificar la forma de diversos tipos de materiales a mano o con herramientas manuales.
  S6.7.3:
    nombre: pulir superficies de objetos o equipos
    en: Creating smooth surfaces on various types of materials and employing techniques such as grinding,
      planing, sanding and polishing, using handheld tools.
    es: Crear superficies lisas en diversos tipos de materiales empleando técnicas como el amolado, el
      cepillado, el lijado y el pulido, con herramientas portátiles.
  S6.7.4:
    nombre: utilizar herramientas manuales de precisión
    en: Using hand-held electronic, mechanical, electric, or optical tools for precision work.
    es: Utilizar herramientas portátiles electrónicas, mecánicas, eléctricas u ópticas para trabajos de
      precisión.
  S6.7.5:
    nombre: martillar, clavar y remachar
    en: Using manual or powered hand-held hammers, chisels, nail guns and riveting equipment.
    es: Utilizar martillos, cinceles, pistolas de clavos y equipos de remachado portátiles, manuales o
      eléctricos.
  S6.8:
    nombre: colocar materiales, herramientas o equipos
    en: Placing workpieces, materials, tools or equipment in the correct position for assembly or further
      work.
    es: Colocar piezas de trabajo, materiales, herramientas o equipos en la posición correcta para su
      ensamblaje o para trabajos posteriores.
  S6.8.0:
    nombre: colocar materiales, herramientas o equipos
    en: Placing workpieces, materials, tools or equipment in the correct position for assembly or further
      work.
    es: Colocar piezas de trabajo, materiales, herramientas o equipos en la posición correcta para su
      ensamblaje o para trabajos posteriores.
  S6.8.1:
    nombre: colocar herramientas o equipos
    en: Placing tools or equipment in the correct position for use.
    es: Colocar herramientas o equipos en la posición correcta para su uso.
  S6.8.2:
    nombre: colocar piezas de trabajo o materiales
    en: Positioning workpieces, components or materials on equipment or in position for assembly.
    es: Posicionar piezas de trabajo, componentes o materiales en equipos o en la posición adecuada para
      su ensamblaje.
  S6.9:
    nombre: manipular animales
    en: Handling, moving, feeding and caring for live animals.
    es: Manipular, desplazar, alimentar y cuidar animales vivos.
  S6.9.0:
    nombre: manipular animales
    en: Handling, moving, feeding and caring for live animals.
    es: Manipular, desplazar, alimentar y cuidar animales vivos.
  S6.9.1:
    nombre: cuidar y criar animales
    en: Breeding, raising and tending non-aquatic livestock such as cattle, poultry, and honeybees.
    es: Reproducir, criar y cuidar ganado no acuático, como bovinos, aves de corral y abejas melíferas.
  S6.9.2:
    nombre: cuidar y criar animales acuáticos
    en: Breeding, raising and harvesting aquatic and aquaculture stock such as fin fish and shellfish.
    es: Reproducir, criar y cosechar especies acuáticas y de acuicultura, como peces y mariscos.
  S6.9.3:
    nombre: desplazar y pastorear animales
    en: Directing, controlling or restraining the movement of live animals to move them into vehicles
      pens, feeding areas and other enclosed spaces, or to facilitate grooming, veterinary procedures
      or slaughter.
    es: Dirigir, controlar o contener el movimiento de animales vivos para trasladarlos a vehículos, corrales,
      zonas de alimentación y otros espacios cerrados, o para facilitar su aseo, los procedimientos veterinarios
      o el sacrificio.
  S6.9.4:
    nombre: cazar, capturar y sacrificar animales
    en: Hunting, trapping or capturing animal wildlife or birds, or slaughter captive animals, for purposes
      such as gaining food or animal products, pest control or wildlife management.
    es: Cazar, atrapar o capturar fauna silvestre o aves, o sacrificar animales en cautiverio, con fines
      como la obtención de alimentos o productos de origen animal, el control de plagas o la gestión de
      la fauna silvestre.
  S6.9.5:
    nombre: alimentar y asear animales
    en: Feeding and grooming domestic and captive animals of all types including aquatic.
    es: Alimentar y asear animales domésticos y en cautiverio de todo tipo, incluidos los acuáticos.
  S6.9.6:
    nombre: adiestrar animales
    en: Training animals to facilitate their routine husbandry, for professional purposes or as companion
      animals, for treatment, and/or public demonstrations.
    es: Adiestrar animales para facilitar su manejo rutinario, con fines profesionales o como animales
      de compañía, para tratamiento y/o para exhibiciones públicas.
  S6.9.7:
    nombre: proporcionar tratamiento terapéutico o veterinario para animales
    en: Diagnosing and treating health conditions in animals and providing veterinary services such as
      artificial insemination and implanting microchips.
    es: Diagnosticar y tratar afecciones de salud en animales y prestar servicios veterinarios como la
      inseminación artificial y la implantación de microchips.
  S7:
    nombre: construir
    en: Building, repairing, installing and finishing interior and exterior structures.
    es: Construir, reparar, instalar y dar terminaciones a estructuras interiores y exteriores.
  S7.0:
    nombre: construir
    en: Building, repairing, installing and finishing interior and exterior structures.
    es: Construir, reparar, instalar y dar terminaciones a estructuras interiores y exteriores.
  S7.0.0:
    nombre: construir
    en: Building, repairing, installing and finishing interior and exterior structures.
    es: Construir, reparar, instalar y dar terminaciones a estructuras interiores y exteriores.
  S7.1:
    nombre: construir y repara estructuras
    en: Forming, shaping and joining materials to form structures such as buildings, bridges, or underground
      mines according to specifications and plans.
    es: Formar, dar forma y unir materiales para construir estructuras como edificios, puentes o minas
      subterráneas, de acuerdo con especificaciones y planos.
  S7.1.0:
    nombre: construir y repara estructuras
    en: Forming, shaping and joining materials to form structures such as buildings, bridges, or underground
      mines according to specifications and plans.
    es: Formar, dar forma y unir materiales para construir estructuras como edificios, puentes o minas
      subterráneas, de acuerdo con especificaciones y planos.
  S7.1.1:
    nombre: instalar materiales de mampostería estructural
    en: Forming structures using masonry materials such as bricks, stone, blocks, and mortar.
    es: Construir estructuras utilizando materiales de mampostería como ladrillos, piedra, bloques y mortero.
  S7.1.2:
    nombre: instalar componentes estructurales de metal
    en: Installing and assembling metal parts such as steel girders, frames and reinforcing rods.
    es: Instalar y montar piezas metálicas como vigas de acero, armazones y barras de refuerzo.
  S7.1.3:
    nombre: instalar componentes estructurales de madera
    en: Installing, assembling and repairing structural timber such as beams and trusses.
    es: Instalar, montar y reparar madera estructural, como vigas y cerchas.
  S7.1.4:
    nombre: instalar componentes de hormigón
    en: Setting concrete forms and pouring concrete for construction of footings, pilings, pillars and
      walls for buildings, bridges and other structures.
    es: Colocar encofrados y verter hormigón para la construcción de zapatas, pilotes, pilares y muros
      de edificios, puentes y otras estructuras.
  S7.1.5:
    nombre: instalar cubiertas
    en: Constructing, installing and maintaining roofs and gutters.
    es: Construir, instalar y mantener techos y canaletas.
  S7.1.6:
    nombre: unir piezas mediante técnicas de soldadura blanda, soldadura o soldadura fuerte.
    en: Joining together pieces of metal by applying heat using soldering, welding or brazing techniques.
    es: Unir piezas de metal mediante la aplicación de calor, utilizando técnicas de soldadura blanda,
      soldadura o soldadura fuerte.
  S7.1.7:
    nombre: instalar y montar elementos de construcción
    en: Installing, assembling or constructing building fixtures such as drywall, doors, windows and staircases.
    es: Instalar, montar o construir elementos de construcción como paneles de yeso, puertas, ventanas
      y escaleras.
  S7.1.8:
    nombre: instalar y montar aparejos
    en: Installing and assembling rigging equipment such as cables, ropes, pulleys and winches to safely
      secure high structures or lift heavy weights.
    es: Instalar y montar equipos de aparejo como cables, cuerdas, poleas y cabrestantes para asegurar
      de forma segura estructuras altas o levantar cargas pesadas.
  S7.2:
    nombre: instalar infraestructura interior o exterior
    en: Installing, repairing and testing systems and their components in buildings and other structures
      such as trains and aircraft.
    es: Instalar, reparar y probar sistemas y sus componentes en edificios y otras estructuras, como trenes
      y aeronaves.
  S7.2.0:
    nombre: instalar infraestructura interior o exterior
    en: Installing, repairing and testing systems and their components in buildings and other structures
      such as trains and aircraft.
    es: Instalar, reparar y probar sistemas y sus componentes en edificios y otras estructuras, como trenes
      y aeronaves.
  S7.2.1:
    nombre: instalar equipos de calefacción, ventilación y aire acondicionado
    en: Installing and repairing heating, ventilation and air conditioning equipment.
    es: Instalar y reparar equipos de calefacción, ventilación y aire acondicionado.
  S7.2.2:
    nombre: instalar equipos o sistemas de fontanería o canalización
    en: Installing plumbing or piping equipment or systems.
    es: Instalar equipos o sistemas de plomería o canalización.
  S7.2.3:
    nombre: instalar materiales de aislamiento
    en: Installing materials to insulate a structure from thermic or acoustic influences and to prevent
      fire.
    es: Instalar materiales para aislar una estructura de influencias térmicas o acústicas y para prevenir
      incendios.
  S7.3:
    nombre: rematar estructuras interiores o exteriores
    en: Applying interior and exterior finishes to buildings and other structures.
    es: Aplicar acabados interiores y exteriores a edificios y otras estructuras.
  S7.3.1:
    nombre: aplicar material para rellenar huecos en las superficies
    en: Applying various types of material to fill or seal gaps in the surfaces of walls, floors, furnishings
      vehicles or other items.
    es: Aplicar diversos tipos de material para rellenar o sellar huecos en las superficies de paredes,
      pisos, mobiliario, vehículos u otros objetos.
  S7.3.2:
    nombre: aplicar recubrimientos texturizados o de mampostería
    en: Applying plaster or similar materials to a surface.
    es: Aplicar yeso o materiales similares a una superficie.
  S7.3.3:
    nombre: aplicar soluciones o recubrimientos protectores o decorativos
    en: Applying paint, lacquer, wallpaper or other coatings to surfaces or objects using brushes, rollers,
      paint spray guns or similar equipment.
    es: Aplicar pintura, laca, papel tapiz u otros recubrimientos a superficies u objetos utilizando brochas,
      rodillos, pistolas de pintura o equipos similares.
  S7.3.4:
    nombre: instalar revestimientos de suelos y paredes
    en: Installing various types of floor and wall coverings, including tiling, carpets, linoleum and
      parquet.
    es: Instalar diversos tipos de revestimientos de pisos y paredes, como baldosas, alfombras, linóleo
      y parqué.
  S8:
    nombre: trabajar con maquinaria y equipo especializado
    en: Controlling, operating and monitoring vehicles, stationary and mobile machinery and precision
      instrumentation and equipment.
    es: Controlar, operar y supervisar vehículos, maquinaria fija y móvil, e instrumentos y equipos de
      precisión.
  S8.0:
    nombre: trabajar con maquinaria y equipo especializado
    en: Controlling, operating and monitoring vehicles, stationary and mobile machinery and precision
      instrumentation and equipment.
    es: Controlar, operar y supervisar vehículos, maquinaria fija y móvil, e instrumentos y equipos de
      precisión.
  S8.0.0:
    nombre: trabajar con maquinaria y equipo especializado
    en: Controlling, operating and monitoring vehicles, stationary and mobile machinery and precision
      instrumentation and equipment.
    es: Controlar, operar y supervisar vehículos, maquinaria fija y móvil, e instrumentos y equipos de
      precisión.
  S8.1:
    nombre: operar maquinaria móvil
    en: Controlling the operation of machinery whose mobility is an integral part of its function, such
      as earthmoving, agricultural, forestry and lifting equipment.
    es: Controlar el funcionamiento de maquinaria cuya movilidad es parte integral de su función, como
      equipos de movimiento de tierras, agrícolas, forestales y de elevación.
  S8.1.1:
    nombre: manejar equipos de movimiento de tierras
    en: Operating equipment for moving, excavating, smoothing or shaping earth
    es: Manejar equipos para mover, excavar, nivelar o dar forma a la tierra.
  S8.1.2:
    nombre: manejar equipos agrícolas o forestales
    en: Operating mobile equipment specifically designed for agricultural or forestry purposes, such as
      cultivating land or harvesting crops and trees.
    es: Manejar equipos móviles diseñados específicamente para fines agrícolas o forestales, como el cultivo
      de la tierra o la cosecha de cultivos y árboles.
  S8.1.3:
    nombre: manejar equipos de elevación o de transporte
    en: Operating equipment for lifting and moving objects, such as cranes, hoists, cable cars and lifting
      trucks.
    es: Manejar equipos para levantar y trasladar objetos, como grúas, polipastos, teleféricos y autoelevadores.
  S8.2:
    nombre: conducir vehículos
    en: Driving vehicles on or off road, such as motorcycles, cars, vans, trucks and buses, for the transportation
      of goods or people by road.
    es: Conducir vehículos dentro o fuera de la carretera, como motocicletas, automóviles, furgonetas,
      camiones y autobuses, para el transporte de mercancías o personas por carretera.
  S8.2.0:
    nombre: conducir vehículos
    en: Driving vehicles on or off road, such as motorcycles, cars, vans, trucks and buses, for the transportation
      of goods or people by road.
    es: Conducir vehículos dentro o fuera de la carretera, como motocicletas, automóviles, furgonetas,
      camiones y autobuses, para el transporte de mercancías o personas por carretera.
  S8.2.1:
    nombre: conducir vehículos pesados
    en: Driving heavy vehicles, such as heavy trucks and buses, for the transportation of goods or people
      by road.
    es: Conducir vehículos pesados, como camiones pesados y autobuses, para el transporte de mercancías
      o personas por carretera.
  S8.2.2:
    nombre: conducir vehículos ligeros
    en: Controlling the movement of light vehicles such as motorcycles cars, taxis, vans and light trucks.
    es: Controlar el desplazamiento de vehículos ligeros, como motocicletas, automóviles, taxis, furgonetas
      y camiones ligeros.
  S8.2.3:
    nombre: manejar vehículos ferroviarios
    en: Controlling the movement of rail vehicles such as trains and trams.
    es: Controlar el desplazamiento de vehículos ferroviarios, como trenes y tranvías.
  S8.3:
    nombre: operar vehículos acuáticos
    en: Operating and controlling the movement of watercraft and underwater vessels, including ships,
      boats and other types of vessel.
    es: Operar y controlar el desplazamiento de embarcaciones y vehículos subacuáticos, incluidos buques,
      botes y otros tipos de embarcaciones.
  S8.3.0:
    nombre: operar vehículos acuáticos
    en: Operating and controlling the movement of watercraft and underwater vessels, including ships,
      boats and other types of vessel.
    es: Operar y controlar el desplazamiento de embarcaciones y vehículos subacuáticos, incluidos buques,
      botes y otros tipos de embarcaciones.
  S8.4:
    nombre: operar maquinaria para la extracción y la transformación de materias primas
    en: Operating and monitoring various types of mechanically-controlled or computer-controlled stationary
      machinery for the extraction or processing of raw materials.
    es: Operar y supervisar diversos tipos de maquinaria fija controlada mecánicamente o por computadora
      para la extracción o la transformación de materias primas.
  S8.4.0:
    nombre: operar maquinaria para la extracción y la transformación de materias primas
    en: Operating and monitoring various types of mechanically-controlled or computer-controlled stationary
      machinery for the extraction or processing of raw materials.
    es: Operar y supervisar diversos tipos de maquinaria fija controlada mecánicamente o por computadora
      para la extracción o la transformación de materias primas.
  S8.4.1:
    nombre: manejar maquinaria de minería, extracción y tratamiento de minerales
    en: Operating machinery for the extraction and processing of rocks and minerals, or for drilling and
      boring wells and tunnels.
    es: Manejar maquinaria para la extracción y el tratamiento de rocas y minerales, o para la perforación
      de pozos y túneles.
  S8.4.2:
    nombre: manejar maquinaria de transformación y acabado de metales
    en: Operating and tending machinery for the processing and fabrication and finishing of metals and
      metal stock.
    es: Manejar y atender maquinaria para la transformación, fabricación y acabado de metales y productos
      metálicos.
  S8.4.3:
    nombre: manejar sistemas o equipos de bombeo
    en: Operating machinery and equipment for pumping liquids.
    es: Manejar maquinaria y equipos para el bombeo de líquidos.
  S8.4.4:
    nombre: manejar equipos de producción o distribución de energía
    en: Operating turbines, generators, boilers or power plants to generate rotary motion, electricity
      and heat. Operating energy transmission systems.
    es: Manejar turbinas, generadores, calderas o centrales eléctricas para generar movimiento rotatorio,
      electricidad y calor. Manejar sistemas de transmisión de energía.
  S8.4.5:
    nombre: manejar sistemas o equipos de tratamiento de petróleo, sustancias químicas o agua
    en: Operating machinery for producing, refining or purifying petroleum, chemicals, gases or water.
    es: Manejar maquinaria para producir, refinar o purificar petróleo, sustancias químicas, gases o agua.
  S8.4.6:
    nombre: manejar maquinaria de transformación de madera y fabricación de papel
    en: Operating machinery for processing wood and timber, and for production of wood pulp and paper.
    es: Manejar maquinaria para la transformación de madera y la producción de pasta de madera y papel.
  S8.4.7:
    nombre: manejar hornos, fraguas y equipos de secado
    en: Operating, monitoring and adjusting the controls of equipment for heating or drying materials
      and products at high temperatures, such as kilns or furnaces.
    es: Manejar, supervisar y ajustar los controles de equipos para calentar o secar materiales y productos
      a altas temperaturas, como hornos de secado u hornos industriales.
  S8.5:
    nombre: operar maquinaria para la fabricación de productos
    en: Operating and monitoring various types of mechanically-controlled or computer-controlled stationary
      machinery for the manufacture of goods.
    es: Operar y supervisar diversos tipos de maquinaria fija controlada mecánicamente o por computadora
      para la fabricación de productos.
  S8.5.0:
    nombre: operar maquinaria para la fabricación de productos
    en: Operating and monitoring various types of mechanically-controlled or computer-controlled stationary
      machinery for the manufacture of goods.
    es: Operar y supervisar diversos tipos de maquinaria fija controlada mecánicamente o por computadora
      para la fabricación de productos.
  S8.5.1:
    nombre: manejar maquinaria de pintura o revestimiento
    en: Operating machinery to apply paints or coatings to the surface of products or materials.
    es: Manejar maquinaria para aplicar pinturas o recubrimientos a la superficie de productos o materiales.
  S8.5.2:
    nombre: manejar maquinaria de embalaje, envasado y empaquetado
    en: Operating, tending and monitoring machinery for packaging or bottling products.
    es: Manejar, atender y supervisar maquinaria para embalar o envasar productos.
  S8.5.3:
    nombre: manejar maquinaria para la fabricación y el tratamiento de productos textiles, de pieles y
      de cuero
    en: Operating and tending machinery for the manufacture and treatment of textiles, fur and leather
      products.
    es: Manejar y atender maquinaria para la fabricación y el tratamiento de productos textiles, de pieles
      y de cuero.
  S8.5.4:
    nombre: manejar maquinaria de transformación de alimentos
    en: Operating and tending machinery for the processing of food and other organic materials and for
      the manufacture of food and related products.
    es: Manejar y atender maquinaria para la transformación de alimentos y otros materiales orgánicos,
      y para la fabricación de alimentos y productos afines.
  S8.5.5:
    nombre: manejar maquinaria de mezclado y separación
    en: Operating machinery for mixing, blending and separating liquid or solid materials.
    es: Manejar maquinaria para mezclar, combinar y separar materiales líquidos o sólidos.
  S8.5.6:
    nombre: manejar equipos de producción de material impreso y fotográfico
    en: Operating and tending machinery for printing and photographic reproduction.
    es: Manejar y atender maquinaria de impresión y de reproducción fotográfica.
  S8.5.7:
    nombre: manejar equipos de conformación de metal, plástico o caucho
    en: Operating and tending machinery to mould, press, or form metal, plastic, rubber or other materials
      into a particular shape.
    es: Manejar y atender maquinaria para moldear, prensar o conformar metal, plástico, caucho u otros
      materiales con una forma determinada.
  S8.5.8:
    nombre: manejar máquinas de corte, rectificado y pulido
    en: Operating and tending machinery to cut grind and smooth work pieces made of metal, wood, plastic
      or various other materials.
    es: Manejar y atender maquinaria para cortar, rectificar y pulir piezas de trabajo de metal, madera,
      plástico u otros materiales diversos.
  S8.6:
    nombre: utilizar instrumentos y equipos de precisión
    en: Controlling, monitoring, and adjusting precision instrumentation and equipment for a wide range
      of purposes.
    es: Controlar, supervisar y ajustar instrumentos y equipos de precisión para una amplia variedad de
      fines.
  S8.6.0:
    nombre: utilizar instrumentos y equipos de precisión
    en: Controlling, monitoring, and adjusting precision instrumentation and equipment for a wide range
      of purposes.
    es: Controlar, supervisar y ajustar instrumentos y equipos de precisión para una amplia variedad de
      fines.
  S8.6.1:
    nombre: manejar material médico
    en: Controlling, monitoring, and adjusting precision instrumentation and equipment used for diagnosing
      and treatment of medical conditions.
    es: Controlar, supervisar y ajustar instrumentos y equipos de precisión utilizados para el diagnóstico
      y el tratamiento de afecciones médicas.
  S8.6.2:
    nombre: manejar equipos audiovisuales operativos
    en: Controlling, monitoring, and adjusting precision instrumentation and equipment for recording of
      sound, video and images, and for use in live performances or exhibitions.
    es: Controlar, supervisar y ajustar instrumentos y equipos de precisión para la grabación de sonido,
      video e imágenes, y para su uso en espectáculos en vivo o exposiciones.
  S8.6.3:
    nombre: manejar equipos científicos y de laboratorio
    en: Controlling, monitoring, and adjusting precision instrumentation and equipment for the conduct
      of scientific experiments and diagnostic tests.
    es: Controlar, supervisar y ajustar instrumentos y equipos de precisión para la realización de experimentos
      científicos y pruebas de diagnóstico.
  S8.6.4:
    nombre: manejar equipos de comunicaciones
    en: Controlling, monitoring, and adjusting telecommunication, navigation, radio transmission or broadcasting
      equipment.
    es: Controlar, supervisar y ajustar equipos de telecomunicaciones, navegación, radiotransmisión o
      radiodifusión.
  S8.6.5:
    nombre: manejar equipos industriales de precisión
    en: Controlling, monitoring, and adjusting precision instrumentation and equipment for industrial
      production.
    es: Controlar, supervisar y ajustar instrumentos y equipos de precisión para la producción industrial.
  S8.6.6:
    nombre: utilizar herramientas de medición de precisión
    en: Using, reading and monitoring instruments and equipment for precise measurement.
    es: Utilizar, leer y supervisar instrumentos y equipos de medición de precisión.
  S8.7:
    nombre: instalar, mantener y reparar equipos mecánicos
    en: Installing, maintaining and repairing stationary and mobile mechanical equipment, components and
      devices.
    es: Instalar, mantener y reparar equipos, componentes y dispositivos mecánicos fijos y móviles.
  S8.7.0:
    nombre: instalar, mantener y reparar equipos mecánicos
    en: Installing, maintaining and repairing stationary and mobile mechanical equipment, components and
      devices.
    es: Instalar, mantener y reparar equipos, componentes y dispositivos mecánicos fijos y móviles.
  S8.7.1:
    nombre: reparar e instalar equipos mecánicos
    en: Repairing, dismantling, reassembling and installing stationary and mobile mechanical equipment,
      components and devices.
    es: Reparar, desmontar, volver a montar e instalar equipos, componentes y dispositivos mecánicos fijos
      y móviles.
  S8.7.2:
    nombre: mantener equipos mecánicos
    en: Perform basic or general maintenance of mechanical equipment, components and devices to ensure
      continued or optimal functioning.
    es: Realizar el mantenimiento básico o general de equipos, componentes y dispositivos mecánicos para
      garantizar su funcionamiento continuo u óptimo.
  S8.8:
    nombre: instalar, mantener y reparar equipos eléctricos, electrónicos y de precisión
    en: Installing, setting-up, maintaining and repairing electrical and electronic equipment, and control
      systems, scientific devices, instrumentation and precision equipment.
    es: Instalar, configurar, mantener y reparar equipos eléctricos y electrónicos, así como sistemas
      de control, dispositivos científicos, instrumentación y equipos de precisión.
  S8.8.0:
    nombre: instalar, mantener y reparar equipos eléctricos, electrónicos y de precisión
    en: Installing, setting-up, maintaining and repairing electrical and electronic equipment, and control
      systems, scientific devices, instrumentation and precision equipment.
    es: Instalar, configurar, mantener y reparar equipos eléctricos y electrónicos, así como sistemas
      de control, dispositivos científicos, instrumentación y equipos de precisión.
  S8.8.1:
    nombre: instalar y reparar aparatos eléctricos, electrónicos y de precisión
    en: Installing, setting-up, and repairing electrical, electronic, mechatronic and precision equipment,
      and control systems, scientific and medical devices, instrumentation and precision equipment.
    es: Instalar, configurar y reparar equipos eléctricos, electrónicos, mecatrónicos y de precisión,
      así como sistemas de control, dispositivos científicos y médicos, instrumentación y equipos de precisión.
  S8.8.2:
    nombre: mantener aparatos eléctricos, electrónicos y de precisión
    en: Maintaining electrical and electronic and mechatronic equipment, control systems, scientific and
      medical devices, instrumentation and precision equipment to ensure continued or optimal functioning.
    es: Mantener equipos eléctricos, electrónicos y mecatrónicos, sistemas de control, dispositivos científicos
      y médicos, instrumentación y equipos de precisión para garantizar su funcionamiento continuo u óptimo.
  S8.9:
    nombre: operar aeronaves
    en: Controlling the movement of aircraft, including fixed wing aircraft, helicopters and drones.
    es: Controlar el movimiento de aeronaves, incluidas aeronaves de ala fija, helicópteros y drones.
  S8.9.0:
