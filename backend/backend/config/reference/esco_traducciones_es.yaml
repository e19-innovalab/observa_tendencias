  L1:
    nombre: Lenguas
    en: Ability to communicate through reading, writing, speaking and listening in the mother tongue and/or
      in a foreign language.
    es: Capacidad de comunicarse mediante la lectura, la escritura, la expresión oral y la comprensión
      auditiva en la lengua materna y/o en una lengua extranjera.
  L2:
    nombre: lenguas clásicas
    en: All dead languages, no longer actively used, originating from various periods in history, such
      as Latin from Antiquity, Middle English from the Middle Ages, Classical Maya from the Pre-colonial
      Americas, and Renaissance Italian from the Early Modern Period.
    es: Todas las lenguas muertas, que ya no se utilizan activamente, procedentes de distintos períodos
      de la historia, como el latín de la Antigüedad, el inglés medio de la Edad Media, el maya clásico
      de la América precolonial y el italiano renacentista de la Edad Moderna temprana.
  S1:
