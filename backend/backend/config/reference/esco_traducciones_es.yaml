      or using handheld tools and equipment. Tending plants, crops and animals.
    es: Clasificar, ordenar, mover, transformar, fabricar y limpiar mercancías y materiales a mano o utilizando
      herramientas y equipos manuales. Cuidar plantas, cultivos y animales.
  S6.0:
    nombre: manipular y mover
    en: Sorting, arranging, moving, transforming, fabricating and cleaning goods and materials by hand
      or using handheld tools and equipment. Tending plants, crops and animals.
    es: Clasificar, ordenar, mover, transformar, fabricar y limpiar mercancías y materiales a mano o utilizando
      herramientas y equipos manuales. Cuidar plantas, cultivos y animales.
  S6.0.0:
    nombre: manipular y mover
