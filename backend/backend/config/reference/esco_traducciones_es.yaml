    en: Writing text or composing music, creating original work with regard to format, style and content.
    es: Escribir textos o componer música, creando obras originales en cuanto a formato, estilo y contenido.
  S1.13.1:
    nombre: componer música
    en: Composing and arranging music.
    es: Componer y arreglar música.
  S1.13.2:
    nombre: escritura artística y creativa
    en: Writing original text of a creative nature for artistic, journalistic, promotional or similar
      purposes.
    es: Escribir textos originales de carácter creativo con fines artísticos, periodísticos, promocionales
      o similares.
  S1.13.3:
    nombre: escritura técnica o académica
    en: Writing original text of a primarily functional, technical or academic nature; editing text.
    es: Escribir textos originales de carácter principalmente funcional, técnico o académico; editar textos.
  S1.14:
    nombre: actuar y entretener
    en: Undertaking activities to entertain an audience or improve personal abilities.
    es: Realizar actividades para entretener a un público o mejorar las capacidades personales.
  S1.14.1:
    nombre: practicar deportes
    en: Performing and practising athletic activities for fitness, competition, or artistic purposes.
    es: Realizar y practicar actividades deportivas con fines de acondicionamiento físico, competencia
      o artísticos.
  S1.14.2:
    nombre: realizar actividades artísticas o culturales
    en: Performing, practising or rehearsing music, dance, drama, ceremonies or other types of performance
      (excluding athletic performance) for a live audience, or as part of a recording session.
    es: Interpretar, practicar o ensayar música, danza, teatro, ceremonias u otros tipos de actuación
      (excepto la actuación deportiva) ante un público en vivo o como parte de una sesión de grabación.
  S1.14.3:
    nombre: llevar a cabo actividades de juegos de azar
    en: Carrying out gaming operations in gambling establishments and participating in gambling games.
    es: Llevar a cabo operaciones de juego en establecimientos de juegos de azar y participar en juegos
      de azar.
  S1.15:
    nombre: utilizar más de una lengua
    en: Using more than one language or dialect to communicate verbally or in written form, or to translate
      from one language to another.
    es: Utilizar más de una lengua o dialecto para comunicarse de forma oral o escrita, o para traducir
      de una lengua a otra.
  S1.15.1:
    nombre: utilizar lenguas extranjeras
    en: Communicating with others in one or more foreign languages or dialects, in spoken or written forms.
    es: Comunicarse con otras personas en una o más lenguas o dialectos extranjeros, de forma oral o escrita.
  S1.15.2:
    nombre: traducir e interpretar
    en: Translate one language into another language in written or spoken form. Match words and expressions
      with their corresponding brothers in other languages, while making sure that the message and nuances
      of the original text are preserved.
    es: Traducir de una lengua a otra de forma escrita u oral. Hacer corresponder palabras y expresiones
      con sus equivalentes en otras lenguas, asegurándose de que se preserven el mensaje y los matices
      del texto original.
  S1.2:
    nombre: actuar como enlace y crear redes de contactos
    en: Developing alliances, contacts or partnerships, and exchanging information with others.
    es: Desarrollar alianzas, contactos o asociaciones, e intercambiar información con otras personas.
  S1.2.0:
    nombre: actuar como enlace y crear redes de contactos
    en: Developing alliances, contacts or partnerships, and exchanging information with others.
    es: Desarrollar alianzas, contactos o asociaciones, e intercambiar información con otras personas.
  S1.2.1:
    nombre: coordinar actividades con otros
    en: Communicating and liaising with colleagues, clients and other agencies on operational matters,
      problems and activities. Cooperating and liaising with outside agencies, clients and other organisational
      units to adapt the timing and nature of the activities.
    es: Comunicarse y actuar como enlace con colegas, clientes y otros organismos sobre asuntos, problemas
      y actividades operativos. Cooperar y actuar como enlace con organismos externos, clientes y otras
      unidades de la organización para adaptar el calendario y la naturaleza de las actividades.
  S1.2.3:
    nombre: desarrollar redes o relaciones profesionales
    en: Developing alliances, contacts or partnerships with colleagues, clients and stakeholders.
    es: Desarrollar alianzas, contactos o asociaciones con colegas, clientes y partes interesadas.
  S1.2.4:
    nombre: defender necesidades individuales o comunitarias
    en: Delivering arguments in favour of something, such as a cause, idea, or policy, to benefit another
      person or a community.
    es: Presentar argumentos a favor de algo, como una causa, una idea o una política, en beneficio de
      otra persona o de una comunidad.
  S1.3:
    nombre: enseñar y formar
    en: Facilitating the acquisition of new knowledge and skills. Leading and guiding individuals and
      groups through a process in which they are taught the necessary skills and knowledge for life, future
      learning or for a particular job or set of jobs.
    es: Facilitar la adquisición de nuevos conocimientos y habilidades. Dirigir y guiar a personas y grupos
      a lo largo de un proceso en el que se les enseñan las habilidades y los conocimientos necesarios
      para la vida, el aprendizaje futuro o para un trabajo o conjunto de trabajos determinado.
  S1.3.0:
    nombre: enseñar y formar
    en: Facilitating the acquisition of new knowledge and skills. Leading and guiding individuals and
      groups through a process in which they are taught the necessary skills and knowledge for life, future
      learning or for a particular job or set of jobs.
    es: Facilitar la adquisición de nuevos conocimientos y habilidades. Dirigir y guiar a personas y grupos
      a lo largo de un proceso en el que se les enseñan las habilidades y los conocimientos necesarios
      para la vida, el aprendizaje futuro o para un trabajo o conjunto de trabajos determinado.
  S1.3.1:
    nombre: enseñar materias académicas o profesionales
    en: Instruct students in the theory and practice of academic or vocational subjects.
    es: Instruir a los estudiantes en la teoría y la práctica de materias académicas o profesionales.
  S1.3.2:
    nombre: enseñar procedimientos de seguridad
    en: Teaching safety procedures or standards to other people.
    es: Enseñar procedimientos o normas de seguridad a otras personas.
  S1.3.3:
    nombre: formar sobre procedimientos operativos
    en: Training employees, students or clients on operational procedures in the work place or and demonstrating
      the use of equipment or products.
    es: Formar a empleados, estudiantes o clientes sobre procedimientos operativos en el lugar de trabajo
      y demostrar el uso de equipos o productos.
  S1.3.4:
    nombre: formar sobre salud o temas médicos
    en: Training patients, health providers, or carers on health or hygiene practices, medical procedures
      or physcial fitness.
    es: Formar a pacientes, profesionales de la salud o cuidadores sobre prácticas de salud o higiene,
      procedimientos médicos o acondicionamiento físico.
  S1.3.5:
    nombre: proporcionar orientación y tutoría
    en: Actively helping individuals or groups to improve their strengths, life skills, performance, learning
      skills and confidence and to optimise specific methods, skills or abilities.
    es: Ayudar activamente a personas o grupos a mejorar sus fortalezas, habilidades para la vida, desempeño,
      habilidades de aprendizaje y confianza, y a optimizar métodos, habilidades o capacidades específicos.
  S1.4:
    nombre: presentar información
    en: Presenting oral or visual material to an audience in order to provide or interpret information.
    es: Presentar material oral o visual a un público con el fin de proporcionar o interpretar información.
  S1.4.0:
    nombre: presentar información
    en: Presenting oral or visual material to an audience in order to provide or interpret information.
    es: Presentar material oral o visual a un público con el fin de proporcionar o interpretar información.
  S1.4.1:
    nombre: presentar información general
    en: Presenting information of a non-technical nature to an audience.
    es: Presentar información de carácter no técnico a un público.
  S1.4.2:
    nombre: presentar investigación o información técnica
    en: Presenting information of a technical or academic nature to an audience, including presenting
      the results of research.
    es: Presentar información de carácter técnico o académico a un público, incluida la presentación de
      resultados de investigación.
  S1.4.3:
    nombre: presentar información en procedimientos judiciales
    en: Testifying, presenting evidence or representing clients during legal proceedings.
    es: Declarar como testigo, presentar pruebas o representar a clientes durante procedimientos judiciales.
  S1.5:
    nombre: prestar asesoramiento y consultoría
    en: Providing guidance and advice to enable decision-making about tasks, situations, and processes.
    es: Proporcionar orientación y asesoramiento para facilitar la toma de decisiones sobre tareas, situaciones
      y procesos.
  S1.5.0:
    nombre: prestar asesoramiento y consultoría
    en: Providing guidance and advice to enable decision-making about tasks, situations, and processes.
    es: Proporcionar orientación y asesoramiento para facilitar la toma de decisiones sobre tareas, situaciones
      y procesos.
  S1.5.1:
    nombre: asesorar sobre cuestiones jurídicas, reglamentarias o de procedimiento
    en: Discussing legal matters with clients, disputants, or legal professionals or staff. Explaining
      and providing advice to others on legal matters, regulations, policies or procedures.
    es: Tratar cuestiones jurídicas con clientes, partes en litigio o profesionales o personal del ámbito
      jurídico. Explicar y asesorar a otras personas sobre cuestiones jurídicas, reglamentos, políticas
      o procedimientos.
  S1.5.2:
    nombre: prestar asesoramiento financiero
    en: Explaining financial information and providing financial advice.
    es: Explicar información financiera y prestar asesoramiento financiero.
  S1.5.4:
    nombre: prestar asesoramiento médico
    en: Explaining medical and healthcare information to patients or family members and/or advising them
      on medical, health or wellness issues.
    es: Explicar información médica y sanitaria a pacientes o familiares o asesorarlos sobre cuestiones
      médicas, de salud o de bienestar.
  S1.5.5:
    nombre: asesorar sobre cuestiones ambientales
    en: Providing information and advice on environmental protection and sustainability.
    es: Proporcionar información y asesoramiento sobre protección ambiental y sostenibilidad.
  S1.5.6:
    nombre: asesorar sobre el diseño o el uso de tecnologías
    en: Providing information and advice on technological possibilities, developments and on the uses
      of technology.
    es: Proporcionar información y asesoramiento sobre las posibilidades tecnológicas, los avances y los
      usos de la tecnología.
  S1.5.7:
    nombre: asesorar sobre asuntos empresariales u operativos
    en: Providing information and advice to improve the efficiency of production and business operations.
    es: Proporcionar información y asesoramiento para mejorar la eficiencia de la producción y de las
      operaciones empresariales.
  S1.5.8:
    nombre: asesorar sobre educación o formación profesional
    en: Providing information, advice and guidance on educational and training courses, teaching and learning
      methods, careers or job search.
    es: Proporcionar información, asesoramiento y orientación sobre cursos de educación y formación, métodos
      de enseñanza y aprendizaje, carreras profesionales o búsqueda de empleo.
  S1.5.9:
    nombre: asesorar sobre cuestiones de salud y seguridad en el trabajo
    en: Promoting and providing information and advice on health and safety in the workplace.
    es: Promover y proporcionar información y asesoramiento sobre salud y seguridad en el lugar de trabajo.
  S1.6:
    nombre: promocionar, vender y comprar
    en: Using communication strategies or techniques to encourage acceptance of goods, services, or ideas,
      and to sell or buy and goods or services.
    es: Utilizar estrategias o técnicas de comunicación para fomentar la aceptación de bienes, servicios
      o ideas, y para vender o comprar bienes o servicios.
  S1.6.0:
    nombre: promocionar, vender y comprar
    en: Using communication strategies or techniques to encourage acceptance of goods, services, or ideas,
      and to sell or buy and goods or services.
    es: Utilizar estrategias o técnicas de comunicación para fomentar la aceptación de bienes, servicios
      o ideas, y para vender o comprar bienes o servicios.
  S1.6.1:
    nombre: vender productos o servicios
    en: Taking orders for and selling goods or services to individuals, households or enterprises.
    es: Tomar pedidos y vender bienes o servicios a personas, hogares o empresas.
  S1.6.2:
    nombre: promocionar productos, servicios o programas
    en: Promoting, advertising and marketing goods, services, programs or policies.
    es: Promocionar, publicitar y comercializar bienes, servicios, programas o políticas.
  S1.6.3:
    nombre: adquirir bienes o servicios
    en: Buying and ordering goods, services and supplies.
    es: Comprar y encargar bienes, servicios y suministros.
  S1.7:
    nombre: obtener información verbal
    en: Asking questions and listening to others to obtain information.
    es: Formular preguntas y escuchar a otras personas para obtener información.
  S1.7.1:
    nombre: entrevistar
    en: Interacting verbally in a formal way, usually using structured questioning, to collect information,
      determine opinions, or determine suitability of individuals for jobs, roles or tasks.
    es: Interactuar verbalmente de manera formal, por lo general mediante preguntas estructuradas, para
      recopilar información, conocer opiniones o determinar la idoneidad de las personas para puestos
      de trabajo, funciones o tareas.
  S1.7.2:
    nombre: colaborar con terceros para determinar las necesidades
    en: Engaging in discussions in order to identify expectations, requirements, desires, needs and problems
      of clients, co-workers, students and others.
    es: Participar en conversaciones con el fin de identificar las expectativas, los requisitos, los deseos,
      las necesidades y los problemas de clientes, compañeros de trabajo, estudiantes y otras personas.
  S1.7.3:
    nombre: escuchar y formular preguntas
    en: Listen carefully to what other people say, patiently understanding points being made, formulating
      and asking appropriate questions, without interrupting at inappropriate times.
    es: Escuchar con atención lo que dicen otras personas, comprendiendo con paciencia los argumentos
      planteados, formulando y haciendo las preguntas pertinentes, sin interrumpir en momentos inoportunos.
  S1.8:
    nombre: trabajar con otros
    en: Working with other people, understanding and respecting the roles and competencies of others.
    es: Trabajar con otras personas, comprendiendo y respetando sus funciones y competencias.
  S1.8.0:
    nombre: trabajar con otros
    en: Working with other people, understanding and respecting the roles and competencies of others.
    es: Trabajar con otras personas, comprendiendo y respetando sus funciones y competencias.
  S1.8.1:
    nombre: trabajar en equipo
    en: Working confidently within a group with each doing their part in the service of the whole. Understanding
      and respecting the roles and competencies of other team members.
    es: Trabajar con seguridad dentro de un grupo en el que cada uno hace su parte al servicio del conjunto.
      Comprender y respetar las funciones y competencias de los demás miembros del equipo.
  S1.8.2:
    nombre: dar instrucciones
    en: Giving instructions and directions to co-workers, subordinates or students or members of the public
      by employing various communication techniques. Adjusting communication style to the target audience
      in order to convey instructions as intended.
    es: Dar instrucciones e indicaciones a compañeros de trabajo, subordinados, estudiantes o miembros
      del público empleando diversas técnicas de comunicación. Adaptar el estilo de comunicación al público
      destinatario para transmitir las instrucciones tal como se pretende.
  S1.8.3:
    nombre: enviar comentarios de valoración
    en: Providing founded feedback on the performance of subordinates, co-workers and students through
      both criticism and praise in a respectful, clear, and consistent manner. Highlighting achievements
      as well as mistakes and set up methods of formative assessment.
    es: Proporcionar comentarios de valoración fundamentados sobre el desempeño de subordinados, compañeros
      de trabajo y estudiantes, mediante críticas y elogios, de manera respetuosa, clara y coherente.
      Destacar tanto los logros como los errores y establecer métodos de evaluación formativa.
  S1.8.4:
    nombre: aceptar comentarios de valoración
    en: React to valid and well-reasoned opinions and directions about one's work in a positive manner.
    es: Reaccionar de manera positiva ante opiniones e indicaciones válidas y bien fundamentadas sobre
      el propio trabajo.
  S1.8.5:
    nombre: seguir instrucciones y procedimientos
    en: Following instructions given verbally or in writing and following standard or agreed procedures.
    es: Seguir instrucciones dadas de forma verbal o escrita y seguir procedimientos estándar o acordados.
  S1.8.6:
    nombre: proporcionar asistencia y apoyo a los compañeros de trabajo
    en: Assisting and supporting colleagues, managers, volunteers and other co-workers in the performance
      of their tasks or in the operations of a business unit.
    es: Asistir y apoyar a colegas, gerentes, voluntarios y otros compañeros de trabajo en el desempeño
      de sus tareas o en las operaciones de una unidad de negocio.
  S1.9:
    nombre: solucionar problemas
    en: Developing and implementing solutions to practical, operational or conceptual problems which arise
      in the execution of work in a wide range of contexts.
    es: Desarrollar e implementar soluciones a problemas prácticos, operativos o conceptuales que surgen
      en la ejecución del trabajo en una amplia variedad de contextos.
  S1.9.0:
    nombre: solucionar problemas
    en: Developing and implementing solutions to practical, operational or conceptual problems which arise
      in the execution of work in a wide range of contexts.
    es: Desarrollar e implementar soluciones a problemas prácticos, operativos o conceptuales que surgen
      en la ejecución del trabajo en una amplia variedad de contextos.
  S1.9.1:
    nombre: desarrollar soluciones
    en: Developing solutions to practical, operational or conceptual problems which arise in the execution
      of work in a wide range of contexts.
    es: Desarrollar soluciones a problemas prácticos, operativos o conceptuales que surgen en la ejecución
      del trabajo en una amplia variedad de contextos.
  S1.9.2:
    nombre: aplicar nuevos procedimientos o procesos
    en: Implementing new business procedures or processes to resolve practical, operational or conceptual
      problems which arise in the execution of work in a wide range of contexts.
    es: Aplicar nuevos procedimientos o procesos empresariales para resolver problemas prácticos, operativos
      o conceptuales que surgen en la ejecución del trabajo en una amplia variedad de contextos.
  S2:
    nombre: competencias en materia de información
    en: Collecting, storing, monitoring, and using information; Conducting studies, investigations and
      tests; maintaining records; managing, evaluating, processing, analysing and monitoring information
      and projecting outcomes.
    es: Recopilar, almacenar, supervisar y utilizar información; realizar estudios, investigaciones y
      ensayos; mantener registros; gestionar, evaluar, procesar, analizar y supervisar información y proyectar
      resultados.
  S2.1:
    nombre: realizar estudios, investigaciones y análisis
    en: Conducting studies, investigations, and examinations to increase knowledge and understanding,
      diagnose problems or identify needs and requirements.
    es: Realizar estudios, investigaciones y análisis para aumentar el conocimiento y la comprensión,
      diagnosticar problemas o identificar necesidades y requisitos.
  S2.1.0:
    nombre: realizar estudios, investigaciones y análisis
    en: Conducting studies, investigations, and examinations to increase knowledge and understanding,
      diagnose problems or identify needs and requirements.
    es: Realizar estudios, investigaciones y análisis para aumentar el conocimiento y la comprensión,
      diagnosticar problemas o identificar necesidades y requisitos.
  S2.1.1:
    nombre: llevar a cabo investigaciones
    en: Conducting studies, investigations,  research or surveys to increase knowledge and understanding.
    es: Realizar estudios, indagaciones, investigaciones o encuestas para aumentar el conocimiento y la
      comprensión.
  S2.1.2:
    nombre: diagnosticar afecciones de la salud
    en: Examining patients, deceased persons or animals to diagnose physical and mental illnesses, injuries
      and medical conditions.
    es: Examinar a pacientes, personas fallecidas o animales para diagnosticar enfermedades físicas y
      mentales, lesiones y afecciones médicas.
  S2.1.3:
    nombre: interpretar documentación y diagramas técnicos
    en: Reading and interpreting documentation such as blueprints, electrical wiring diagrams, architectural
      plans.
    es: Leer e interpretar documentación como planos, diagramas de cableado eléctrico y planos arquitectónicos.
  S2.2:
    nombre: documentar y registrar información
    en: Maintaining records of information, transactions and activities in digital, paper or other forms.
    es: Mantener registros de información, transacciones y actividades en formato digital, en papel o
      en otros formatos.
  S2.2.0:
    nombre: documentar y registrar información
    en: Maintaining records of information, transactions and activities in digital, paper or other forms.
    es: Mantener registros de información, transacciones y actividades en formato digital, en papel o
      en otros formatos.
  S2.2.1:
    nombre: preparar documentos, registros, informes o presupuestos financieros
    en: Preparing and maintaining records and standardized reports on transactions, sales, financial information
      and budgets.
    es: Preparar y mantener registros e informes estandarizados sobre transacciones, ventas, información
      financiera y presupuestos.
  S2.2.2:
    nombre: registrar información legal
    en: Recording information and preparing standardized documentation and reports on legal matters.
    es: Registrar información y preparar documentación e informes estandarizados sobre asuntos legales.
  S2.2.3:
    nombre: preparar documentación para contratos, solicitudes o permisos
    en: Preparing applications and maintaining standardized documentation for the issuance of contracts,
      licences or permits.
    es: Preparar solicitudes y mantener documentación estandarizada para la emisión de contratos, licencias
      o permisos.
  S2.2.4:
    nombre: mantener o preparar documentación médica
    en: Maintaining health and medical records, and preparing standardized reports on health status, medical
      conditions, or medical test results.
    es: Mantener registros sanitarios y médicos, y preparar informes estandarizados sobre el estado de
      salud, las afecciones médicas o los resultados de pruebas médicas.
  S2.2.5:
    nombre: mantener registros operativos
    en: Keeping records required for operational purposes such as those related to staff, clients, production
      and stock inventories.
    es: Llevar los registros necesarios con fines operativos, como los relativos al personal, los clientes,
      la producción y los inventarios de existencias.
  S2.2.6:
    nombre: documentar diseños, procedimientos, problemas o actividades de carácter técnico
    en: Preparing and maintaining documentation and specifications of designs, equipment and operating
      procedures.
    es: Preparar y mantener documentación y especificaciones de diseños, equipos y procedimientos operativos.
  S2.2.7:
    nombre: notificar incidentes y defectos
    en: Reporting and keeping records of events, complaints, and defective equipment or materials.
    es: Notificar y llevar registros de incidentes, reclamos y equipos o materiales defectuosos.
  S2.3:
    nombre: gestionar información
    en: Setting up and managing manual or electronic systems for storing , selecting, organizing, retrieving,
      distributing and safeguarding information.
    es: Establecer y gestionar sistemas manuales o electrónicos para almacenar, seleccionar, organizar,
      recuperar, distribuir y resguardar información.
  S2.3.0:
    nombre: gestionar información
    en: Setting up and managing manual or electronic systems for storing , selecting, organizing, retrieving,
      distributing and safeguarding information.
    es: Establecer y gestionar sistemas manuales o electrónicos para almacenar, seleccionar, organizar,
      recuperar, distribuir y resguardar información.
  S2.4:
    nombre: procesar información
    en: Inputting, recording, transcribing and updating data using electronic or manual information systems.
    es: Introducir, registrar, transcribir y actualizar datos utilizando sistemas de información electrónicos
      o manuales.
  S2.4.0:
    nombre: procesar información
    en: Inputting, recording, transcribing and updating data using electronic or manual information systems.
    es: Introducir, registrar, transcribir y actualizar datos utilizando sistemas de información electrónicos
      o manuales.
  S2.4.1:
    nombre: recopilar información procedente de fuentes físicas o electrónicas
    en: Collecting, compiling or gathering information from digital, paper or other sources.
    es: Recopilar, compilar o reunir información procedente de fuentes digitales, en papel o de otro tipo.
  S2.4.2:
    nombre: introducir y modificar información
    en: Entering and transforming information in electronic or other information systems.
    es: Introducir y transformar información en sistemas de información electrónicos o de otro tipo.
  S2.5:
    nombre: medir propiedades físicas
    en: Measuring the dimensions, weight, density and other physical properties of objects, materials
      and spaces.
    es: Medir las dimensiones, el peso, la densidad y otras propiedades físicas de objetos, materiales
      y espacios.
  S2.5.0:
    nombre: medir propiedades físicas
    en: Measuring the dimensions, weight, density and other physical properties of objects, materials
      and spaces.
    es: Medir las dimensiones, el peso, la densidad y otras propiedades físicas de objetos, materiales
      y espacios.
  S2.5.1:
    nombre: medir dimensiones y propiedades relacionadas
    en: Measuring the dimensions, density and other physical properties of objects, materials, people,
      and spaces.
    es: Medir las dimensiones, la densidad y otras propiedades físicas de objetos, materiales, personas
      y espacios.
  S2.5.2:
    nombre: pesar
    en: Measuring the weight of objects and people.
    es: Medir el peso de objetos y personas.
  S2.6:
    nombre: calcular y estimar
    en: Performing mathematical calculations and estimating the results of an action or a series of actions.
    es: Realizar cálculos matemáticos y estimar los resultados de una acción o de una serie de acciones.
  S2.6.0:
    nombre: calcular y estimar
    en: Performing mathematical calculations and estimating the results of an action or a series of actions.
    es: Realizar cálculos matemáticos y estimar los resultados de una acción o de una serie de acciones.
  S2.6.1:
    nombre: realizar cálculos
    en: Performing mathematical calculations on financial, spatial, scientific or other data with or without
      the used of electronic tools.
    es: Realizar cálculos matemáticos con datos financieros, espaciales, científicos o de otro tipo, con
      o sin el uso de herramientas electrónicas.
  S2.6.2:
    nombre: determinar valores de bienes o servicios
    en: Determining or estimating values or prices of goods or services.
    es: Determinar o estimar valores o precios de bienes o servicios.
  S2.6.3:
    nombre: estimar necesidades de recursos
    en: Calculating and estimating the costs and volumes of human and physical resources required to undertake
      projects, repairs or other tasks.
    es: Calcular y estimar los costos y volúmenes de recursos humanos y físicos necesarios para llevar
      a cabo proyectos, reparaciones u otras tareas.
  S2.7:
    nombre: analizar y evaluar información y datos
    en: Examining data or facts to determine appropriate actions or recommendations; comparing and critically
      evaluating the credibility and reliability of sources of data; making and defending judgements based
      on internal evidence and external criteria.
    es: Examinar datos o hechos para determinar las acciones o recomendaciones adecuadas; comparar y evaluar
      críticamente la credibilidad y fiabilidad de las fuentes de datos; formular y defender juicios basados
      en evidencia interna y criterios externos.
  S2.7.0:
    nombre: analizar y evaluar información y datos
    en: Examining data or facts to determine appropriate actions or recommendations; comparing and critically
      evaluating the credibility and reliability of sources of data; making and defending judgements based
      on internal evidence and external criteria.
    es: Examinar datos o hechos para determinar las acciones o recomendaciones adecuadas; comparar y evaluar
      críticamente la credibilidad y fiabilidad de las fuentes de datos; formular y defender juicios basados
      en evidencia interna y criterios externos.
  S2.7.1:
    nombre: evaluar terrenos o bienes inmuebles
    en: Assessing the suitability of land or buildings for future sale, use, development or conservation
      and estimating their value.
    es: Evaluar la idoneidad de terrenos o edificios para su futura venta, uso, desarrollo o conservación
      y estimar su valor.
  S2.7.2:
    nombre: analizar datos científicos o médicos
    en: Analysing data and evaluating information collected from scientific and medical tests and investigations.
    es: Analizar datos y evaluar información recopilada a partir de pruebas e investigaciones científicas
      y médicas.
  S2.7.3:
    nombre: analizar datos financieros y económicos
    en: Analysing and evaluating information and data on finances and on economic and market trends.
    es: Analizar y evaluar información y datos sobre finanzas y sobre tendencias económicas y de mercado.
  S2.7.4:
    nombre: analizar operaciones empresariales
    en: Analysing and evaluating information and data on production and business operations.
    es: Analizar y evaluar información y datos sobre la producción y las operaciones empresariales.
  S2.7.5:
    nombre: realizar análisis y gestión de riesgos
    en: Identify and assess factors that may have negative financial consequences, jeopardise the success
      of a project or activity, expose individuals to danger, cause damage to property and equipment or
      threaten an organisation's functioning. Implement procedures to avoid or minimise their impact.
    es: Identificar y evaluar factores que puedan tener consecuencias financieras negativas, poner en
      peligro el éxito de un proyecto o actividad, exponer a las personas a peligros, causar daños a bienes
      y equipos o amenazar el funcionamiento de una organización. Aplicar procedimientos para evitar o
      minimizar su impacto.
  S2.7.6:
    nombre: evaluar sistemas, programas, equipos y productos
    en: Evaluating and analysing information on the performance of systems, processes, practices, programmes,
      equipment or products.
    es: Evaluar y analizar información sobre el desempeño de sistemas, procesos, prácticas, programas,
      equipos o productos.
  S2.8:
    nombre: realizar seguimiento, inspección y ensayos
    en: Examining and investigating problems, sites or objects to assess functioning or compliance with
      standards, laws or regulations.
    es: Examinar e investigar problemas, sitios u objetos para evaluar su funcionamiento o el cumplimiento
      de normas, leyes o reglamentos.
  S2.8.0:
    nombre: realizar seguimiento, inspección y ensayos
    en: Examining and investigating problems, sites or objects to assess functioning or compliance with
      standards, laws or regulations.
    es: Examinar e investigar problemas, sitios u objetos para evaluar su funcionamiento o el cumplimiento
      de normas, leyes o reglamentos.
  S2.8.1:
    nombre: hacer seguimiento, inspecciones y ensayos de equipos, sistemas y productos
    en: Monitoring, inspecting and testing equipment, systems and products to determine whether or not
      they meet requirements for adequate functioning or use.
    es: Hacer seguimiento, inspecciones y ensayos de equipos, sistemas y productos para determinar si
      cumplen o no los requisitos para un funcionamiento o uso adecuados.
  S2.8.2:
    nombre: hacer seguimiento de actividades operativas
    en: Monitoring the operations of a business or organisation to ensure adequate performance and compliance
      with regulatory requirements.
    es: Hacer seguimiento de las operaciones de una empresa u organización para garantizar un desempeño
      adecuado y el cumplimiento de los requisitos reglamentarios.
  S2.8.3:
    nombre: hacer seguimiento de recursos y actividad financieros y económicos
    en: Monitor parameters to maintain awareness of levels of financial resources and expenditure, stocks,
      and the economic environment.
    es: Hacer seguimiento de parámetros para mantenerse al tanto de los niveles de recursos financieros
      y gastos, de las existencias y del entorno económico.
  S2.8.4:
    nombre: hacer seguimiento de seguridad y protección
    en: Monitoring and inspecting the safety or security of work areas, facilities, or properties.
    es: Hacer seguimiento e inspecciones de la seguridad o la protección de áreas de trabajo, instalaciones
      o propiedades.
  S2.8.5:
    nombre: hacer seguimiento de condiciones medioambientales
    en: Measuring and maintaining awareness of changes in environmental conditions including the weather,
      air and water quality, and the impact of human activities on nature.
    es: Medir los cambios en las condiciones medioambientales y mantenerse al tanto de ellos, incluidos
      el clima, la calidad del aire y del agua, y el impacto de las actividades humanas en la naturaleza.
  S2.8.6:
    nombre: hacer seguimiento de afecciones de la salud
    en: Monitoring health conditions of humans or animals.
    es: Hacer seguimiento de afecciones de la salud de personas o animales.
  S2.8.8:
    nombre: hacer ensayos y análisis de sustancias
    en: Performing tests and analyses of gases, fluids or solid substances, such as blood samples, cell
      cultures and samples of food and beverages.
    es: Realizar ensayos y análisis de gases, fluidos o sustancias sólidas, como muestras de sangre, cultivos
      celulares y muestras de alimentos y bebidas.
  S2.9:
    nombre: realizar seguimiento de avances en el ámbito de especialización
    en: Monitoring and keeping knowledge up-to-date concerning new research, methodologies, regulations,
      policies technological developments and other significant changes relevant to a particular field
      of specialisation.
    es: Realizar seguimiento y mantener actualizados los conocimientos sobre nuevas investigaciones, metodologías,
      reglamentos, políticas, avances tecnológicos y otros cambios significativos relevantes para un ámbito
      de especialización determinado.
  S2.9.0:
    nombre: realizar seguimiento de avances en el ámbito de especialización
    en: Monitoring and keeping knowledge up-to-date concerning new research, methodologies, regulations,
      policies technological developments and other significant changes relevant to a particular field
      of specialisation.
    es: Realizar seguimiento y mantener actualizados los conocimientos sobre nuevas investigaciones, metodologías,
      reglamentos, políticas, avances tecnológicos y otros cambios significativos relevantes para un ámbito
      de especialización determinado.
  S3:
    nombre: prestar asistencia y cuidados
    en: Providing assistance, nurturing, care, service and support to people, and ensuring compliance
      to rules, standards, guidelines or laws.
    es: Prestar asistencia, atención, cuidados, servicios y apoyo a las personas, y velar por el cumplimiento
      de reglas, normas, directrices o leyes.
  S3.0:
    nombre: prestar asistencia y cuidados
    en: Providing assistance, nurturing, care, service and support to people, and ensuring compliance
      to rules, standards, guidelines or laws.
    es: Prestar asistencia, atención, cuidados, servicios y apoyo a las personas, y velar por el cumplimiento
      de reglas, normas, directrices o leyes.
  S3.0.0:
    nombre: prestar asistencia y cuidados
    en: Providing assistance, nurturing, care, service and support to people, and ensuring compliance
      to rules, standards, guidelines or laws.
    es: Prestar asistencia, atención, cuidados, servicios y apoyo a las personas, y velar por el cumplimiento
      de reglas, normas, directrices o leyes.
  S3.1:
    nombre: ofrecer orientación
    en: Responding to clients' needs by interpreting their emotional and motivational states, and determining
      and providing appropriate support or interventions.
    es: Responder a las necesidades de los clientes interpretando sus estados emocionales y motivacionales,
      y determinando y ofreciendo el apoyo o las intervenciones adecuados.
  S3.1.0:
    nombre: ofrecer orientación
    en: Responding to clients' needs by interpreting their emotional and motivational states, and determining
      and providing appropriate support or interventions.
    es: Responder a las necesidades de los clientes interpretando sus estados emocionales y motivacionales,
      y determinando y ofreciendo el apoyo o las intervenciones adecuados.
  S3.1.1:
    nombre: asesorar sobre cuestiones personales, familiares o sociales
    en: Responding to clients' needs by interpreting their emotional and motivational states, and assisting
      them to understand their situation.
    es: Responder a las necesidades de los clientes interpretando sus estados emocionales y motivacionales,
      y ayudándolos a comprender su situación.
  S3.1.2:
    nombre: prestar apoyo para solucionar problemas
    en: Providing appropriate support or interventions to others to assist them to resolve their personal,
      family or social problems.
    es: Prestar el apoyo o las intervenciones adecuados a otras personas para ayudarlas a solucionar sus
      problemas personales, familiares o sociales.
  S3.1.3:
    nombre: prestar asistencia a personas en el acceso a servicios
    en: Assist others to gain access to social, legal or other services and benefits, including making
      referrals to other professionals and organisations.
    es: Prestar asistencia a otras personas para acceder a servicios y prestaciones sociales, jurídicos
      o de otro tipo, incluida la derivación a otros profesionales y organizaciones.
  S3.2:
    nombre: prestar atención sanitaria o administrar tratamientos médicos
    en: Treating injuries and health conditions through the provision of health care and medical treatments
      to people.
    es: Tratar lesiones y afecciones de la salud mediante la prestación de atención sanitaria y la administración
      de tratamientos médicos a las personas.
  S3.2.0:
    nombre: prestar atención sanitaria o administrar tratamientos médicos
    en: Treating injuries and health conditions through the provision of health care and medical treatments
      to people.
    es: Tratar lesiones y afecciones de la salud mediante la prestación de atención sanitaria y la administración
      de tratamientos médicos a las personas.
  S3.2.1:
    nombre: prestar asistencia médica, odontológica y de enfermería
    en: Treating injuries and health conditions among humans, through administering medication and providing
      other medical treatments and nursing care.
    es: Tratar lesiones y afecciones de la salud en personas mediante la administración de medicamentos
      y la prestación de otros tratamientos médicos y cuidados de enfermería.
  S3.2.2:
    nombre: llevar a cabo procedimientos quirúrgicos
    en: Treating injuries and health conditions through provision of various types of surgical intervention.
    es: Tratar lesiones y afecciones de la salud mediante distintos tipos de intervenciones quirúrgicas.
  S3.2.3:
    nombre: proporcionar fisioterapia
    en: Treating injuries and health conditions through physiotherapy, massage, chiropractic and other
      physical therapies.
    es: Tratar lesiones y afecciones de la salud mediante fisioterapia, masajes, quiropraxia y otras terapias
      físicas.
  S3.2.4:
    nombre: proporcionar terapia psicológica y ocupacional
    en: Treating human health conditions through provision psychological and occupational, music or related
      therapies.
    es: Tratar afecciones de la salud humana mediante terapias psicológicas y ocupacionales, musicoterapia
      o terapias afines.
  S3.2.5:
    nombre: recetar y pedir pruebas, tratamientos o dispositivos médicos
    en: Ordering medical tests such as blood tests or medical imaging, planning courses of treatment and
      prescribing medication, or medical and prosthetic devices.
    es: Solicitar pruebas médicas, como análisis de sangre o estudios de diagnóstico por imágenes, planificar
      tratamientos y recetar medicamentos o dispositivos médicos y protésicos.
  S3.2.6:
    nombre: instalar dispositivos de asistencia
    en: Fitting assistive devices such as prostheses or orthotics to patients or clients.
    es: Instalar dispositivos de asistencia, como prótesis u órtesis, a pacientes o clientes.
  S3.3:
    nombre: proteger y velar por el cumplimiento
    en: Responding to public and personal safety and security needs and ensuring compliance to rules,
      standards, guidelines or laws.
    es: Responder a las necesidades de seguridad y protección públicas y personales, y velar por el cumplimiento
      de reglas, normas, directrices o leyes.
  S3.3.0:
    nombre: proteger y velar por el cumplimiento
    en: Responding to public and personal safety and security needs and ensuring compliance to rules,
      standards, guidelines or laws.
    es: Responder a las necesidades de seguridad y protección públicas y personales, y velar por el cumplimiento
      de reglas, normas, directrices o leyes.
  S3.3.1:
    nombre: cumplir los procedimientos de salud y seguridad
    en: Ensuring compliance to rules, standards, guidelines laws or good practices relating to the health
      and safety of oneself, co-workers, employees and the public.
    es: Velar por el cumplimiento de reglas, normas, directrices, leyes o buenas prácticas relativas a
      la salud y la seguridad de uno mismo, de los compañeros de trabajo, de los empleados y del público.
  S3.3.2:
    nombre: cumplir las leyes y normas sobre protección medioambiental
    en: Ensuring compliance with regulations, standards, guidelines, laws or practices relating to the
      protection of the environment.
    es: Velar por el cumplimiento de reglamentos, normas, directrices, leyes o prácticas relativas a la
      protección del medio ambiente.
  S3.3.3:
    nombre: cumplir las directrices jurídicas y organizativas
    en: Ensuring compliance with rules, standards, policies, guidelines or laws relating to matters other
      than health, safety and the environment.
    es: Velar por el cumplimiento de reglas, normas, políticas, directrices o leyes relativas a cuestiones
      distintas de la salud, la seguridad y el medio ambiente.
  S3.3.4:
    nombre: verificar la identidad y la documentación
    en: Check an individuals' documentation, such as driver's licenses, official identification documents,
      travel documents and tickets, to ensure compliance with legal regulations, identify individuals,
      and assess their right to access services, areas or facilities.
    es: Verificar la documentación de las personas, como licencias de conducir, documentos oficiales de
      identidad, documentos de viaje y boletos, para garantizar el cumplimiento de la normativa legal,
      identificar a las personas y evaluar su derecho a acceder a servicios, áreas o instalaciones.
  S3.3.5:
    nombre: mantener y hacer respetar la seguridad física
    en: Ensuring safety and security of persons and property through physical actions.
    es: Garantizar la seguridad y la protección de las personas y los bienes mediante acciones físicas.
  S3.3.6:
    nombre: proteger la privacidad y los datos personales
    en: Using and sharing identifiable information about individuals or enterprises in a manner that respects
      data protection principles, privacy and confidentiality.
    es: Utilizar y compartir información identificable sobre personas o empresas de manera que se respeten
      los principios de protección de datos, la privacidad y la confidencialidad.
  S3.4:
    nombre: facilitar información y apoyo al público y a los clientes
    en: Assisting the public by answering questions, making recommendations, and providing information
      or support in response to requests.
    es: Prestar asistencia al público respondiendo preguntas, formulando recomendaciones y facilitando
      información o apoyo en respuesta a solicitudes.
  S3.4.0:
    nombre: facilitar información y apoyo al público y a los clientes
    en: Assisting the public by answering questions, making recommendations, and providing information
      or support in response to requests.
    es: Prestar asistencia al público respondiendo preguntas, formulando recomendaciones y facilitando
      información o apoyo en respuesta a solicitudes.
  S3.4.1:
    nombre: facilitar información al público y a los clientes
    en: Answering questions, making recommendations, and providing information or support in response
      to requests from clients, customers, guests or members of the public.
    es: Responder preguntas, formular recomendaciones y facilitar información o apoyo en respuesta a solicitudes
      de clientes, consumidores, huéspedes o miembros del público.
  S3.4.2:
    nombre: acompañar a personas
    en: Accompanying, escorting or guiding other people or groups of people on trips, social events, outings
      or crossing roads.
    es: Acompañar, escoltar o guiar a otras personas o grupos de personas en viajes, eventos sociales,
      salidas o al cruzar la calle.
  S3.4.3:
    nombre: prestar asistencia a personas con trámites administrativos
    en: Assisting others with completing forms, provision of documentation required for access to services,
      issuance of official documents or enrolment in programmes.
    es: Prestar asistencia a otras personas para completar formularios, presentar la documentación necesaria
      para acceder a servicios, obtener documentos oficiales o inscribirse en programas.
  S3.4.4:
    nombre: prestar asistencia general a personas
    en: Welcoming and supporting clients, patrons, visitors and others by helping them to feel at ease,
      supporting special requirements, and assisting them with general activities such as finding seats,
      making reservations and using facilities.
    es: Recibir y apoyar a clientes, usuarios, visitantes y otras personas ayudándolos a sentirse cómodos,
      atendiendo necesidades especiales y asistiéndolos en actividades generales como encontrar asientos,
      hacer reservas y utilizar las instalaciones.
  S3.5:
    nombre: preparar y servir alimentos y bebidas
    en: Providing food and beverage services.
    es: Prestar servicios de alimentos y bebidas.
  S3.5.0:
    nombre: preparar y servir alimentos y bebidas
    en: Providing food and beverage services.
    es: Prestar servicios de alimentos y bebidas.
  S3.5.1:
    nombre: preparar alimentos y bebidas
    en: Preparing and cooking meals and beverages.
    es: Preparar y cocinar comidas y bebidas.
  S3.5.2:
    nombre: servir comidas y bebidas
    en: Serving food and beverages to clients in restaurants, canteens, cafes, bars, transportation equipment
      or other locations.
    es: Servir comidas y bebidas a clientes en restaurantes, comedores, cafeterías, bares, medios de transporte
      u otros lugares.
  S3.6:
    nombre: prestar cuidados personales en general
    en: Responding to the daily and occasional personal care needs of people.
    es: Responder a las necesidades de cuidados personales diarias y ocasionales de las personas.
  S3.6.0:
    nombre: proporcionar cuidados personales
    en: Responding to the daily and occasional personal care needs of people.
    es: Responder a las necesidades de cuidados personales diarias y ocasionales de las personas.
  S3.6.1:
    nombre: prestar asistencia a personas con problemas de movilidad
    en: Moving or assisting movement of persons with restricted mobility due to illness, accidents, disability,
      or medical procedures.
    es: Trasladar o ayudar a desplazarse a personas con movilidad reducida debido a enfermedades, accidentes,
      discapacidad o procedimientos médicos.
  S3.6.2:
    nombre: prestar asistencia en relación con necesidades personales
    en: Assisting others with personal needs and care such as bathing, dressing, feeding, relaxation and
      comfort.
    es: Prestar asistencia a otras personas en relación con sus necesidades y cuidados personales, como
      bañarse, vestirse, alimentarse, relajarse y estar cómodas.
  S3.6.3:
    nombre: cuidar de menores en edad infantil
    en: Providing care for and assistance to children.
    es: Prestar cuidados y asistencia a niños y niñas.
  S3.6.4:
    nombre: peinar el cabello y aplicar tratamientos de belleza
    en: Grooming, styling or removing hair, applying make-up and providing beauty treatments, to meet
      the appearance desired by clients or required for the purposes such as theatrical performance.
    es: Arreglar, peinar o eliminar el cabello, aplicar maquillaje y realizar tratamientos de belleza,
      para lograr la apariencia deseada por los clientes o requerida para fines como las representaciones
      teatrales.
  S4:
    nombre: competencias de gestión
    en: Managing people, activities, resources, and organisation; developing objectives and strategies,
      organising work activities, allocating and controlling resources and leading, motivating, recruiting
      and supervising people and teams.
    es: Gestionar personas, actividades, recursos y la organización; desarrollar objetivos y estrategias,
      organizar las actividades de trabajo, asignar y controlar recursos, y liderar, motivar, contratar
      y supervisar a personas y equipos.
  S4.0:
    nombre: competencias de gestión
    en: Managing people, activities, resources, and organisation; developing objectives and strategies,
      organising work activities, allocating and controlling resources and leading, motivating, recruiting
      and supervising people and teams.
    es: Gestionar personas, actividades, recursos y la organización; desarrollar objetivos y estrategias,
      organizar las actividades de trabajo, asignar y controlar recursos, y liderar, motivar, contratar
      y supervisar a personas y equipos.
  S4.0.0:
    nombre: competencias de gestión
    en: Managing people, activities, resources, and organisation; developing objectives and strategies,
      organising work activities, allocating and controlling resources and leading, motivating, recruiting
      and supervising people and teams.
    es: Gestionar personas, actividades, recursos y la organización; desarrollar objetivos y estrategias,
      organizar las actividades de trabajo, asignar y controlar recursos, y liderar, motivar, contratar
      y supervisar a personas y equipos.
  S4.1:
    nombre: desarrollar objetivos y estrategias
    en: Envisioning a future state and developing strategies, goals, objectives and action plans to achieve
      it.
    es: Concebir un estado futuro y desarrollar estrategias, metas, objetivos y planes de acción para
      alcanzarlo.
  S4.1.0:
    nombre: desarrollar objetivos y estrategias
    en: Envisioning a future state and developing strategies, goals, objectives and action plans to achieve
      it.
    es: Concebir un estado futuro y desarrollar estrategias, metas, objetivos y planes de acción para
      alcanzarlo.
  S4.1.1:
    nombre: identificar oportunidades
    en: Identifying business or organizational opportunities.
    es: Identificar oportunidades empresariales u organizativas.
  S4.1.2:
    nombre: desarrollar planes financieros, empresariales o de comercialización
    en: Envision and develop strategies and plans for companies and organisations aimed at purposes such
      as establishing new markets, refurbishing the equipment and machinery of a company, implementing
      pricing strategies, and restoring or maintaining financial viability.
    es: Concebir y desarrollar estrategias y planes para empresas y organizaciones con fines como abrir
      nuevos mercados, renovar los equipos y la maquinaria de una empresa, aplicar estrategias de precios
      y restablecer o mantener la viabilidad financiera.
  S4.1.3:
    nombre: desarrollar políticas y procedimientos operativos
    en: Developing organisational and operational methods, policies, procedures or standards.
    es: Desarrollar métodos, políticas, procedimientos o normas organizativos y operativos.
  S4.1.4:
    nombre: desarrollar planes de investigación
    en: Developing plans and programmes for the conduct of research and investigations to extend human
      knowledge or develop new products.
    es: Desarrollar planes y programas para la realización de investigaciones y estudios con el fin de
      ampliar el conocimiento humano o desarrollar nuevos productos.
  S4.1.5:
    nombre: desarrollar programas de salud
    en: Developing plans for the promotion and protection of public and community health and the provision
      of health services.
    es: Desarrollar planes para la promoción y protección de la salud pública y comunitaria y la prestación
      de servicios de salud.
  S4.1.6:
    nombre: desarrollar programas educativos
    en: Developing education and training programs, plans, or procedures for society in general, specific
      groups or tailored to an individual's learning needs.
    es: Desarrollar programas, planes o procedimientos de educación y formación para la sociedad en general,
      para grupos específicos o adaptados a las necesidades de aprendizaje de una persona.
  S4.1.7:
    nombre: desarrollar planes de contingencia y de respuesta a situaciones de emergencia
    en: Composing and maintaining procedures outlining specific actions to be taken in the event of an
      emergency or adverse event, taking into account all the risks and dangers that could be involved,
      ensuring that the plans comply with safety legislation and represent the safest course of action.
    es: Elaborar y mantener procedimientos que describan las acciones específicas que deben tomarse ante
      una emergencia o un evento adverso, teniendo en cuenta todos los riesgos y peligros que podrían
      estar involucrados, y asegurando que los planes cumplan con la legislación de seguridad y representen
      el curso de acción más seguro.
  S4.2:
    nombre: organizar, planificar y programar trabajo y actividades
    en: Directing activities and tasks, establishing schedules and co-ordinating the activities of groups
      and individuals to complete objectives on time and within budget.
    es: Dirigir actividades y tareas, establecer cronogramas y coordinar las actividades de grupos y personas
      para cumplir los objetivos a tiempo y dentro del presupuesto.
  S4.2.0:
    nombre: organizar, planificar y programar trabajo y actividades
    en: Directing activities and tasks, establishing schedules and co-ordinating the activities of groups
      and individuals to complete objectives on time and within budget.
    es: Dirigir actividades y tareas, establecer cronogramas y coordinar las actividades de grupos y personas
      para cumplir los objetivos a tiempo y dentro del presupuesto.
  S4.2.1:
    nombre: dirigir actividades operativas
    en: Directing, supervising and coordinating operational activities, projects and tasks.
    es: Dirigir, supervisar y coordinar actividades operativas, proyectos y tareas.
  S4.2.2:
    nombre: planificar y programar actos y actividades
    en: Planning and scheduling workflow and timelines for projects, events or programs.
    es: Planificar y programar el flujo de trabajo y los plazos de proyectos, actos o programas.
  S4.3:
    nombre: asignar y controlar recursos
    en: Determining the distribution and availability of people, assets, materials or capital to accomplish
      organizational goals and putting in place financial and administrative controls.
    es: Determinar la distribución y disponibilidad de personas, activos, materiales o capital para alcanzar
      los objetivos de la organización, y establecer controles financieros y administrativos.
  S4.3.0:
    nombre: asignar y controlar recursos
    en: Determining the distribution and availability of people, assets, materials or capital to accomplish
      organizational goals and putting in place financial and administrative controls.
    es: Determinar la distribución y disponibilidad de personas, activos, materiales o capital para alcanzar
      los objetivos de la organización, y establecer controles financieros y administrativos.
  S4.3.1:
    nombre: gestionar presupuestos o finanzas
    en: Determining the distribution and availability financial assets and putting in place financial
      and administrative controls.
    es: Determinar la distribución y disponibilidad de los activos financieros, y establecer controles
      financieros y administrativos.
  S4.3.2:
    nombre: gestionar recursos humanos
    en: Determining the distribution and availability of people to accomplish organizational goals.
    es: Determinar la distribución y disponibilidad de personas para alcanzar los objetivos de la organización.
  S4.3.3:
    nombre: asignar y controlar recursos físicos
    en: Determining and controlling the distribution and availability of physical assets such as tools
      and equipment.
    es: Determinar y controlar la distribución y disponibilidad de activos físicos, como herramientas
      y equipos.
  S4.4:
    nombre: realizar tareas administrativas
    en: Performing administrative tasks such as typing up reports, ordering supplies, maintaining mail
      correspondence,  and ensuring administrative systems, processes and databases are efficient.
    es: Realizar tareas administrativas, como redactar informes, pedir suministros, mantener la correspondencia
      postal y asegurar que los sistemas, procesos y bases de datos administrativos sean eficientes.
  S4.4.0:
    nombre: realizar tareas administrativas
    en: Performing administrative tasks such as typing up reports, ordering supplies, maintaining mail
      correspondence,  and ensuring administrative systems, processes and databases are efficient.
    es: Realizar tareas administrativas, como redactar informes, pedir suministros, mantener la correspondencia
      postal y asegurar que los sistemas, procesos y bases de datos administrativos sean eficientes.
  S4.4.1:
    nombre: administrar recursos humanos
    en: Performing administrative and clerical tasks concerned with human resource administration.
    es: Realizar tareas administrativas y de oficina relacionadas con la administración de recursos humanos.
  S4.4.2:
    nombre: ejecutar transacciones financieras
    en: Executing financial or commercial transactions such as issuing invoices for sales or issuing purchase
      orders.
    es: Ejecutar transacciones financieras o comerciales, como emitir facturas de ventas o emitir órdenes
      de compra.
  S4.4.3:
    nombre: realizar tareas de oficina y administrativas generales
    en: Performing general clerical and administrative tasks not involving administration of human resources,
      execution of financial transactions, or processing and transforming information or data.
    es: Realizar tareas generales de oficina y administrativas que no implican la administración de recursos
      humanos, la ejecución de transacciones financieras ni el procesamiento y la transformación de información
      o datos.
  S4.5:
    nombre: guiar y motivar
    en: Reinforcing an organization's vision, inspiring and enthusing others to achieve positive outcomes.
      The focus of this group is on skills in motivating and inspiring others, rather than on managing
      and supervising a team.
    es: Reforzar la visión de una organización, inspirando y entusiasmando a otros para lograr resultados
      positivos. Este grupo se centra en las habilidades para motivar e inspirar a otros, más que en dirigir
      y supervisar un equipo.
  S4.5.0:
    nombre: guiar y motivar
    en: Reinforcing an organization's vision, inspiring and enthusing others to achieve positive outcomes.
      The focus of this group is on skills in motivating and inspiring others, rather than on managing
      and supervising a team.
    es: Reforzar la visión de una organización, inspirando y entusiasmando a otros para lograr resultados
      positivos. Este grupo se centra en las habilidades para motivar e inspirar a otros, más que en dirigir
      y supervisar un equipo.
  S4.6:
    nombre: crear y desarrollar equipos
    en: Encouraging team members and building a relationship of mutual trust, respect and cooperation.
      Stimulating teambuilding activities.
    es: Alentar a los miembros del equipo y construir una relación de confianza, respeto y cooperación
      mutuos. Estimular actividades de integración de equipos.
  S4.6.0:
    nombre: crear y desarrollar equipos
    en: Encouraging team members and building a relationship of mutual trust, respect and cooperation.
      Stimulating teambuilding activities.
    es: Alentar a los miembros del equipo y construir una relación de confianza, respeto y cooperación
      mutuos. Estimular actividades de integración de equipos.
  S4.7:
    nombre: reclutar y contratar
    en: Acquiring the right talent to achieve the organization's mission.
    es: Incorporar el talento adecuado para cumplir la misión de la organización.
  S4.7.0:
    nombre: reclutar y contratar
    en: Acquiring the right talent to achieve the organization's mission.
    es: Incorporar el talento adecuado para cumplir la misión de la organización.
  S4.8:
    nombre: supervisar a personas
    en: Assigning responsibilities to others and directing and monitoring their performance.
    es: Asignar responsabilidades a otras personas y dirigir y hacer seguimiento de su desempeño.
  S4.8.1:
    nombre: supervisar a un equipo o grupo
    en: Managing, leading or supervising the activities a team or group of workers or students.
    es: Gestionar, liderar o supervisar las actividades de un equipo o grupo de trabajadores o estudiantes.
  S4.8.2:
    nombre: asignar trabajo a terceros
    en: Assigning specific tasks to workers or students.
    es: Asignar tareas específicas a trabajadores o estudiantes.
  S4.8.3:
    nombre: hacer seguimiento y evaluación del rendimiento de personas
    en: Monitoring the behaviour or performance of workers, students or oneself to ensure that work is
      completed satisfactorily and to evaluate performance, capabilities and training needs.
    es: Hacer seguimiento del comportamiento o del rendimiento de trabajadores, estudiantes o de uno mismo
      para asegurar que el trabajo se realice satisfactoriamente y para evaluar el rendimiento, las capacidades
      y las necesidades de formación.
  S4.9:
    nombre: tomar decisiones
    en: Making a choice from several alternative possibilities.
    es: Elegir entre varias posibilidades alternativas.
  S4.9.0:
    nombre: tomar decisiones
    en: Making a choice from several alternative possibilities.
    es: Elegir entre varias posibilidades alternativas.
  S5:
    nombre: trabajar con ordenadores
    en: Using computers and other digital tools to develop, install and maintain ICT software and infrastructure
      and to browse, search, filter, organise, store, retrieve, and analyse data, to collaborate and communicate
      with others, to create and edit new content.
    es: Utilizar computadoras y otras herramientas digitales para desarrollar, instalar y mantener software
      e infraestructura de TIC, y para navegar, buscar, filtrar, organizar, almacenar, recuperar y analizar
      datos, colaborar y comunicarse con otras personas, y crear y editar contenidos nuevos.
  S5.0:
