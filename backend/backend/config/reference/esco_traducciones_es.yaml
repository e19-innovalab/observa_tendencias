# Traducciones al español de las descripciones de ESCO que ESCO publica solo en inglés.
#
# Fuente del original: API de ESCO (Comisión Europea), campo "description" en inglés de cada
# concepto de la jerarquía de habilidades (GET /resource/concept). Se guarda el texto en inglés
# exactamente como lo devuelve ESCO ("en") junto a la traducción ("es").
# Traducción: propia del equipo (no oficial de ESCO), generada el 2026-10-31.
# STATUS: borrador, NO REVISADO.
#
# Uso (app/skills/esco_hierarchy.py): si ESCO no tiene la descripción en español, se muestra "es"
# siempre que "en" coincida con el texto actual de ESCO. Si ESCO cambia el original, se vuelve a
# mostrar el inglés hasta actualizar la traducción. Cada descripción guarda su origen
# (description_origin: esco | translation).

reviewed: false
groups:
  '00':
    nombre: programas y certificaciones genéricos
    en: |-
      Generic programmes and qualifications are those providing fundamental and personal skills education which cover a broad range of subjects and do not emphasise or specialise in a particular broad or narrow field.
      This broad field should not be used as a residual category. Programmes and qualifications with a specific subject emphasis should be classified in broad fields 01 to 10. In particular, education at the tertiary level should only by way of exception be classified here.
    es: |-
      Los programas y las titulaciones genéricos son aquellos que imparten educación en competencias fundamentales y personales, abarcan una amplia gama de materias y no hacen hincapié en un campo amplio o específico concreto ni se especializan en él.
      Este campo amplio no debe utilizarse como categoría residual. Los programas y las titulaciones con énfasis en una materia específica deben clasificarse en los campos amplios 01 a 10. En particular, la educación de nivel terciario solo debe clasificarse aquí de manera excepcional.
  '0031':
    nombre: competencias personales y desarrollo
    en: |-
      Personal skills are defined by reference to the effects on the individual's capacity (mental, social etc.). This detailed field covers personal skills programmes not included in 0011 'Basic programmes and qualifications' or 0021 'Literacy and numeracy', giving key competencies and transferable skills.
      Programmes and qualifications with the following main content are classified here:
      Argumentation and presentation
      Assertiveness training
      Communication skills
      Co-operation
      Development of behavioural capacities
      Development of mental skills
      Job-seeking programmes
      Parenting courses
      Public speaking
      Self-esteem skills
      Social competence
      Time management

      === Inclusions
      Education and training in leadership in the context of personal development is included here.
      Education and training related to the work place or to work assignments is included in this detailed field if it has more to do with personal development than work development. Personal skills courses can be taught at the workplace, but still be classified here based on their content.
      Programmes for people with special needs on how to cope with their daily life are included here

      === Exclusions
      Study of leadership in the context of management is excluded from this group and included in detailed field 0413 'Management and administration'.
    es: |-
      Las competencias personales se definen en función de sus efectos sobre la capacidad del individuo (mental, social, etc.). Este campo detallado abarca los programas de competencias personales no incluidos en 0011 'Programas y titulaciones básicos' ni en 0021 'Alfabetización y aritmética elemental', que proporcionan competencias clave y competencias transferibles.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Argumentación y presentación
      Entrenamiento en asertividad
      Habilidades de comunicación
      Cooperación
      Desarrollo de capacidades conductuales
      Desarrollo de habilidades mentales
      Programas de búsqueda de empleo
      Cursos para padres
      Oratoria
      Habilidades de autoestima
      Competencia social
      Gestión del tiempo

      === Inclusiones
      Se incluyen aquí la educación y la formación en liderazgo en el contexto del desarrollo personal.
      La educación y la formación relacionadas con el lugar de trabajo o con las tareas laborales se incluyen en este campo detallado si tienen más que ver con el desarrollo personal que con el desarrollo laboral. Los cursos de competencias personales pueden impartirse en el lugar de trabajo y, aun así, clasificarse aquí en función de su contenido.
      Se incluyen aquí los programas para personas con necesidades especiales sobre cómo afrontar su vida diaria

      === Exclusiones
      El estudio del liderazgo en el contexto de la gestión se excluye de este grupo y se incluye en el campo detallado 0413 'Gestión y administración'.
  '0111':
    nombre: ciencias de la educación
    en: |-
      Education science is the study of the learning process and the theories, methods and techniques of imparting knowledge to others.
      Programmes and qualifications with the following main content are classified here:
      Curriculum studies
      Didactics
      Educational assessment, testing and measurement
      Educational evaluation and research
      Paedagogical sciences

      === Exclusions
      Teacher training programmes which combine education science with the practice of teaching are excluded from this detailed field and included in one of the detailed fields for teacher training (0112-0114).
    es: |-
      Las ciencias de la educación son el estudio del proceso de aprendizaje y de las teorías, los métodos y las técnicas para transmitir conocimientos a otras personas.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Estudios curriculares
      Didáctica
      Valoración, pruebas y medición educativas
      Evaluación e investigación educativas
      Ciencias pedagógicas

      === Exclusiones
      Los programas de formación docente que combinan las ciencias de la educación con la práctica de la enseñanza se excluyen de este campo detallado y se incluyen en uno de los campos detallados de formación docente (0112-0114).
  '0112':
    nombre: formación para docentes de  educación preprimaria
    en: "Training for pre-school teachers is the study of the theories, methods and practice of teaching\
      \ very young children up to 7 years of age within formal school settings at pre-primary or early\
      \ childhood educational development levels.\nProgrammes and qualifications with the following main\
      \ content are classified here:\nEarly childhood teaching (within formal school settings)\nPre-primary\
      \ teacher training\n\n=== Exclusions\nTraining in caring for children outside formal school settings\
      \ is excluded from this detailed field and included in detailed field 0922 'Child care and youth\
      \ services'.\x9D"
    es: |-
      La formación para docentes de educación preprimaria es el estudio de las teorías, los métodos y la práctica de la enseñanza a niños muy pequeños de hasta 7 años de edad en entornos escolares formales, en los niveles de educación preprimaria o de desarrollo educativo de la primera infancia.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Enseñanza en la primera infancia (en entornos escolares formales)
      Formación de docentes de educación preprimaria

      === Exclusiones
      La formación en el cuidado de niños fuera de los entornos escolares formales se excluye de este campo detallado y se incluye en el campo detallado 0922 'Cuidado de niños y servicios para jóvenes'.
  '0113':
    nombre: formación para docentes sin asignatura de especialización
    en: |-
      Training for teachers without subject specialisation is the study of the theories, methods and practice of providing children between approximately 5 and 15 years of age with the fundamental skills in reading, writing and mathematics along with an elementary understanding of other subjects such as history, geography, social science etc. and laying the foundation for lifelong learning. Subject specialisation is stressed less than in detailed field 0114 'Teacher training with subject specialisation'. The study of teaching children with special needs is included in this detailed field, likewise the study of teaching adults fundamental reading and writing skills and teaching immigrants these types of skills in their home or first language.
      Programmes and qualifications with the following main content are classified here:
      Class teacher training
      Indigenous teacher training
      Primary teaching
      Teacher training for children with special needs

      === Inclusions
      The study of teaching adults basic literacy and numeracy skills is included here. Teacher's aide (teaching assistant) is also included here.

      === Exclusions
      Teacher training with subject specialisation even if intended for the teaching of children in primary or lower secondary education is excluded from this detailed field and included in detailed field 0114 'Teacher training with subject specialisation'.
    es: |-
      La formación para docentes sin asignatura de especialización es el estudio de las teorías, los métodos y la práctica de proporcionar a niños de aproximadamente 5 a 15 años de edad las competencias fundamentales en lectura, escritura y matemáticas, junto con una comprensión elemental de otras materias como historia, geografía, ciencias sociales, etc., y de sentar las bases para el aprendizaje a lo largo de la vida. La especialización en una asignatura recibe menos énfasis que en el campo detallado 0114 'Formación para docentes con asignatura de especialización'. El estudio de la enseñanza a niños con necesidades especiales se incluye en este campo detallado, al igual que el estudio de la enseñanza a adultos de las competencias fundamentales de lectura y escritura y la enseñanza de este tipo de competencias a inmigrantes en su lengua materna o primera lengua.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Formación de maestros de aula
      Formación de docentes indígenas
      Enseñanza primaria
      Formación de docentes para niños con necesidades especiales

      === Inclusiones
      Se incluye aquí el estudio de la enseñanza a adultos de competencias básicas de alfabetización y aritmética elemental. También se incluye aquí la formación de auxiliares docentes (asistentes de enseñanza).

      === Exclusiones
      La formación para docentes con asignatura de especialización, aunque esté destinada a la enseñanza a niños de educación primaria o secundaria baja, se excluye de este campo detallado y se incluye en el campo detallado 0114 'Formación para docentes con asignatura de especialización'.
  '0114':
    nombre: formación para docentes con asignatura de especialización
    en: |-
      Teacher training with subject specialisation is the study of the theories, methods and practice of teaching a specific subject, mostly at secondary or higher levels of education. Programmes and qualifications included in this detailed field often comprise both studies as well as the subject/subjects that are going to be taught.
      Programmes and qualifications with the following main content are classified here:
      Teacher training - arts and crafts
      Teacher training - commercial subjects
      Teacher training - music
      Teacher training - nursing
      Teacher training - physical training
      Teacher training - second languages
      Teacher training - specific theoretical subjects, e.g. English, mathematics, history
      Teacher training - technical subjects
      Teacher training - vocational subjects
      Training of driving instructors
      Training of trainers

      === Inclusions
      Teacher training courses for university teachers, instructors of work place and working life skills and in practical and artistic subjects are included here.

      === Exclusions
      Training of sports trainers is excluded from this detailed field and included in detailed field 1014 'Sports'.
    es: |-
      La formación para docentes con asignatura de especialización es el estudio de las teorías, los métodos y la práctica de la enseñanza de una materia específica, principalmente en los niveles de educación secundaria o superiores. Los programas y las titulaciones incluidos en este campo detallado suelen comprender tanto estos estudios como la materia o las materias que se van a enseñar.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Formación docente: artes y oficios
      Formación docente: materias comerciales
      Formación docente: música
      Formación docente: enfermería
      Formación docente: educación física
      Formación docente: segundas lenguas
      Formación docente: materias teóricas específicas, p. ej., inglés, matemáticas, historia
      Formación docente: materias técnicas
      Formación docente: materias de formación profesional
      Formación de instructores de conducción
      Formación de formadores

      === Inclusiones
      Se incluyen aquí los cursos de formación docente para profesores universitarios, para instructores de competencias para el lugar de trabajo y la vida laboral, y en materias prácticas y artísticas.

      === Exclusiones
      La formación de entrenadores deportivos se excluye de este campo detallado y se incluye en el campo detallado 1014 'Deportes'.
  '0211':
    nombre: técnicas audiovisuales y producción para medios de comunicación
    en: |-
      Audio-visual techniques and media production is the study of techniques and skills to produce books or newspapers, radio or TV production, film or video production, recorded music production and graphic reproduction. It includes programmes and qualifications in methods of colour reproduction, photography and computer graphics. Study of combining pictures, words and decorations in the production of books, magazines, posters, adverts etc. is also included.
      Programmes and qualifications with the following main content are classified here:
      Animation
      Bookbinding
      Camera operating
      Compositing (printing)
      Computer game production
      Computer type-setting
      Film and video production
      Graphic design
      Graphic reproduction
      Illustration
      Interactive media design
      Media techniques
      Multimedia production
      Photography
      Pre-press operations
      Print finishing and binding
      Printing
      Publishing design, lay-out
      Radio and TV production
      Recorded music production
      Sound techniques
      Type-setting

      === Inclusions
      Desktop publishing and lay-out are included here.

      === Exclusions
      Programmes and qualifications in the use of specific software applications for desktop publishing and website development are excluded from this detailed field and included in detailed field 0611 'Computer use'.
      Study of journalism (wording and content of messages) is excluded from this detailed field and included in detailed field 0321 'Journalism and reporting'.
    es: |-
      Las técnicas audiovisuales y producción para medios de comunicación son el estudio de las técnicas y las habilidades para producir libros o periódicos, producción de radio o televisión, producción de cine o video, producción de música grabada y reproducción gráfica. Incluye programas y titulaciones en métodos de reproducción del color, fotografía y gráficos por computadora. También se incluye el estudio de la combinación de imágenes, palabras y elementos decorativos en la producción de libros, revistas, carteles, anuncios, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Animación
      Encuadernación
      Operación de cámaras
      Composición (impresión)
      Producción de videojuegos
      Composición tipográfica por computadora
      Producción de cine y video
      Diseño gráfico
      Reproducción gráfica
      Ilustración
      Diseño de medios interactivos
      Técnicas de medios de comunicación
      Producción multimedia
      Fotografía
      Operaciones de preimpresión
      Acabado y encuadernación de impresos
      Impresión
      Diseño editorial, diagramación
      Producción de radio y televisión
      Producción de música grabada
      Técnicas de sonido
      Composición tipográfica

      === Inclusiones
      Se incluyen aquí la autoedición y la diagramación.

      === Exclusiones
      Los programas y las titulaciones en el uso de aplicaciones de software específicas para autoedición y desarrollo de sitios web se excluyen de este campo detallado y se incluyen en el campo detallado 0611 'Uso de computadoras'.
      El estudio del periodismo (redacción y contenido de los mensajes) se excluye de este campo detallado y se incluye en el campo detallado 0321 'Periodismo y reportajes'.
  '0212':
    nombre: diseño industrial, de modas e interiores
    en: |-
      Fashion, interior and industrial design is the study of creatively combining line, form and fabric in designing and constructing e.g. fashion garments, industrial products and interiors.
      Programmes and qualifications with the following main content are classified here:
      Costume design
      Design of industrial products
      Fashion design
      Interior architecture
      Interior design
      Stage designing
      Window dressing

      === Exclusions
      Study of Building design is excluded from this detailed field and included in detailed field 0731 'Architecture and town planning'.
      Study of Industrial design is excluded from this detailed field if emphasis is given to technical subjects and not to artistic design, and included in the appropriate detailed field under 071 'Engineering and engineering trades'.
      Publishing design and graphic design are excluded from this detailed field and included in detailed field 0211 'Audio-visual techniques and media production'.
    es: |-
      El diseño industrial, de modas e interiores es el estudio de la combinación creativa de líneas, formas y telas en el diseño y la confección de, por ejemplo, prendas de moda, productos industriales e interiores.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Diseño de vestuario
      Diseño de productos industriales
      Diseño de modas
      Arquitectura de interiores
      Diseño de interiores
      Escenografía
      Decoración de vidrieras

      === Exclusiones
      El estudio del diseño de edificios se excluye de este campo detallado y se incluye en el campo detallado 0731 'Arquitectura y urbanismo'.
      El estudio del diseño industrial se excluye de este campo detallado si se hace hincapié en materias técnicas y no en el diseño artístico, y se incluye en el campo detallado correspondiente dentro de 071 'Ingeniería y profesiones afines'.
      El diseño editorial y el diseño gráfico se excluyen de este campo detallado y se incluyen en el campo detallado 0211 'Técnicas audiovisuales y producción para medios de comunicación'.
  '0213':
    nombre: bellas artes
    en: |-
      Fine arts is the study of visual forms of creative expression, dealing with theory, history, techniques, performance and production in fine arts.
      Programmes and qualifications with the following main content are classified here:
      Art theory
      Calligraphy
      Etching
      Fine art printmaking
      History of art
      Painting
      Philosophy of art
      Sculpture

      === Exclusions
      Training in ceramics, pottery etc is excluded from this detailed field and included in detailed field 0214 'Handicrafts'.
      Study of architecture is excluded from this detailed field and included in detailed field 0731 'Architecture and town planning'.
      Teacher training in arts is excluded from this detailed field and included in detailed field 0114 'Teacher training with subject specialisation'.
    es: |-
      Las bellas artes son el estudio de las formas visuales de expresión creativa, y abordan la teoría, la historia, las técnicas, la ejecución y la producción en las bellas artes.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Teoría del arte
      Caligrafía
      Aguafuerte
      Grabado artístico
      Historia del arte
      Pintura
      Filosofía del arte
      Escultura

      === Exclusiones
      La formación en cerámica, alfarería, etc. se excluye de este campo detallado y se incluye en el campo detallado 0214 'Artesanías'.
      El estudio de la arquitectura se excluye de este campo detallado y se incluye en el campo detallado 0731 'Arquitectura y urbanismo'.
      La formación docente en artes se excluye de este campo detallado y se incluye en el campo detallado 0114 'Formación para docentes con asignatura de especialización'.
  '0214':
    nombre: artesanías
    en: |-
      Handicrafts is the study of techniques and skills in a chosen craft, such as jewellery, pottery, weaving, woodcarving etc.
      Programmes and qualifications with the following main content are classified here:
      Ceramics
      Crafts, folk arts and artisan
      Decorative metal crafts
      Indigenous crafts
      Embroidery
      Floristry (flower arranging)
      Glass arts and craft
      Goldsmithing
      Jewellery
      Making of musical instruments (not industrial)
      Musical instruments (repairing and tuning)
      Silversmithing
      Stone carving (craft)
      Weaving (craft)
      Woodcarving

      === Exclusions
      Study of industrial (large scaled mechanised) production of pottery, woven materials, embroidery etc. is excluded from this field and included in one of the detailed fields under broad field 07 'Engineering, manufacturing and construction'.
    es: |-
      Las artesanías son el estudio de las técnicas y las habilidades de un oficio artesanal elegido, como joyería, alfarería, tejido, tallado en madera, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Cerámica
      Oficios, artes populares y artesanía
      Artesanía decorativa en metal
      Artesanías indígenas
      Bordado
      Floristería (arreglos florales)
      Artes y artesanía en vidrio
      Orfebrería
      Joyería
      Fabricación de instrumentos musicales (no industrial)
      Instrumentos musicales (reparación y afinación)
      Platería
      Tallado en piedra (artesanía)
      Tejido (artesanía)
      Tallado en madera

      === Exclusiones
      El estudio de la producción industrial (mecanizada a gran escala) de alfarería, materiales tejidos, bordados, etc. se excluye de este campo y se incluye en uno de los campos detallados dentro del campo amplio 07 'Ingeniería, industria y construcción'.
  '0215':
    nombre: música y artes escénicas
    en: |-
      Music and performing arts is the study of the principles and techniques associated with performance involving music, speech, movement, mime, characterisation, improvisation and stage craft.
      Programmes and qualifications with the following main content are classified here:
      Acting and directing
      Ballet
      Choreography
      Circus
      Composition (music)
      Conducting (music)
      Creative and performance art
      Dance
      Drama
      History of film and theatre
      History of music
      Music
      Music conducting
      Musicology
      Theatre/Theatre sciences

      === Inclusions
      Study of music and performing arts history and theory is included here.

      === Exclusions
      Teacher training in music and other performing arts is excluded from this detailed field and included in detailed field 0114 'Teacher training with subject specialisation'.
      022 Humanities (except languages)
    es: |-
      La música y artes escénicas son el estudio de los principios y las técnicas asociados a la interpretación que involucra música, habla, movimiento, mímica, caracterización, improvisación y escenotecnia.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Actuación y dirección
      Ballet
      Coreografía
      Circo
      Composición (música)
      Dirección (música)
      Arte creativo y escénico
      Danza
      Arte dramático
      Historia del cine y del teatro
      Historia de la música
      Música
      Dirección musical
      Musicología
      Teatro/Ciencias teatrales

      === Inclusiones
      Se incluye aquí el estudio de la historia y la teoría de la música y las artes escénicas.

      === Exclusiones
      La formación docente en música y otras artes escénicas se excluye de este campo detallado y se incluye en el campo detallado 0114 'Formación para docentes con asignatura de especialización'.
      022 Humanidades (excepto idiomas)
  '0221':
    nombre: religión y teología
    en: |-
      Religion and theology is the study of religious beliefs, concepts, symbols, expressions and texts of spirituality.
      Programmes and qualifications with the following main content are classified here:
      Religious history
      Study of sacred books
      Study of different religions
      Theology

      === Inclusions
      Included in this detailed field are programmes for children and young people, usually given in religious schools or seminars, in monasteries etc., aiming to develop an interest in the tenets of their religion and sufficient familiarity with its philosophy to assist in the propagation of their faith.

      === Exclusions
      Basic programmes given in religious schools, seminars etc. containing religious instruction but not emphasising it or leading to a religious vocation, are excluded from this detailed field and included in 0011 'Basic programmes and qualifications'. Islamic sharia programmes and qualifications are excluded from this detailed field and included in detailed field 0421 'Law'.
    es: |-
      La religión y teología son el estudio de las creencias, los conceptos, los símbolos, las expresiones y los textos religiosos de la espiritualidad.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Historia de las religiones
      Estudio de libros sagrados
      Estudio de diferentes religiones
      Teología

      === Inclusiones
      Se incluyen en este campo detallado los programas para niños y jóvenes, generalmente impartidos en escuelas religiosas o seminarios, en monasterios, etc., cuyo objetivo es desarrollar el interés por los principios de su religión y una familiaridad suficiente con su filosofía para contribuir a la difusión de su fe.

      === Exclusiones
      Los programas básicos impartidos en escuelas religiosas, seminarios, etc. que contienen instrucción religiosa pero no hacen hincapié en ella ni conducen a una vocación religiosa se excluyen de este campo detallado y se incluyen en 0011 'Programas y titulaciones básicos'. Los programas y las titulaciones de sharía islámica se excluyen de este campo detallado y se incluyen en el campo detallado 0421 'Derecho'.
  '0222':
    nombre: historia y arqueología
    en: |-
      History is the study of past events, especially the political, social and economic development of a country, a continent or the world. History of medicine is classified here, likewise the study of history of science and ideas. Archaeology is the study of ancient civilisations by scientific analysis of what is found in the ground.
      Programmes and qualifications with the following main content are classified here:
      Archaeology
      Cultural history
      Folklore studies
      History
      History of literature
      History of medicine
      History of science and ideas
      History of technology

      === Inclusions
      Restoration and preservation of artistic heritage are included here.

      === Exclusions
      Study of literature combined with study of a specific language is excluded from this detailed field and included in detailed field 0232 'Literature and linguistics'.
      Study of classical languages (Latin etc.) is excluded from this detailed field and included in detailed field 0231 'Language acquisition'.
      Study of History of art is excluded from this detailed field and included in detailed field 0213 'Fine arts'.
      Study of Music and performing arts history is excluded from this detailed field and included in detailed field 0215 'Music and performing arts'.
      Study of Economic history/history of economics is excluded from this detailed field and included in detailed field 0311 'Economics'.
    es: |-
      La historia es el estudio de los acontecimientos pasados, especialmente del desarrollo político, social y económico de un país, un continente o el mundo. La historia de la medicina se clasifica aquí, al igual que el estudio de la historia de la ciencia y de las ideas. La arqueología es el estudio de las civilizaciones antiguas mediante el análisis científico de lo que se encuentra en el suelo.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Arqueología
      Historia cultural
      Estudios de folclore
      Historia
      Historia de la literatura
      Historia de la medicina
      Historia de la ciencia y de las ideas
      Historia de la tecnología

      === Inclusiones
      Se incluyen aquí la restauración y la conservación del patrimonio artístico.

      === Exclusiones
      El estudio de la literatura combinado con el estudio de una lengua específica se excluye de este campo detallado y se incluye en el campo detallado 0232 'Literatura y lingüística'.
      El estudio de las lenguas clásicas (latín, etc.) se excluye de este campo detallado y se incluye en el campo detallado 0231 'Adquisición del lenguaje'.
      El estudio de la historia del arte se excluye de este campo detallado y se incluye en el campo detallado 0213 'Bellas artes'.
      El estudio de la historia de la música y las artes escénicas se excluye de este campo detallado y se incluye en el campo detallado 0215 'Música y artes escénicas'.
      El estudio de la historia económica/historia de la economía se excluye de este campo detallado y se incluye en el campo detallado 0311 'Economía'.
  '0223':
    nombre: filosofía y ética
    en: |-
      Philosophy and ethics is the study of philosophy, ethics and related subjects dealing with the conception of life.
      Programmes and qualifications with the following main content are classified here:
      Ethics
      Logic
      Morals
      Philosophy

      === Exclusions
      Study of religion is excluded from this detailed field and included in detailed field 0221 'Religion'.
      Study of Philosophy of arts is excluded from this detailed field and is included in detailed field 0213 'Fine arts'
    es: |-
      La filosofía y ética son el estudio de la filosofía, la ética y las materias afines que abordan la concepción de la vida.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ética
      Lógica
      Moral
      Filosofía

      === Exclusiones
      El estudio de la religión se excluye de este campo detallado y se incluye en el campo detallado 0221 'Religión'.
      El estudio de la filosofía del arte se excluye de este campo detallado y se incluye en el campo detallado 0213 'Bellas artes'
  '0231':
    nombre: adquisición del lenguaje
    en: |-
      Language acquisition is the study of the structure and composition of languages taught as second or foreign languages (i.e. that are intended for non-native or non-fluent speakers of the language). It includes the study of related cultures, literature, linguistics and phonetics if related to the specific language being acquired and forms part of the same programme or qualification. Classical or dead languages are included here as it is assumed there are no native speakers of the language and hence the manner of teaching and the content of the curriculum are more similar to the teaching of foreign languages.
      Programmes and qualifications with the following main content are classified here:
      Classical languages
      Exogenous languages
      Foreign languages
      Interpretation
      Phonetics
      Second languages, for example English as a second language
      Sign language
      Sign language interpreting
      Translation

      === Inclusions:
      Language and linguistics studies are included here if the linguistics are related to a specific language or languages being acquired and forming part of the same programme or qualification. Translation and interpretation are included here.

      === Exclusions:
      The study of the mother tongue or first language (i.e. that are intended for native, fluent or competent speakers of the language), even if this language is not a national language of the country of study (e.g. programmes for immigrants learning their mother tongue) are excluded from this detailed field and included in detailed field 0232 'Literature and linguistics'.
    es: |-
      La adquisición del lenguaje es el estudio de la estructura y la composición de las lenguas enseñadas como segundas lenguas o lenguas extranjeras (es decir, destinadas a hablantes no nativos o sin fluidez en la lengua). Incluye el estudio de las culturas, la literatura, la lingüística y la fonética afines si están relacionadas con la lengua específica que se adquiere y forman parte del mismo programa o titulación. Las lenguas clásicas o muertas se incluyen aquí, ya que se supone que no existen hablantes nativos de la lengua y, por lo tanto, la forma de enseñanza y el contenido del plan de estudios se asemejan más a la enseñanza de lenguas extranjeras.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Lenguas clásicas
      Lenguas exógenas
      Lenguas extranjeras
      Interpretación
      Fonética
      Segundas lenguas, por ejemplo, inglés como segunda lengua
      Lengua de señas
      Interpretación en lengua de señas
      Traducción

      === Inclusiones:
      Los estudios de lengua y lingüística se incluyen aquí si la lingüística está relacionada con una o más lenguas específicas que se adquieren y forma parte del mismo programa o titulación. Se incluyen aquí la traducción y la interpretación.

      === Exclusiones:
      El estudio de la lengua materna o primera lengua (es decir, destinada a hablantes nativos, con fluidez o competentes en la lengua), aunque esta lengua no sea una lengua nacional del país de estudio (p. ej., programas para inmigrantes que aprenden su lengua materna), se excluye de este campo detallado y se incluye en el campo detallado 0232 'Literatura y lingüística'.
  '0232':
    nombre: literatura y lingüística
    en: |-
      Literature and linguistics is here defined as the study of language(s) intended for native, fluent or competent speakers of the language. It includes the study of related literature and linguistics and may or may not include the structure and composition of the language.
      Programmes and qualifications with the following main content are classified here:
      Creative writing
      First language
      Indigenous languages
      Linguistics
      Literature
      'Mother tongue' languages
      Native first languages

      === Inclusions
      Languages taught as the first language ('mother tongue'), even if the language is not the national language of the country of study (e.g. programmes for immigrants in their home or first language) are included here. Local and regional languages are included here if they are first languages spoken by a significant minority in the country and are intended for at least competent speakers of the language.
      Study of comparative literature is included here. Study of general linguistics (not related to the study of a particular language) is included here. Study of literature in general (not combined with study of a special language) is included here.

      === Exclusions
      Language programmes are excluded from this detailed field if the language is taught as a foreign or a second language, and are then included in 0231 'Language acquisition'.
      Programmes in literacy and numeracy are excluded from this detailed field and included in detailed field 0021 'Literacy and numeracy'.
      Sign language programmes are excluded from this detailed field and included in detailed field 0231 'Language acquisition'.
    es: |-
      La literatura y lingüística se definen aquí como el estudio de una o más lenguas destinado a hablantes nativos, con fluidez o competentes en la lengua. Incluye el estudio de la literatura y la lingüística afines y puede incluir o no la estructura y la composición de la lengua.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Escritura creativa
      Primera lengua
      Lenguas indígenas
      Lingüística
      Literatura
      Lenguas 'maternas'
      Primeras lenguas nativas

      === Inclusiones
      Se incluyen aquí las lenguas enseñadas como primera lengua ('lengua materna'), aunque la lengua no sea la lengua nacional del país de estudio (p. ej., programas para inmigrantes en su lengua materna o primera lengua). Las lenguas locales y regionales se incluyen aquí si son primeras lenguas habladas por una minoría significativa en el país y están destinadas al menos a hablantes competentes de la lengua.
      Se incluye aquí el estudio de la literatura comparada. Se incluye aquí el estudio de la lingüística general (no relacionada con el estudio de una lengua en particular). Se incluye aquí el estudio de la literatura en general (no combinada con el estudio de una lengua específica).

      === Exclusiones
      Los programas de idiomas se excluyen de este campo detallado si la lengua se enseña como lengua extranjera o segunda lengua, y en ese caso se incluyen en 0231 'Adquisición del lenguaje'.
      Los programas de alfabetización y aritmética elemental se excluyen de este campo detallado y se incluyen en el campo detallado 0021 'Alfabetización y aritmética elemental'.
      Los programas de lengua de señas se excluyen de este campo detallado y se incluyen en el campo detallado 0231 'Adquisición del lenguaje'.
  '0311':
    nombre: economía
    en: |-
      Economics is the study of economic policy, economic theory and economic decisionmaking.
      Programmes and qualifications with the following main content are classified here:
      Econometrics
      Economic history
      Economics
      Political economics

      === Exclusions
      Study of economics where emphasis is given to business studies is excluded from this detailed field and classified under 041 'Business and administration'. Study of home economics is excluded from this detailed field and included in the detailed field 1011 'Domestic services'.
    es: |-
      La economía es el estudio de la política económica, la teoría económica y la toma de decisiones económicas.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Econometría
      Historia económica
      Economía
      Economía política

      === Exclusiones
      El estudio de la economía con énfasis en los estudios empresariales se excluye de este campo detallado y se clasifica dentro de 041 'Educación comercial y administración'. El estudio de la economía doméstica se excluye de este campo detallado y se incluye en el campo detallado 1011 'Servicios domésticos'.
  '0312':
    nombre: ciencias políticas y educación cívica
    en: |-
      Political sciences and civics is the study of government and political principles or practice. The study of the rights and duties of the citizens are included here.
      Programmes and qualifications with the following main content are classified here:
      Civics
      Human rights
      International relations
      Peace and conflict studies
      Political history
      Political science
      Public policy studies

      === Exclusions
      Study of political economics is excluded from this detailed field and included in the detailed field 0311 'Economics'.
    es: |-
      Las ciencias políticas y educación cívica son el estudio del gobierno y de los principios o la práctica política. Se incluye aquí el estudio de los derechos y deberes de los ciudadanos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Educación cívica
      Derechos humanos
      Relaciones internacionales
      Estudios sobre la paz y los conflictos
      Historia política
      Ciencia política
      Estudios de políticas públicas

      === Exclusiones
      El estudio de la economía política se excluye de este campo detallado y se incluye en el campo detallado 0311 'Economía'.
  '0313':
    nombre: psicología
    en: |-
      Psychology is the study of the human mind and behaviour as a result of individual differences, experience and environment.
      Programmes and qualifications with the following main content are classified here:
      Cognitive science
      Psychoanalysis
      Psychology
      Psychotherapy
    es: |-
      La psicología es el estudio de la mente y el comportamiento humanos como resultado de las diferencias individuales, la experiencia y el entorno.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ciencia cognitiva
      Psicoanálisis
      Psicología
      Psicoterapia
  '0314':
    nombre: sociología y estudios culturales
    en: |-
      Sociology and cultural studies is the study of human beings and the way they behave in groups and in relation to society. The study of ethnology and social anthropology are included here, likewise the study of human and social geography.
      Programmes and qualifications with the following main content are classified here:
      Criminology
      Cultural geography
      Cultural studies
      Demography/population studies
      Ethnology
      Gender studies
      Social anthropology
      Sociology

      === Exclusions
      Social welfare where emphasis is given to practical social work is excluded from this detailed field and included in detailed field 0923 'Social work and counselling'.
      Physical geography is excluded from this detailed field and included in detailed field 0532 'Earth science'.
    es: |-
      La sociología y estudios culturales son el estudio de los seres humanos y de su forma de comportarse en grupos y en relación con la sociedad. Se incluyen aquí el estudio de la etnología y la antropología social, al igual que el estudio de la geografía humana y social.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Criminología
      Geografía cultural
      Estudios culturales
      Demografía/estudios de población
      Etnología
      Estudios de género
      Antropología social
      Sociología

      === Exclusiones
      El bienestar social con énfasis en el trabajo social práctico se excluye de este campo detallado y se incluye en el campo detallado 0923 'Trabajo social y orientación'.
      La geografía física se excluye de este campo detallado y se incluye en el campo detallado 0532 'Ciencias de la tierra'.
  '0321':
    nombre: periodismo y reportajes
    en: |-
      Journalism and reporting is the study of the theory and practices of journalism/reporting as part of the field of mass communication. Journalism and reporting is about the wording and content of messages. It comprises news reporting, writing commentaries and feature stories of public interest etc.
      Programmes and qualifications with the following main content are classified here:
      Broadcast journalism
      Editing
      Information (wording and content)
      Journalism
      Mass communication (wording and content)
      News reporting

      === Exclusions
      Study of techniques for mass communication (e.g. printing and radio/TV production) is excluded from this detailed field and included in detailed field 0211 'Audio-visual techniques and media production'.
      Study of lay-out and publishing design is excluded from this detailed field and included in detailed field 0211 'Audio-visual techniques and media production'.
      Study of public relations is excluded from this detailed field and included in detailed field 0414 'Marketing and advertising'.
    es: |-
      El periodismo y reportajes son el estudio de la teoría y las prácticas del periodismo/reportaje como parte del campo de la comunicación de masas. El periodismo y reportajes se ocupan de la redacción y el contenido de los mensajes. Comprenden la cobertura de noticias, la redacción de comentarios y de reportajes de interés público, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Periodismo audiovisual
      Edición
      Información (redacción y contenido)
      Periodismo
      Comunicación de masas (redacción y contenido)
      Cobertura de noticias

      === Exclusiones
      El estudio de las técnicas de comunicación de masas (p. ej., impresión y producción de radio/televisión) se excluye de este campo detallado y se incluye en el campo detallado 0211 'Técnicas audiovisuales y producción para medios de comunicación'.
      El estudio de la diagramación y el diseño editorial se excluye de este campo detallado y se incluye en el campo detallado 0211 'Técnicas audiovisuales y producción para medios de comunicación'.
      El estudio de las relaciones públicas se excluye de este campo detallado y se incluye en el campo detallado 0414 'Mercadotecnia y publicidad'.
  '0322':
    nombre: bibliotecología, información y archivología
    en: |-
      Library, information and archival studies is the study of the methods of selecting, acquiring, organizing and storing collections of information, and facilitating the use of information. Museum and library studies are included here.
      Programmes and qualifications with the following main content are classified here:
      Archival sciences
      Curatorial studies
      Documentation
      Information science
      Library studies
      Museum documentation
      Museum studies
      Museology

      === Exclusions
      Restoration and preservation of artistic heritage are excluded from this field and included in field 0222 'History and archaeology'.
    es: |-
      La bibliotecología, información y archivología son el estudio de los métodos de selección, adquisición, organización y almacenamiento de colecciones de información, y de facilitación del uso de la información. Se incluyen aquí los estudios de museos y bibliotecas.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ciencias archivísticas
      Estudios curatoriales
      Documentación
      Ciencias de la información
      Bibliotecología
      Documentación museística
      Estudios de museos
      Museología

      === Exclusiones
      La restauración y la conservación del patrimonio artístico se excluyen de este campo y se incluyen en el campo 0222 'Historia y arqueología'.
  '0411':
    nombre: contabilidad  e impuestos
    en: |-
      Accounting and taxation is the study of maintaining, auditing and recording financial transactions.
      Programmes and qualifications with the following main content are classified here:
      Accounting
      Auditing
      Bookkeeping
      Tax accounting
      Tax management

      === Exclusions
      Study of tax laws is excluded from this detailed field and included in detailed field 0421 'Law'.
    es: |-
      La contabilidad e impuestos son el estudio del mantenimiento, la auditoría y el registro de las transacciones financieras.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Contabilidad
      Auditoría
      Teneduría de libros
      Contabilidad tributaria
      Gestión tributaria

      === Exclusiones
      El estudio de las leyes tributarias se excluye de este campo detallado y se incluye en el campo detallado 0421 'Derecho'.
  '0412':
    nombre: gestión financiera, administración bancaria y seguros
    en: |-
      Finance, banking and insurance is the study of planning, directing, organizing and controlling financial activities and services. It includes the control and monitoring of the financial resources of organizations, institutions and individuals, and the provision of financial services at the corporate and individual level.
      Programmes and qualifications with the following main content are classified here:
      Bank teller studies
      Banking and finance
      Finance theory
      Insurance
      Investment analysis
      Investments and securities
      Pension insurance
      Social insurance
      Stock-broking

      === Exclusions
      Study of actuarial science is excluded from this detailed field and included in detailed field 0542 'Statistics'.
    es: |-
      La gestión financiera, administración bancaria y seguros son el estudio de la planificación, la dirección, la organización y el control de las actividades y los servicios financieros. Incluyen el control y el seguimiento de los recursos financieros de organizaciones, instituciones y personas, y la prestación de servicios financieros a nivel corporativo e individual.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Estudios de cajero bancario
      Banca y finanzas
      Teoría financiera
      Seguros
      Análisis de inversiones
      Inversiones y valores
      Seguros de pensiones
      Seguros sociales
      Corretaje de bolsa

      === Exclusiones
      El estudio de las ciencias actuariales se excluye de este campo detallado y se incluye en el campo detallado 0542 'Estadística'.
  '0413':
    nombre: gestión y administración
    en: |-
      Management and administration is the study of planning, directing and operating the functions and activities of organizations and institutions. Programmes in management also including administration, economics, finance etc. are included here if emphasis is given to management and administration.
      Programmes and qualifications with the following main content are classified here:
      Administration
      Educational management
      Employment management
      Entrepreneurship
      Health administration
      Logistic management
      Management science
      Office management
      Organizational theory and behaviour
      Personnel administration
      Personnel management
      'Start your own business' courses
      Supply change management
      Training management

      === Inclusions:
      Study of leadership in the context of management is included here.

      === Exclusions:
      Training in leadership in the context of personal development is excluded from this detailed field and included in detailed field 0031 'Personal skills'.
      Study of administration in the meaning of office work is excluded from this detailed field and included in detailed field 0415 'Secretarial and office work'.
    es: |-
      La gestión y administración son el estudio de la planificación, la dirección y la operación de las funciones y las actividades de organizaciones e instituciones. Los programas de gestión que también incluyen administración, economía, finanzas, etc. se incluyen aquí si se hace hincapié en la gestión y la administración.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Administración
      Gestión educativa
      Gestión del empleo
      Emprendimiento
      Administración de servicios de salud
      Gestión logística
      Ciencias de la gestión
      Gestión de oficinas
      Teoría y comportamiento organizacional
      Administración de personal
      Gestión de personal
      Cursos de 'Inicie su propio negocio'
      Gestión de la cadena de suministro
      Gestión de la formación

      === Inclusiones:
      Se incluye aquí el estudio del liderazgo en el contexto de la gestión.

      === Exclusiones:
      La formación en liderazgo en el contexto del desarrollo personal se excluye de este campo detallado y se incluye en el campo detallado 0031 'Competencias personales'.
      El estudio de la administración en el sentido de trabajo de oficina se excluye de este campo detallado y se incluye en el campo detallado 0415 'Secretariado y trabajo de oficina'.
  '0414':
    nombre: mercadotecnia y publicidad
    en: |-
      Marketing and advertising is the study of promoting the exchange processes of goods and services between organizations and/or individuals, and the study of consumer behaviour and requirements. It includes the study of the role of product development, pricing, distribution, promotion and sales in order to maximise business performance.
      Programmes and qualifications with the following main content are classified here:
      Advertising
      Consumer behaviour
      Market research
      Marketing
      Merchandising
      Public relations
    es: |-
      La mercadotecnia y publicidad son el estudio de la promoción de los procesos de intercambio de bienes y servicios entre organizaciones y/o personas, y el estudio del comportamiento y las necesidades del consumidor. Incluyen el estudio del papel del desarrollo de productos, la fijación de precios, la distribución, la promoción y las ventas para maximizar el desempeño empresarial.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Publicidad
      Comportamiento del consumidor
      Investigación de mercados
      Mercadotecnia
      Comercialización (merchandising)
      Relaciones públicas
  '0415':
    nombre: secretariado y trabajo de oficina
    en: |-
      Secretarial and office work is the study of administrative procedures and practices, office technology and clerical, shorthand and keyboard skills. Specialised secretarial programmes (bilingual, medical, law, accounting etc) are included if the programme has secretarial work as its objective, rather than work as specialised assistants.
      Programmes and qualifications with the following main content are classified here:
      Administrative and secretarial services
      Clerical programmes
      Data entry
      Foreign language secretary programmes
      Keyboard skills
      Legal secretary programmes
      Medical secretary programmes
      Operation of office equipment
      Receptionist training
      Secretarial programmes
      Shorthand
      Switchboard operating
      Typing

      === Inclusions
      Broad secretarial programmes comprising among other things computer courses are included here.

      === Exclusions
      Separate programmes or qualifications in using a specific computer software are excluded from this detailed field and included under detailed field 0611 'Computer use'.
      Office management is excluded from this detailed field and included in detailed field 0413 'Management and administration'.
      Hotel receptionist programmes are excluded from this detailed field and included in detailed field 1013 'Hotel, restaurant and catering'.
    es: |-
      El secretariado y trabajo de oficina son el estudio de los procedimientos y las prácticas administrativas, la tecnología de oficina y las habilidades administrativas, de taquigrafía y de teclado. Los programas de secretariado especializados (bilingüe, médico, jurídico, contable, etc.) se incluyen si el programa tiene como objetivo el trabajo de secretariado y no el trabajo como asistentes especializados.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Servicios administrativos y de secretariado
      Programas de trabajo administrativo
      Ingreso de datos
      Programas de secretariado en lenguas extranjeras
      Habilidades de teclado
      Programas de secretariado jurídico
      Programas de secretariado médico
      Operación de equipos de oficina
      Formación de recepcionistas
      Programas de secretariado
      Taquigrafía
      Operación de centrales telefónicas
      Mecanografía

      === Inclusiones
      Se incluyen aquí los programas generales de secretariado que comprenden, entre otras cosas, cursos de computación.

      === Exclusiones
      Los programas o las titulaciones independientes en el uso de un software específico se excluyen de este campo detallado y se incluyen en el campo detallado 0611 'Uso de computadoras'.
      La gestión de oficinas se excluye de este campo detallado y se incluye en el campo detallado 0413 'Gestión y administración'.
      Los programas de recepcionista de hotel se excluyen de este campo detallado y se incluyen en el campo detallado 1013 'Hotelería, restaurantes y servicios de banquetes'.
  '0416':
    nombre: ventas al por mayor y al por menor
    en: |-
      Wholesale and retail sales is the study of buying and selling goods and services, including stock management, pricing practices, loss prevention, sales systems and procedures. It includes the study of the workings and current trends of the wholesale and retail industries. Selling of buildings and properties is also included.
      Programmes and qualifications with the following main content are classified here:
      Auctioneering
      Consumer services
      Demonstration techniques
      Purchasing
      Real-estate business
      Retailing
      Stock-keeping
      Ware-housing
      Wholesaling

      === Inclusions
      Study of buying and selling buildings and properties is included here.
    es: |-
      Las ventas al por mayor y al por menor son el estudio de la compra y venta de bienes y servicios, incluidos la gestión de existencias, las prácticas de fijación de precios, la prevención de pérdidas, y los sistemas y procedimientos de venta. Incluyen el estudio del funcionamiento y las tendencias actuales de los sectores mayorista y minorista. También se incluye la venta de edificios y propiedades.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Subastas
      Servicios al consumidor
      Técnicas de demostración
      Compras
      Negocio inmobiliario
      Venta al por menor
      Control de existencias
      Almacenamiento
      Venta al por mayor

      === Inclusiones
      Se incluye aquí el estudio de la compra y venta de edificios y propiedades.
  '0417':
    nombre: competencias laborales
    en: |-
      Work skills is the study of the structure and function of working life. It comprises programmes, mainly given as staff training, related to the working place and to work assignments.
      Programmes and qualifications with the following main content are classified here:
      Clients' needs
      Company knowledge
      Customer service training
      'Introduction to work' courses
      Organization at work
      Quality assurance
      Trade union courses (general)
      Work development

      === Inclusions
      Staff training related to the work place or work assignments is included here.

      === Exclusions
      Training related to the work place or work assignments is excluded from this detailed field if it has more to do with personal development than work development and is included in detailed field 0031 'Personal skills'.
      Staff training which can be classified to any other field is excluded from this detailed field and included in the appropriate field (e.g. quality courses should, if technical, be included in the detailed fields under 071 'Engineering and engineering trades'.)
      Programmes in work environment should be included in detailed field 1022 'Occupational health and safety'.
      Programmes, mostly at tertiary level, dealing with working life in general in terms of the labour market, the social partners, industrial psychology etc. are excluded from this detailed field and included in the detailed fields under 031 'Social and behaviour sciences'.
    es: |-
      Las competencias laborales son el estudio de la estructura y el funcionamiento de la vida laboral. Comprenden programas, impartidos principalmente como capacitación del personal, relacionados con el lugar de trabajo y con las tareas laborales.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Necesidades de los clientes
      Conocimiento de la empresa
      Capacitación en atención al cliente
      Cursos de 'Introducción al trabajo'
      Organización en el trabajo
      Aseguramiento de la calidad
      Cursos sindicales (generales)
      Desarrollo laboral

      === Inclusiones
      Se incluye aquí la capacitación del personal relacionada con el lugar de trabajo o con las tareas laborales.

      === Exclusiones
      La formación relacionada con el lugar de trabajo o con las tareas laborales se excluye de este campo detallado si tiene más que ver con el desarrollo personal que con el desarrollo laboral, y se incluye en el campo detallado 0031 'Competencias personales'.
      La capacitación del personal que puede clasificarse en cualquier otro campo se excluye de este campo detallado y se incluye en el campo correspondiente (p. ej., los cursos de calidad, si son técnicos, deben incluirse en los campos detallados dentro de 071 'Ingeniería y profesiones afines').
      Los programas sobre el entorno de trabajo deben incluirse en el campo detallado 1022 'Salud y seguridad ocupacional'.
      Los programas, principalmente de nivel terciario, que abordan la vida laboral en general en términos del mercado laboral, los interlocutores sociales, la psicología industrial, etc. se excluyen de este campo detallado y se incluyen en los campos detallados dentro de 031 'Ciencias sociales y del comportamiento'.
  '0421':
    nombre: derecho
    en: |-
      Law is the study of the principles and procedures for formally maintaining social order, including training for legal professions such as advocate or training for the judicial bench.
      Programmes and qualifications with the following main content are classified here:
      Commercial law
      Criminal justice studies
      History of law
      Indigenous law
      Jurisprudence
      Labour law
      Legal practice
      Notary/Notary's practise
      Paralegal studies

      === Exclusions
      Court reporting programmes and legal secretary programmes are excluded from this detailed field and included in detailed field 0415 'Secretarial and office work'.
      Police studies are excluded from this detailed field and included in detailed field 1032 'Protection of persons and property'.
    es: |-
      El derecho es el estudio de los principios y los procedimientos para mantener formalmente el orden social, incluida la formación para profesiones jurídicas como la abogacía o la formación para la judicatura.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Derecho comercial
      Estudios de justicia penal
      Historia del derecho
      Derecho indígena
      Jurisprudencia
      Derecho laboral
      Práctica jurídica
      Notariado/práctica notarial
      Estudios paralegales

      === Exclusiones
      Los programas de estenografía judicial y los programas de secretariado jurídico se excluyen de este campo detallado y se incluyen en el campo detallado 0415 'Secretariado y trabajo de oficina'.
      Los estudios policiales se excluyen de este campo detallado y se incluyen en el campo detallado 1032 'Protección de personas y bienes'.
  '0511':
    nombre: biología
    en: |-
      Biology is the study of the structure, function, reproduction, growth, evolution and behaviour of all living organisms.
      Programmes and qualifications with the following main content are classified here:
      Biology
      Botany
      Cell biology
      Entomology
      Genetics
      Mycology
      Zoology

      === Exclusions
      Study of environmental sciences, which is the study of the relation between living organisms and the environment, is excluded from this detailed field and included in detailed field 0521 'Environmental sciences'. Study of chemical processes in living organisms (biochemistry, toxicology, pharmacology etc.) is excluded from this detailed field and included in detailed field 0512 'Biochemistry'.
    es: |-
      La biología es el estudio de la estructura, la función, la reproducción, el crecimiento, la evolución y el comportamiento de todos los organismos vivos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Biología
      Botánica
      Biología celular
      Entomología
      Genética
      Micología
      Zoología

      === Exclusiones
      El estudio de las ciencias del medio ambiente, que es el estudio de la relación entre los organismos vivos y el medio ambiente, se excluye de este campo detallado y se incluye en el campo detallado 0521 'Ciencias del medio ambiente'. El estudio de los procesos químicos en los organismos vivos (bioquímica, toxicología, farmacología, etc.) se excluye de este campo detallado y se incluye en el campo detallado 0512 'Bioquímica'.
  '0512':
    nombre: bioquímica
    en: |-
      Biochemistry, sometimes called Biological chemistry, is the study of the chemistry of living organisms, including but not limited to, living matter.
      Programmes and qualifications with the following main content are classified here:
      Biological chemistry
      Cell technology
      Forensic sciences
      Genetic code (DNA, RNA) studies
      Genetic engineering
      Pharmacology
      Tissue culture technology
      Toxicology
      Virology

      === Inclusions
      Biotechnology is included here.
    es: |-
      La bioquímica, a veces denominada química biológica, es el estudio de la química de los organismos vivos, incluida, entre otros aspectos, la materia viva.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Química biológica
      Tecnología celular
      Ciencias forenses
      Estudios del código genético (ADN, ARN)
      Ingeniería genética
      Farmacología
      Tecnología de cultivo de tejidos
      Toxicología
      Virología

      === Inclusiones
      Se incluye aquí la biotecnología.
  '0521':
    nombre: ciencias del medio ambiente
    en: |-
      Environmental sciences are the study of organisms in relation to one another and to the environment.
      Programmes and qualifications with the following main content are classified here:
      Ecology
      Environmental science

      === Exclusions
      The study of biology and toxicology are excluded from this detailed field and included under narrow field 051 'Biological and related sciences'.
    es: |-
      Las ciencias del medio ambiente son el estudio de los organismos en relación con otros organismos y con el medio ambiente.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ecología
      Ciencias ambientales

      === Exclusiones
      El estudio de la biología y la toxicología se excluye de este campo detallado y se incluye dentro del campo específico 051 'Ciencias biológicas y afines'.
  '0522':
    nombre: medio ambientes naturales y vida silvestre
    en: |-
      Natural environments and wildlife is the study of the relationships between living organisms in natural environments in order to protect nature and wildlife. It includes the study of establishing and maintaining national parks in order to preserve their original natural state.
      Programmes and qualifications with the following main content are classified here:
      National parks and wildlife management
      Nature conservation
      Wildlife

      === Exclusions
      Study of agriculture, horticulture and forestry are excluded from this detailed field and included in some of the detailed fields under 08 'Agriculture, forestry, fisheries and veterinary'.
      Study of hunting and trapping is excluded from this detailed field and included in detailed field 0821 'Forestry'.
    es: |-
      Los medio ambientes naturales y vida silvestre son el estudio de las relaciones entre los organismos vivos en los entornos naturales con el fin de proteger la naturaleza y la vida silvestre. Incluyen el estudio de la creación y el mantenimiento de parques nacionales para preservar su estado natural original.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Gestión de parques nacionales y vida silvestre
      Conservación de la naturaleza
      Vida silvestre

      === Exclusiones
      El estudio de la agricultura, la horticultura y la silvicultura se excluye de este campo detallado y se incluye en algunos de los campos detallados dentro de 08 'Agricultura, silvicultura, pesca y veterinaria'.
      El estudio de la caza y el trampeo se excluye de este campo detallado y se incluye en el campo detallado 0821 'Silvicultura'.
  '0531':
    nombre: química
    en: |-
      Chemistry is the study of substances and their elements and how they react when combined.
      Programmes and qualifications with the following main content are classified here:
      Inorganic chemistry
      Organic chemistry
      Physical chemistry

      === Exclusions
      Biochemistry is excluded from this detailed field and included in detailed field 0512 'Biochemistry'.
    es: |-
      La química es el estudio de las sustancias y sus elementos, y de cómo reaccionan al combinarse.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Química inorgánica
      Química orgánica
      Fisicoquímica

      === Exclusiones
      La bioquímica se excluye de este campo detallado y se incluye en el campo detallado 0512 'Bioquímica'.
  '0532':
    nombre: ciencias de la tierra
    en: |-
      Earth sciences is the study of the composition and structure of earth including the hydrosphere and the atmosphere.
      Programmes and qualifications with the following main content are classified here:
      Climate research
      Earth science
      Geodesy
      Geography (physical)
      Geology
      Geomatics
      Geospatial technology
      Meteorology
      Oceanography
      Seismology

      === Exclusions
      Social geography is excluded from this detailed field and included in detailed field 0314 'Sociology and cultural studies'. Soil science is excluded from this detailed field and included in detailed field 0811 'Crop and livestock production'.
    es: |-
      Las ciencias de la tierra son el estudio de la composición y la estructura de la Tierra, incluidas la hidrósfera y la atmósfera.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Investigación climática
      Ciencias de la tierra
      Geodesia
      Geografía (física)
      Geología
      Geomática
      Tecnología geoespacial
      Meteorología
      Oceanografía
      Sismología

      === Exclusiones
      La geografía social se excluye de este campo detallado y se incluye en el campo detallado 0314 'Sociología y estudios culturales'. La edafología se excluye de este campo detallado y se incluye en el campo detallado 0811 'Producción agrícola y ganadera'.
  '0533':
    nombre: física
    en: |-
      Physics is the study of properties and interactions of matter and energy. It includes the study of astronomy and space science.
      Programmes and qualifications with the following main content are classified here:
      Astronomy
      Astrophysics
      Chemical physics
      Medical physics
      Optics
      Physics
      Space science

      === Exclusions
      Opticians' practice is excluded from this detailed field and included in detailed field 0914 'Medical diagnostic and treatment technology'.
    es: |-
      La física es el estudio de las propiedades y las interacciones de la materia y la energía. Incluye el estudio de la astronomía y las ciencias espaciales.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Astronomía
      Astrofísica
      Física química
      Física médica
      Óptica
      Física
      Ciencias espaciales

      === Exclusiones
      La práctica de la óptica (ópticos) se excluye de este campo detallado y se incluye en el campo detallado 0914 'Tecnología de diagnóstico y tratamiento médico'.
  '0541':
    nombre: matemáticas
    en: |-
      Mathematics is the study of abstract deductive systems. It includes algebra, arithmetic, geometry, real and complex analysis and pure and applied mathematics.
      Programmes and qualifications with the following main content are classified here:
      Algebra
      Geometry
      Mathematics
      Numerical analysis
      Operational research
    es: |-
      Las matemáticas son el estudio de los sistemas deductivos abstractos. Incluyen el álgebra, la aritmética, la geometría, el análisis real y complejo, y las matemáticas puras y aplicadas.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Álgebra
      Geometría
      Matemáticas
      Análisis numérico
      Investigación de operaciones
  '0542':
    nombre: estadística
    en: |-
      Statistics is the study of collecting, describing, arranging and analysing numerical data. The study of probability theory and actuarial science is included.
      Programmes and qualifications with the following main content are classified here:
      Actuarial science
      Probability theory
      Statistics, applied
      Survey design
      Survey sampling

      === Inclusions
      Study of mathematical (theoretical) statistics is included here.

      === Exclusions
      Demography/population studies is excluded from this detailed field and included in detailed field 0314 'Sociology and cultural studies'.
    es: |-
      La estadística es el estudio de la recolección, la descripción, la organización y el análisis de datos numéricos. Se incluye el estudio de la teoría de la probabilidad y las ciencias actuariales.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ciencias actuariales
      Teoría de la probabilidad
      Estadística aplicada
      Diseño de encuestas
      Muestreo de encuestas

      === Inclusiones
      Se incluye aquí el estudio de la estadística matemática (teórica).

      === Exclusiones
      La demografía/estudios de población se excluye de este campo detallado y se incluye en el campo detallado 0314 'Sociología y estudios culturales'.
  '0611':
    nombre: uso de computadores
    en: |-
      Computer use is the study of using computers and computer software and applications for different purposes. These programmes are generally of short duration.
      Programmes and qualifications with the following main content are classified here:
      Computer use
      Use of software for calculating (spread sheets)
      Use of software for data processing
      Use of software for desk top publishing
      Use of software for word processing
      Use of Internet
    es: |-
      El uso de computadores es el estudio del uso de computadoras y de software y aplicaciones informáticas para diferentes fines. Estos programas suelen ser de corta duración.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Uso de computadoras
      Uso de software de cálculo (hojas de cálculo)
      Uso de software para procesamiento de datos
      Uso de software de autoedición
      Uso de software de procesamiento de textos
      Uso de Internet
  '0612':
    nombre: diseño y administración de redes y bases de datos
    en: |-
      Database and network design and administration is the study of the design, maintenance and integration of software applications. Computer media applications are included.
      Programmes and qualifications with the following main content are classified here:
      Computer administration and management
      Computer media applications
      Computer network installation and maintenance
      Database administrator studies
      Information technology administration
      Information technology security
      Network administration
      Network design
      Web design
    es: |-
      El diseño y administración de redes y bases de datos es el estudio del diseño, el mantenimiento y la integración de aplicaciones de software. Se incluyen las aplicaciones de medios informáticos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Administración y gestión informática
      Aplicaciones de medios informáticos
      Instalación y mantenimiento de redes informáticas
      Estudios de administrador de bases de datos
      Administración de tecnologías de la información
      Seguridad de las tecnologías de la información
      Administración de redes
      Diseño de redes
      Diseño web
  '0613':
    nombre: desarrollo y análisis de software y aplicaciones
    en: |-
      Software and applications development and analysis is the study of the design and development of computer systems and computing environments.
      Programmes and qualifications with the following main content are classified here:
      Computer programming
      Computer science
      Computer systems analysis
      Computer systems design
      Informatics
      Operating systems
      Programming languages development
      Software development
      Software programming

      === Exclusions
      Computer engineering (hardware) is excluded from this detailed field and included in detailed field 0714 'Electronics and automation'.
      Programmes and qualifications in using computer applications are excluded from this detailed field and included in detailed field 0611 'Computer use'. Database and network design and administration is excluded from this detailed field and included in detailed field 0612 'Database and network design and administration'.
    es: |-
      El desarrollo y análisis de software y aplicaciones es el estudio del diseño y el desarrollo de sistemas informáticos y entornos de computación.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Programación informática
      Ciencias de la computación
      Análisis de sistemas informáticos
      Diseño de sistemas informáticos
      Informática
      Sistemas operativos
      Desarrollo de lenguajes de programación
      Desarrollo de software
      Programación de software

      === Exclusiones
      La ingeniería informática (hardware) se excluye de este campo detallado y se incluye en el campo detallado 0714 'Electrónica y automatización'.
      Los programas y las titulaciones en el uso de aplicaciones informáticas se excluyen de este campo detallado y se incluyen en el campo detallado 0611 'Uso de computadoras'. El diseño y administración de redes y bases de datos se excluye de este campo detallado y se incluye en el campo detallado 0612 'Diseño y administración de redes y bases de datos'.
  0619:
    nombre: tecnologías de la información y la comunicación (tic) no contempladas en la clasificación
    en: |-
      Information technology studies not fitting in the detailed fields are classified here:
      Artificial intelligence
    es: |-
      Se clasifican aquí los estudios de tecnologías de la información que no encajan en los campos detallados:
      Inteligencia artificial
  '0711':
    nombre: ingeniería y procesos químicos
    en: |-
      Chemical engineering and processes is the study of planning, designing, and developing products and processes where chemical and physical changes occur. It includes designing chemical plants and control systems.
      Programmes and qualifications with the following main content are classified here:
      Chemical engineering
      Chemical process engineering
      Laboratory technology
      Oil/gas/petrochemicals processing
      Plant and machine operation (processing)
      Process technology

      === Inclusions
      Laboratory technology is included here if emphasis is not given to a specific application.

      === Exclusions
      Laboratory technology is excluded from this detailed field if emphasis is given to a specific application (biological, medical, etc.) and is included under the appropriate detailed field (0914 etc.). Biotechnology is excluded from this detailed field and included in detailed field 0512 'Biochemistry'.
      Programmes and qualifications with emphasis on the production of a specific material are excluded from this detailed field (e.g. studies with emphasis on paper processing should be included in detailed field 0722 'Materials (glass, paper, plastic, wood)'.
    es: |-
      La ingeniería y procesos químicos son el estudio de la planificación, el diseño y el desarrollo de productos y procesos en los que se producen cambios químicos y físicos. Incluyen el diseño de plantas químicas y sistemas de control.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ingeniería química
      Ingeniería de procesos químicos
      Tecnología de laboratorio
      Procesamiento de petróleo/gas/petroquímicos
      Operación de plantas y máquinas (procesamiento)
      Tecnología de procesos

      === Inclusiones
      La tecnología de laboratorio se incluye aquí si no se hace hincapié en una aplicación específica.

      === Exclusiones
      La tecnología de laboratorio se excluye de este campo detallado si se hace hincapié en una aplicación específica (biológica, médica, etc.) y se incluye en el campo detallado correspondiente (0914, etc.). La biotecnología se excluye de este campo detallado y se incluye en el campo detallado 0512 'Bioquímica'.
      Los programas y las titulaciones con énfasis en la producción de un material específico se excluyen de este campo detallado (p. ej., los estudios con énfasis en el procesamiento del papel deben incluirse en el campo detallado 0722 'Materiales (vidrio, papel, plástico, madera)'.
  '0712':
    nombre: tecnología de protección del medio ambiente
    en: |-
      Environmental protection technology is the study of processes in order to minimise discharge and waste and avoid pollution. It includes programmes dealing with control of water, air, soil etc.
      Programmes and qualifications with the following main content are classified here:
      Air pollution control
      Ecological technology
      Energy efficiency
      Environmental engineering
      Industrial discharge control
      Noise pollution control
      Recycling
      Water pollution control

      === Exclusions
      Programmes and qualifications dealing with hygienic standards in food, water etc. are excluded from this detailed field and included in detailed field 1021 'Community sanitation'.
      Construction related to waste and water management is excluded from this detailed field and included in detailed field 0732 'Building and civil engineering'.
    es: |-
      La tecnología de protección del medio ambiente es el estudio de los procesos destinados a minimizar las descargas y los residuos y a evitar la contaminación. Incluye programas que abordan el control del agua, el aire, el suelo, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Control de la contaminación del aire
      Tecnología ecológica
      Eficiencia energética
      Ingeniería ambiental
      Control de descargas industriales
      Control de la contaminación acústica
      Reciclaje
      Control de la contaminación del agua

      === Exclusiones
      Los programas y las titulaciones que abordan las normas de higiene en alimentos, agua, etc. se excluyen de este campo detallado y se incluyen en el campo detallado 1021 'Saneamiento comunitario'.
      La construcción relacionada con la gestión de residuos y del agua se excluye de este campo detallado y se incluye en el campo detallado 0732 'Construcción e ingeniería civil'.
  '0713':
    nombre: electricidad y energía
    en: |-
      Electricity and energy is the study of installing, maintaining, repairing and diagnosing faults in electrical wiring and related equipment in domestic, commercial and industrial establishments. Installation and maintenance of overhead and underground electrical power distribution networks is included. Energy is the study of energy generation.
      Programmes and qualifications with the following main content are classified here:
      Air-conditioning trades
      Climate engineering
      Electrical appliances repairing
      Electrical engineering
      Electrical fitting
      Electrical power generation
      Electrical trades
      Energy studies
      Gas distribution
      Heating trades
      Nuclear, hydraulic and thermal energy
      Power line installation and maintenance
      Power production
      Refrigeration
      Solar power
      Wind turbines

      === Inclusions
      The study of installing, diagnosing faults in and repairing heating, air-conditioning and refrigeration equipment is included here.

      === Exclusions
      Study of vehicle electrical systems is excluded from this detailed field and included in detailed field 0716 'Motor vehicles, ships and aircraft'.
    es: |-
      La electricidad y energía son el estudio de la instalación, el mantenimiento, la reparación y el diagnóstico de fallas en el cableado eléctrico y los equipos relacionados en establecimientos domésticos, comerciales e industriales. Se incluyen la instalación y el mantenimiento de redes aéreas y subterráneas de distribución de energía eléctrica. La energía es el estudio de la generación de energía.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Oficios de aire acondicionado
      Ingeniería de climatización
      Reparación de aparatos eléctricos
      Ingeniería eléctrica
      Instalaciones eléctricas
      Generación de energía eléctrica
      Oficios eléctricos
      Estudios de energía
      Distribución de gas
      Oficios de calefacción
      Energía nuclear, hidráulica y térmica
      Instalación y mantenimiento de líneas eléctricas
      Producción de energía
      Refrigeración
      Energía solar
      Turbinas eólicas

      === Inclusiones
      Se incluye aquí el estudio de la instalación, el diagnóstico de fallas y la reparación de equipos de calefacción, aire acondicionado y refrigeración.

      === Exclusiones
      El estudio de los sistemas eléctricos de vehículos se excluye de este campo detallado y se incluye en el campo detallado 0716 'Vehículos, barcos y aeronaves motorizadas'.
  '0714':
    nombre: electrónica y automatización
    en: |-
      Electronics and automation is the study of planning, designing, developing maintaining and monitoring electronic equipment, machinery and systems. It includes designing computers and equipment for communication.
      Programmes and qualifications with the following main content are classified here:
      Broadcasting electronics
      Communication systems
      Communications equipment installation
      Communications equipment maintenance
      Computer engineering
      Computer repairing
      Control engineering
      Data processing technology
      Digital technology
      Electronic engineering
      Electronic equipment servicing
      Network technology
      Robotics
      Telecommunications technology
      Television and radio repairing

      === Exclusions
      Computer science (Software and applications development) is excluded from this detailed field and included under 0613 'Software and applications development and analysis'.
    es: |-
      La electrónica y automatización son el estudio de la planificación, el diseño, el desarrollo, el mantenimiento y el monitoreo de equipos, maquinaria y sistemas electrónicos. Incluyen el diseño de computadoras y equipos de comunicación.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Electrónica de radiodifusión
      Sistemas de comunicación
      Instalación de equipos de comunicaciones
      Mantenimiento de equipos de comunicaciones
      Ingeniería informática
      Reparación de computadoras
      Ingeniería de control
      Tecnología de procesamiento de datos
      Tecnología digital
      Ingeniería electrónica
      Servicio técnico de equipos electrónicos
      Tecnología de redes
      Robótica
      Tecnología de telecomunicaciones
      Reparación de televisores y radios

      === Exclusiones
      Las ciencias de la computación (desarrollo de software y aplicaciones) se excluyen de este campo detallado y se incluyen en 0613 'Desarrollo y análisis de software y aplicaciones'.
  '0715':
    nombre: mecánica y profesiones afines a la metalistería
    en: |-
      Mechanics and metal trades is the study of planning, designing, developing, producing, maintaining and monitoring machines, mechanical plants and systems and metal products. It includes designing and maintaining machines which produce goods and services. The focus of study in this detailed field is machines, mechanical systems and metal products.
      Programmes and qualifications with the following main content are classified here:
      Gunsmithing
      Hydraulics
      Locksmithing and safe repairing
      Mechanical engineering
      Mechanical trades
      Metal casting and patternmaking
      Metal fitting, turning and machining
      Metallurgical engineering
      Precision mechanics
      Sheet metal working
      Steel production
      Tool and die making
      Welding

      === Exclusions
      The study of motor vehicle mechanics and engineering is excluded from this detailed field and included in detailed field 0716 'Motor vehicles, ships and aircraft'.
    es: |-
      La mecánica y profesiones afines a la metalistería son el estudio de la planificación, el diseño, el desarrollo, la producción, el mantenimiento y el monitoreo de máquinas, plantas y sistemas mecánicos y productos metálicos. Incluyen el diseño y el mantenimiento de máquinas que producen bienes y servicios. El foco de estudio en este campo detallado son las máquinas, los sistemas mecánicos y los productos metálicos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Armería
      Hidráulica
      Cerrajería y reparación de cajas fuertes
      Ingeniería mecánica
      Oficios mecánicos
      Fundición de metales y modelismo
      Ajuste, torneado y mecanizado de metales
      Ingeniería metalúrgica
      Mecánica de precisión
      Trabajo en chapa metálica
      Producción de acero
      Fabricación de herramientas y matrices
      Soldadura

      === Exclusiones
      El estudio de la mecánica y la ingeniería de vehículos motorizados se excluye de este campo detallado y se incluye en el campo detallado 0716 'Vehículos, barcos y aeronaves motorizadas'.
  '0716':
    nombre: vehículos, barcos y aeronaves motorizadas
    en: |-
      Motor vehicles, ships and aircraft is the study of designing, developing, producing, maintaining, diagnosing faults in, repairing and servicing motor vehicles, including earth moving equipment and agriculture machines, ships, trains and aircraft. Typical is the combination of studies in both metal structures and motors.
      Programmes and qualifications with the following main content are classified here:
      Aerospace engineering
      Aircraft engineering
      Aircraft maintenance
      Automotive electrical systems
      Automotive engineering
      Avionics
      Coachwork
      Marine engineering
      Motorcycle engineering
      Panel beating
      Shipbuilding
      Train repair and maintenance
      Vehicle building and repairing
      Vehicle varnishing/spraying

      === Inclusions
      Study of vehicle electrical systems is included here.

      === Exclusions
      Study of producing and repairing non-motorised vehicles is excluded from this detailed field and included in 0715 'Mechanics and metal work' (e.g. bicycles) or 0722 'Materials (glass, paper, plastic, wood)' (e.g. non-motor boats).
    es: |-
      Los vehículos, barcos y aeronaves motorizadas son el estudio del diseño, el desarrollo, la producción, el mantenimiento, el diagnóstico de fallas, la reparación y el servicio técnico de vehículos motorizados, incluidos los equipos de movimiento de tierra y las máquinas agrícolas, barcos, trenes y aeronaves. Es característica la combinación de estudios tanto de estructuras metálicas como de motores.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ingeniería aeroespacial
      Ingeniería aeronáutica
      Mantenimiento de aeronaves
      Sistemas eléctricos automotrices
      Ingeniería automotriz
      Aviónica
      Carrocería
      Ingeniería naval
      Ingeniería de motocicletas
      Chapistería
      Construcción naval
      Reparación y mantenimiento de trenes
      Construcción y reparación de vehículos
      Barnizado/pintura de vehículos

      === Inclusiones
      Se incluye aquí el estudio de los sistemas eléctricos de vehículos.

      === Exclusiones
      El estudio de la producción y la reparación de vehículos no motorizados se excluye de este campo detallado y se incluye en 0715 'Mecánica y trabajo del metal' (p. ej., bicicletas) o en 0722 'Materiales (vidrio, papel, plástico, madera)' (p. ej., embarcaciones sin motor).
  0719:
    nombre: ingeniería y profesiones afines no contempladas en la clasificación
    en: |-
      Engineering studies not covered by other detailed fields are classified here:
      Nanotechnology
    es: |-
      Se clasifican aquí los estudios de ingeniería no cubiertos por otros campos detallados:
      Nanotecnología
  '0721':
    nombre: procesamiento de alimentos
    en: |-
      Food processing is the study of processing and packaging of food and beverages, and the equipment and procedures used in the production and distribution of foods.
      Programmes and qualifications with the following main content are classified here:
      Baking
      Beer brewing
      Butchery
      Confectionery
      Dairy foods
      Food and drink processing
      Food preservation
      Food science and technology
      Meat processing
      Pastry cooking
      Tobacco processing
      Wine production

      === Inclusions
      Study of food handling and food hygiene is included here.

      === Exclusions
      Restaurant and catering are excluded from this detailed field and included in detailed field 1013 'Hotel, restaurant and catering'.
      Nutrition science is excluded from this detailed field and included in narrow field 051 'Biological and related sciences'.
      0722 Materials (glass, paper, plastic and wood)
      Materials is the study of the manufacturing of products in glass, paper, plastic, wood or other materials like stone, clay, artificial materials etc. Programmes and qualifications included in this detailed field have more to do with a specific material than general technical knowledge.
      Programmes and qualifications with the following main content are classified here:
      Boat building (non-motor)
      Cabinet making
      Carpentry (furniture)
      Ceramics (industrial)
      Furniture making
      Glass working (industrial)
      Industrial diamond production
      Paper manufacturing and processing
      Plastic manufacturing
      Rubber processing
      Timber technology
      Wood machining and turning
      Woodwork trades

      === Exclusions
      Study of metal work is excluded from this detailed field and included in detailed field 0715 'Mechanics and metal trades'.
      Study of building carpentry and joinery is excluded from this detailed field and included in detailed field 0732 'Building and civil engineering'.
      Study of chemical processing in general is excluded from this detailed field and included in detailed field 0711 'Chemical engineering and processes'.
      Study of printing and bookbinding is excluded from this detailed field and included in detailed field 0211 'Audio-visual techniques and media production'.
      Handicrafts programmes (glass arts and crafts, woodcarving etc) are excluded from this detailed field and included in detailed field 0214 'Handicrafts'.
      0723 Textiles (clothes, footwear and leather)
      Textiles (clothes, footwear and leather) is the study of the manufacture of textiles, textile and leather products, clothing and related items, shoes and other forms of footwear.
      Programmes and qualifications with the following main content are classified here:
      Clothing trades
      Dressmaking
      Footwear making
      Fur making
      Garment production
      Leather processing
      Saddlery
      Shoemaking
      Skins and leather production
      Spinning
      Tailoring
      Textile trades
      Upholstery
      Weaving (industrial)
      Wool science

      === Exclusions
      Handicrafts studies (weaving, embroidery etc.) are excluded from this detailed field and included in detailed field 0214 'Handicrafts'.
    es: |-
      El procesamiento de alimentos es el estudio del procesamiento y el envasado de alimentos y bebidas, y de los equipos y procedimientos utilizados en la producción y la distribución de alimentos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Panadería
      Elaboración de cerveza
      Carnicería
      Confitería
      Productos lácteos
      Procesamiento de alimentos y bebidas
      Conservación de alimentos
      Ciencia y tecnología de los alimentos
      Procesamiento de carne
      Pastelería
      Procesamiento de tabaco
      Producción de vino

      === Inclusiones
      Se incluye aquí el estudio de la manipulación y la higiene de los alimentos.

      === Exclusiones
      Los restaurantes y los servicios de banquetes se excluyen de este campo detallado y se incluyen en el campo detallado 1013 'Hotelería, restaurantes y servicios de banquetes'.
      Las ciencias de la nutrición se excluyen de este campo detallado y se incluyen en el campo específico 051 'Ciencias biológicas y afines'.
      0722 Materiales (vidrio, papel, plástico y madera)
      Los materiales son el estudio de la fabricación de productos de vidrio, papel, plástico, madera u otros materiales como piedra, arcilla, materiales artificiales, etc. Los programas y las titulaciones incluidos en este campo detallado tienen más que ver con un material específico que con conocimientos técnicos generales.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Construcción de embarcaciones (sin motor)
      Ebanistería
      Carpintería (muebles)
      Cerámica (industrial)
      Fabricación de muebles
      Trabajo del vidrio (industrial)
      Producción de diamantes industriales
      Fabricación y procesamiento de papel
      Fabricación de plásticos
      Procesamiento de caucho
      Tecnología de la madera
      Mecanizado y torneado de madera
      Oficios de la madera

      === Exclusiones
      El estudio del trabajo del metal se excluye de este campo detallado y se incluye en el campo detallado 0715 'Mecánica y profesiones afines a la metalistería'.
      El estudio de la carpintería de obra se excluye de este campo detallado y se incluye en el campo detallado 0732 'Construcción e ingeniería civil'.
      El estudio del procesamiento químico en general se excluye de este campo detallado y se incluye en el campo detallado 0711 'Ingeniería y procesos químicos'.
      El estudio de la impresión y la encuadernación se excluye de este campo detallado y se incluye en el campo detallado 0211 'Técnicas audiovisuales y producción para medios de comunicación'.
      Los programas de artesanías (artes y artesanía en vidrio, tallado en madera, etc.) se excluyen de este campo detallado y se incluyen en el campo detallado 0214 'Artesanías'.
      0723 Textiles (confección, calzado y cuero)
      Los textiles (confección, calzado y cuero) son el estudio de la fabricación de textiles, productos textiles y de cuero, prendas de vestir y artículos afines, zapatos y otros tipos de calzado.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Oficios de la confección
      Corte y confección
      Fabricación de calzado
      Peletería
      Producción de prendas de vestir
      Procesamiento de cuero
      Talabartería
      Zapatería
      Producción de pieles y cuero
      Hilado
      Sastrería
      Oficios textiles
      Tapicería
      Tejido (industrial)
      Ciencia de la lana

      === Exclusiones
      Los estudios de artesanías (tejido, bordado, etc.) se excluyen de este campo detallado y se incluyen en el campo detallado 0214 'Artesanías'.
  '0724':
    nombre: minería y extracción
    en: |-
      Mining and extraction is the study of assessing, planning, developing, and directing the extraction of minerals, oil and gas from the earth.
      Programmes and qualifications with the following main content are classified here:
      Coal mining
      Mineral technology
      Mining of minerals
      Oil and gas drilling
      Oil and gas extraction
      Raw material extraction

      === Exclusions
      Study of metallurgical engineering is excluded from this detailed field and included in 0715 'Mechanics and metal trades'
      Study of geology is excluded from this detailed field and included in detailed field 0532 'Earth sciences'.
    es: |-
      La minería y extracción son el estudio de la evaluación, la planificación, el desarrollo y la dirección de la extracción de minerales, petróleo y gas de la tierra.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Minería del carbón
      Tecnología de minerales
      Minería de minerales
      Perforación de petróleo y gas
      Extracción de petróleo y gas
      Extracción de materias primas

      === Exclusiones
      El estudio de la ingeniería metalúrgica se excluye de este campo detallado y se incluye en 0715 'Mecánica y profesiones afines a la metalistería'
      El estudio de la geología se excluye de este campo detallado y se incluye en el campo detallado 0532 'Ciencias de la tierra'.
  '0731':
    nombre: arquitectura y urbanismo
    en: |-
      Architecture is the study of the art, science and techniques of building design. It encompasses both utilitarian ends - such as the soundness of the structure and the functional and economic efficiency of the building - and aesthetic considerations. Town planning is the study of the regulated growth and improvement of towns in both functional and aesthetical points of view.
      Programmes and qualifications with the following main content are classified here:
      Architectural urban design and planning
      Architecture
      Building design
      Cartography/Land surveying
      City planning
      Community development
      Landscape architecture
      Structural architecture
      Surveying
      Town and country planning
      Urban planning

      === Exclusions
      Study of interior design is excluded from this detailed field and included in detailed field 0212 'Fashion, interior and industrial design'. Geomatics is excluded from this detailed field and included in detailed field 0532 'Earth science'.
      The laying out and construction of parks and gardens is excluded from this detailed field and included in detailed field 0812 'Horticulture'.
    es: |-
      La arquitectura es el estudio del arte, la ciencia y las técnicas del diseño de edificios. Abarca tanto fines utilitarios, como la solidez de la estructura y la eficiencia funcional y económica del edificio, como consideraciones estéticas. El urbanismo es el estudio del crecimiento regulado y la mejora de las ciudades, tanto desde el punto de vista funcional como estético.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Diseño y planificación urbana arquitectónica
      Arquitectura
      Diseño de edificios
      Cartografía/agrimensura
      Planificación de ciudades
      Desarrollo comunitario
      Arquitectura paisajista
      Arquitectura estructural
      Topografía
      Ordenamiento urbano y rural
      Planificación urbana

      === Exclusiones
      El estudio del diseño de interiores se excluye de este campo detallado y se incluye en el campo detallado 0212 'Diseño industrial, de modas e interiores'. La geomática se excluye de este campo detallado y se incluye en el campo detallado 0532 'Ciencias de la tierra'.
      El trazado y la construcción de parques y jardines se excluyen de este campo detallado y se incluyen en el campo detallado 0812 'Horticultura'.
  '0732':
    nombre: construcción e ingeniería civil
    en: |-
      Building is the study of the science, technology and techniques of assembling, erecting and maintaining public, commercial, industrial and residential structures and their fittings. Civil engineering is the study of planning, designing, testing and directing the construction of large scale buildings and structures, including systems for transport, water supply, sewage etc.
      Programmes and qualifications with the following main content are classified here:
      Bricklaying
      Bridge construction
      Building construction
      Building engineering
      Building technology
      Carpentry and joinery (building)
      Civil engineering
      Construction equipment
      Constructional metalwork (building)
      Dock and harbour engineering
      Floor and wall tiling
      Floor covering
      House building
      Industrial abseiling (commercial)
      Masonry and tile setting
      Painting and wall covering
      Plastering
      Plumbing and pipefitting
      Road building
      Water engineering and technology
      Water supply and sewerage engineering
      Ventilation

      === Exclusions
      Installation of electricity is excluded from this detailed field and included in detailed field 0713 'Electricity and energy'. Similarly, installing and repairing of heating, air-conditioning and refrigeration equipment is excluded from this detailed field and included in detailed field 0713 'Electricity and energy'.
    es: |-
      La construcción es el estudio de la ciencia, la tecnología y las técnicas de montaje, levantamiento y mantenimiento de estructuras públicas, comerciales, industriales y residenciales y de sus instalaciones. La ingeniería civil es el estudio de la planificación, el diseño, las pruebas y la dirección de la construcción de edificios y estructuras a gran escala, incluidos los sistemas de transporte, abastecimiento de agua, alcantarillado, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Albañilería
      Construcción de puentes
      Construcción de edificios
      Ingeniería de la edificación
      Tecnología de la construcción
      Carpintería de obra (construcción)
      Ingeniería civil
      Equipos de construcción
      Estructuras metálicas (construcción)
      Ingeniería portuaria y de muelles
      Revestimiento de pisos y paredes con baldosas
      Revestimiento de pisos
      Construcción de viviendas
      Trabajos verticales industriales (comerciales)
      Mampostería y colocación de baldosas
      Pintura y revestimiento de paredes
      Enlucido
      Plomería e instalación de tuberías
      Construcción de caminos
      Ingeniería y tecnología hidráulica
      Ingeniería de abastecimiento de agua y alcantarillado
      Ventilación

      === Exclusiones
      La instalación eléctrica se excluye de este campo detallado y se incluye en el campo detallado 0713 'Electricidad y energía'. De igual modo, la instalación y la reparación de equipos de calefacción, aire acondicionado y refrigeración se excluyen de este campo detallado y se incluyen en el campo detallado 0713 'Electricidad y energía'.
  0811:
    nombre: producción agrícola y ganadera
    en: |-
      Crop and livestock production is the study of growing, maintaining and harvesting crops and pastures, and grazing and managing animals. It includes the study of managing and maintaining farms and producing unprocessed plant and animal products.
      Programmes and qualifications with the following main content are classified here:
      Agricultural sciences
      Agronomy and crop science
      Animal husbandry
      Crop growing
      Dog breeding
      Farm and ranch management
      Farming
      Fruit growing
      Grain growing
      Horse breeding
      Pig farming
      Poultry husbandry
      Rice farming
      Rye and wheat growing
      Sheep farming
      Soil science
      Sugar cane growing
      Vegetable planting
      Wine growing

      === Inclusions
      Study of soil fertility and irrigation techniques are included here.
      Study of growing intensively managed crops such as fruit and vegetables is included here.

      === Exclusions
      Study of wine production is excluded from this detailed field and is included in detailed field 0721 'Food processing'.
      Jockeying is excluded from this detailed field and is included in detailed field 1014 'Sports'
    es: |-
      La producción agrícola y ganadera es el estudio del cultivo, el mantenimiento y la cosecha de cultivos y pasturas, y del pastoreo y el manejo de animales. Incluye el estudio de la gestión y el mantenimiento de explotaciones agropecuarias y de la producción de productos vegetales y animales sin procesar.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ciencias agrícolas
      Agronomía y ciencia de los cultivos
      Zootecnia
      Cultivo de plantas
      Cría de perros
      Gestión de explotaciones agropecuarias y estancias
      Agricultura
      Fruticultura
      Cultivo de granos
      Cría de caballos
      Cría de cerdos
      Avicultura
      Cultivo de arroz
      Cultivo de centeno y trigo
      Cría de ovinos
      Edafología
      Cultivo de caña de azúcar
      Plantación de hortalizas
      Viticultura

      === Inclusiones
      Se incluye aquí el estudio de la fertilidad del suelo y de las técnicas de riego.
      Se incluye aquí el estudio del cultivo de plantas de manejo intensivo, como frutas y hortalizas.

      === Exclusiones
      El estudio de la producción de vino se excluye de este campo detallado y se incluye en el campo detallado 0721 'Procesamiento de alimentos'.
      La equitación de carreras (jockey) se excluye de este campo detallado y se incluye en el campo detallado 1014 'Deportes'
  0812:
    nombre: horticultura
    en: |-
      Horticulture is the study of horticultural technology and management, floriculture, greenhouse methods, nursery management, landscape gardening etc.
      Programmes and qualifications with the following main content are classified here:
      Floriculture
      Gardening
      Green keeping
      Horticultural techniques
      Nursery management
      Turf cultivation

      === Inclusions
      The laying out and construction of urban and domestic parks and gardens is included here.
      Gardening programmes combining floriculture and growing vegetables are included here.

      === Exclusions
      Study of growing edible crops (such as wheat, rice, fruit, vegetables etc,) is excluded from this detailed field and included in detailed field 0811 'Crop and livestock production'.
      Study of soil science, soil fertility and irrigation techniques is excluded from this detailed field and included in detailed field 0811 'Crop and livestock production'.
      Study of National park management is excluded from this detailed field and included in detailed field 0522 'Natural environments and wildlife'.
      Study of Landscape architecture is excluded from this detailed field and included in detailed field 0731 'Architecture and town planning'.
    es: |-
      La horticultura es el estudio de la tecnología y la gestión hortícolas, la floricultura, los métodos de invernadero, la gestión de viveros, la jardinería paisajística, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Floricultura
      Jardinería
      Mantenimiento de céspedes deportivos
      Técnicas hortícolas
      Gestión de viveros
      Cultivo de césped

      === Inclusiones
      Se incluyen aquí el trazado y la construcción de parques y jardines urbanos y domésticos.
      Se incluyen aquí los programas de jardinería que combinan la floricultura y el cultivo de hortalizas.

      === Exclusiones
      El estudio del cultivo de plantas comestibles (como trigo, arroz, frutas, hortalizas, etc.) se excluye de este campo detallado y se incluye en el campo detallado 0811 'Producción agrícola y ganadera'.
      El estudio de la edafología, la fertilidad del suelo y las técnicas de riego se excluye de este campo detallado y se incluye en el campo detallado 0811 'Producción agrícola y ganadera'.
      El estudio de la gestión de parques nacionales se excluye de este campo detallado y se incluye en el campo detallado 0522 'Medio ambientes naturales y vida silvestre'.
      El estudio de la arquitectura paisajista se excluye de este campo detallado y se incluye en el campo detallado 0731 'Arquitectura y urbanismo'.
  0821:
    nombre: silvicultura
    en: |-
      Forestry is the study of establishing, cultivating, harvesting and managing forests. It includes the study of hunting and trapping.
      Programmes and qualifications with the following main content are classified here:
      Charcoal burning
      Forest keeping
      Forest product techniques
      Forestry
      Hunting and trapping
      Logging
      Tree felling

      === Exclusions
      Study of National park management is excluded from this detailed field and included in detailed field 0522 'Natural environments and wildlife'.
      Timber technology (sawmill production etc) is excluded from this detailed field and included in detailed field 0722 'Materials (glass, paper, plastic and wood)'.
    es: |-
      La silvicultura es el estudio del establecimiento, el cultivo, la cosecha y la gestión de los bosques. Incluye el estudio de la caza y el trampeo.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Producción de carbón vegetal
      Guardería forestal
      Técnicas de productos forestales
      Silvicultura
      Caza y trampeo
      Explotación maderera
      Tala de árboles

      === Exclusiones
      El estudio de la gestión de parques nacionales se excluye de este campo detallado y se incluye en el campo detallado 0522 'Medio ambientes naturales y vida silvestre'.
      La tecnología de la madera (producción de aserraderos, etc.) se excluye de este campo detallado y se incluye en el campo detallado 0722 'Materiales (vidrio, papel, plástico y madera)'.
  0831:
    nombre: pesca
    en: |-
      Fisheries is the study of breeding, rearing and harvesting fish and other seafood.
      Programmes and qualifications with the following main content are classified here:
      Aquaculture
      Fish breeding
      Fish farms
      Fishery science and technology
      Pearl cultivating
      Seafood farming
      Shellfish breeding

      === Inclusions
      Programmes for operating fishing boats are included here.

      === Exclusions
      Study of industrial processing of fish is excluded from this detailed field and included in detailed field 0721 'Food processing'.
    es: |-
      La pesca es el estudio de la cría, el cultivo y la captura de peces y otros productos del mar.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Acuicultura
      Cría de peces
      Piscifactorías
      Ciencia y tecnología pesqueras
      Cultivo de perlas
      Cultivo de mariscos
      Cría de moluscos y crustáceos

      === Inclusiones
      Se incluyen aquí los programas de operación de embarcaciones pesqueras.

      === Exclusiones
      El estudio del procesamiento industrial del pescado se excluye de este campo detallado y se incluye en el campo detallado 0721 'Procesamiento de alimentos'.
  0841:
    nombre: veterinaria
    en: |-
      Veterinary is the study of preventing, diagnosing and treating diseases and injuries in animals, and their general care. The study of caring for sick, injured and infirm animals undergoing treatment in veterinary clinics is included. It also includes the study of providing assistance to veterinary scientists.
      Programmes and qualifications with the following main content are classified here:
      Animal health care
      Animal reproduction (science)
      Artificial insemination (of animals)
      Veterinary assisting
      Veterinary medicine
      Veterinary nursing
      Veterinary science

      === Inclusions
      The science of animal reproduction is included here.

      === Exclusions
      Study of animal breeding is excluded from this detailed field and included in detailed field 0811 'Crop and livestock production'.
    es: |-
      La veterinaria es el estudio de la prevención, el diagnóstico y el tratamiento de enfermedades y lesiones en los animales, y de su cuidado general. Se incluye el estudio del cuidado de animales enfermos, heridos y débiles que reciben tratamiento en clínicas veterinarias. También incluye el estudio de la prestación de asistencia a los profesionales veterinarios.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Cuidado de la salud animal
      Reproducción animal (ciencia)
      Inseminación artificial (de animales)
      Asistencia veterinaria
      Medicina veterinaria
      Enfermería veterinaria
      Ciencias veterinarias

      === Inclusiones
      Se incluye aquí la ciencia de la reproducción animal.

      === Exclusiones
      El estudio de la cría de animales se excluye de este campo detallado y se incluye en el campo detallado 0811 'Producción agrícola y ganadera'.
  0911:
    nombre: odontología
    en: |-
      Dental studies are the study of diagnosing, treating and preventing diseases and abnormalities of the teeth and gums. It includes the study of designing, making and repairing dental prostheses and orthodontic appliances. It also includes the study of providing assistance to dentists.
      Programmes and qualifications with the following main content are classified here:
      Dental assisting
      Dental hygiene
      Dental laboratory technology
      Dental nursing
      Dental science
      Dental surgery
      Dental technology
      Odontology
      Oral surgery
      Orthodontics

      === Inclusions
      Study of public dental health is included here.
    es: |-
      La odontología es el estudio del diagnóstico, el tratamiento y la prevención de enfermedades y anomalías de los dientes y las encías. Incluye el estudio del diseño, la fabricación y la reparación de prótesis dentales y aparatos de ortodoncia. También incluye el estudio de la prestación de asistencia a los odontólogos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Asistencia dental
      Higiene dental
      Tecnología de laboratorio dental
      Enfermería dental
      Ciencias odontológicas
      Cirugía dental
      Tecnología dental
      Odontología
      Cirugía bucal
      Ortodoncia

      === Inclusiones
      Se incluye aquí el estudio de la salud dental pública.
  0912:
    nombre: medicina
    en: |-
      Medicine is the study of the principles and procedures used in preventing, diagnosing, caring for and treating illness, disease and injury in humans and the maintenance of general health. Principally, this detailed field consists of training of physicians/doctors.
      Programmes and qualifications with the following main content are classified here:
      Anaesthetics
      Forensic medicine
      Forensic pathology
      General medicine
      Gerontology
      Gynaecology
      Medical science
      Medical training
      Medicine
      Paediatrics
      Psychiatry
      Surgery
      Training of physicians/doctors
    es: |-
      La medicina es el estudio de los principios y procedimientos utilizados para prevenir, diagnosticar, atender y tratar las enfermedades, dolencias y lesiones en los seres humanos, y para mantener la salud general. Principalmente, este campo detallado consiste en la formación de médicos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Anestesiología
      Medicina forense
      Patología forense
      Medicina general
      Gerontología
      Ginecología
      Ciencias médicas
      Formación médica
      Medicina
      Pediatría
      Psiquiatría
      Cirugía
      Formación de médicos
  0913:
    nombre: enfermería y partería
    en: |-
      Nursing is the study of providing health care for the sick, disabled or infirm and assisting physicians and other medical and health professionals diagnose and treat patients. The focus of qualifications in nursing is maintaining and caring for the health of patients during illness and rehabilitation. It includes health care of old people and health care of the disabled. Midwifery is the study of providing care to childbearing women during pregnancy, labour and birth and during the postpartum period. It also includes caring for the new born and assisting the mother with breast feeding.
      Programmes and qualifications with the following main content are classified here:
      Assistant nursing
      Basic nursing
      General nursing
      Health care of old people
      Heath care of the disabled
      Health care programmes
      Infant hygiene (nursing)
      Midwifery
      Nursing aide/Orderly
      Psychiatric nursing
      Specialised nursing

      === Inclusions
      Care programmes comprising both health care and social care e.g. for old people, are included here.

      === Exclusions
      Veterinary nursing is excluded from this detailed field and is included in detailed field 0841 'Veterinary'.
      Dental nursing is excluded from this detailed field and is included in detailed field 0911 'Dental studies'.
      Non-medical care of children (not health care) is excluded from this detailed field and included in detailed field 0922 'Child care and youth services'.
      Non-medical care of the elderly (not health care) is excluded from this detailed field and included in detailed field 0921 'Care of the elderly and disabled adults'.
    es: |-
      La enfermería es el estudio de la prestación de atención sanitaria a personas enfermas, discapacitadas o débiles, y de la asistencia a médicos y otros profesionales de la medicina y la salud en el diagnóstico y tratamiento de pacientes. Las titulaciones en enfermería se centran en mantener y cuidar la salud de los pacientes durante la enfermedad y la rehabilitación. Incluye la atención sanitaria de adultos mayores y de personas con discapacidad. La partería es el estudio de la atención a las mujeres durante el embarazo, el trabajo de parto, el parto y el período posparto. También incluye el cuidado del recién nacido y la asistencia a la madre en la lactancia.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Asistencia de enfermería
      Enfermería básica
      Enfermería general
      Atención sanitaria de adultos mayores
      Atención sanitaria de personas con discapacidad
      Programas de atención sanitaria
      Higiene infantil (enfermería)
      Partería
      Auxiliar de enfermería/camillero
      Enfermería psiquiátrica
      Enfermería especializada

      === Inclusiones
      Se incluyen aquí los programas de atención que comprenden tanto atención sanitaria como atención social, por ejemplo, para adultos mayores.

      === Exclusiones
      La enfermería veterinaria se excluye de este campo detallado y se incluye en el campo detallado 0841 'Veterinaria'.
      La enfermería dental se excluye de este campo detallado y se incluye en el campo detallado 0911 'Odontología'.
      El cuidado no médico de niños (no sanitario) se excluye de este campo detallado y se incluye en el campo detallado 0922 'Asistencia a la infancia y servicios para jóvenes'.
      El cuidado no médico de adultos mayores (no sanitario) se excluye de este campo detallado y se incluye en el campo detallado 0921 'Asistencia a adultos mayores y discapacitados'.
  0914:
    nombre: tecnología de diagnóstico y tratamiento médico
    en: |-
      Medical diagnostic and treatment technology is the study of a wide range of technologies used for diagnosing and treating diseases and handicaps.
      Programmes and qualifications with the following main content are classified here:
      Ambulance technology
      Hearing aid technology
      Medical laboratory technology
      Optical technology
      Prosthetic technology
      Radiology technology
      Radiotherapy
      X-ray technology (medical)

      === Exclusions
      Study of laboratory technology is excluded from this detailed field if emphasis is not given to medical laboratory technology. General laboratory technology is included in detailed field 0711 'Chemical engineering and processes'. Laboratory technology where emphasis is given to other specific applications (biology, chemistry, physics etc) is included in the appropriate detailed field (0511, 0531, 0533 etc.).
      Study of dental technology is excluded from this detailed field and included in detailed field 0911 'Dental studies'.
    es: |-
      La tecnología de diagnóstico y tratamiento médico es el estudio de una amplia gama de tecnologías utilizadas para diagnosticar y tratar enfermedades y discapacidades.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Tecnología de ambulancias
      Tecnología de audífonos
      Tecnología de laboratorio médico
      Tecnología óptica
      Tecnología de prótesis
      Tecnología radiológica
      Radioterapia
      Tecnología de rayos X (médica)

      === Exclusiones
      El estudio de la tecnología de laboratorio se excluye de este campo detallado si no se hace hincapié en la tecnología de laboratorio médico. La tecnología de laboratorio general se incluye en el campo detallado 0711 'Ingeniería química y de procesos'. La tecnología de laboratorio con énfasis en otras aplicaciones específicas (biología, química, física, etc.) se incluye en el campo detallado correspondiente (0511, 0531, 0533, etc.).
      El estudio de la tecnología dental se excluye de este campo detallado y se incluye en el campo detallado 0911 'Odontología'.
  0915:
    nombre: terapia y rehabilitación
    en: |-
      Therapy and rehabilitation is the study of restoring normal physical conditions to those incapacitated by temporary or permanent disability.
      Programmes and qualifications with the following main content are classified here:
      Dietician programmes
      Medical massage
      Nutrition/Dietetics
      Occupational therapy
      Physiotherapy
      Rehabilitation
      Speech therapy

      === Exclusions
      Study of psychotherapy is excluded from this detailed field and included in detailed field 0313 'Psychology'.
      Study of nutrition science is excluded from this detailed field and included in narrow field 051 'Biological and related sciences'.
    es: |-
      La terapia y rehabilitación es el estudio del restablecimiento de las condiciones físicas normales de las personas incapacitadas por una discapacidad temporal o permanente.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Programas de dietista
      Masaje médico
      Nutrición/dietética
      Terapia ocupacional
      Fisioterapia
      Rehabilitación
      Fonoaudiología

      === Exclusiones
      El estudio de la psicoterapia se excluye de este campo detallado y se incluye en el campo detallado 0313 'Psicología'.
      El estudio de la ciencia de la nutrición se excluye de este campo detallado y se incluye en el campo específico 051 'Ciencias biológicas y afines'.
  0916:
    nombre: farmacia
    en: |-
      Pharmacy is the study of drugs and their effects on humans. It includes their preparation, dispensing and administration.
      Programmes and qualifications with the following main content are classified here:
      Dispensing pharmacy
      Pharmacy

      === Exclusions
      Study of pharmacology is excluded from this detailed field and included in detailed field 0511 'Biology'.
    es: |-
      La farmacia es el estudio de los medicamentos y sus efectos en los seres humanos. Incluye su preparación, dispensación y administración.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Dispensación farmacéutica
      Farmacia

      === Exclusiones
      El estudio de la farmacología se excluye de este campo detallado y se incluye en el campo detallado 0511 'Biología'.
  0917:
    nombre: medicina y terapia tradicional y complementaria
    en: |-
      Traditional and complementary medicine is the study of alternative medicine.
      Programmes and qualifications with the following main content are classified here:
      Acupuncture and oriental medicine
      Aromatherapy
      Ayurvedic medicine
      Herbalism
      Herbology
      Holistic medicine
      Homeopathic medicine
      Traditional medicine, for example Chinese
    es: |-
      La medicina tradicional y complementaria es el estudio de la medicina alternativa.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Acupuntura y medicina oriental
      Aromaterapia
      Medicina ayurvédica
      Herbolaria
      Herbología
      Medicina holística
      Medicina homeopática
      Medicina tradicional, por ejemplo, china
  0921:
    nombre: asistencia a adultos mayores y discapacitados
    en: |-
      Care of the elderly and of disabled adults is the study of non-medical care of the elderly and disabled.
      Programmes and qualifications with the following main content are classified here:
      Care of the elderly
      Non-medical care of disabled adults
      Personal care of adults

      === Exclusions
      Study of health care of the elderly and disabled is excluded from this detailed field and included in detailed field 0913 'Nursing and midwifery'.
    es: |-
      La asistencia a adultos mayores y a adultos con discapacidad es el estudio del cuidado no médico de adultos mayores y personas con discapacidad.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Cuidado de adultos mayores
      Cuidado no médico de adultos con discapacidad
      Cuidado personal de adultos

      === Exclusiones
      El estudio de la atención sanitaria de adultos mayores y personas con discapacidad se excluye de este campo detallado y se incluye en el campo detallado 0913 'Enfermería y partería'.
  0922:
    nombre: asistencia a la infancia y servicios para jóvenes
    en: |-
      Child care and youth services are the study of the development and non-medical care of children and youths. It includes the study of recreation and leisure activities as a social service for school children and young adults.
      Programmes and qualifications with the following main content are classified here:
      Child care
      Child recreation programmes
      Day care
      Non-medical care of disabled children
      Youth services
      Youth worker programmes

      === Exclusions
      Study of early childhood education in pre-schools is excluded from this detailed field and included in detailed field 0112 'Training for pre-school teachers'.
      Study of health care of children is excluded from this detailed field and included in detailed field 0913 'Nursing and midwifery'.
    es: |-
      La asistencia a la infancia y servicios para jóvenes es el estudio del desarrollo y el cuidado no médico de niños y jóvenes. Incluye el estudio de actividades recreativas y de ocio como servicio social para escolares y adultos jóvenes.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Cuidado infantil
      Programas recreativos infantiles
      Guardería
      Cuidado no médico de niños con discapacidad
      Servicios para jóvenes
      Programas de trabajo con jóvenes

      === Exclusiones
      El estudio de la educación de la primera infancia en centros preescolares se excluye de este campo detallado y se incluye en el campo detallado 0112 'Formación de docentes para la educación preescolar'.
      El estudio de la atención sanitaria de niños se excluye de este campo detallado y se incluye en el campo detallado 0913 'Enfermería y partería'.
  0923:
    nombre: trabajo social y orientación
    en: |-
      Social work and counselling is the study of the welfare needs of communities, specific groups and individuals and the appropriate ways of meeting these needs. The focus is on social welfare with emphasis on social policy and practice.
      Programmes and qualifications with the following main content are classified here:
      Alcohol and drug abuse counselling
      Alcohol, tobacco, drugs (knowledge about)
      Crisis support
      Family and marriage counselling
      Mobbing and maltreatment (knowledge about)
      Parole officer training
      Probation officer training
      Social policy
      Social practice
      Social theory (applied)
      Social work (welfare)
      Vocational counselling
      Vocational guidance

      === Exclusions
      Study of sociology and social science is excluded from this detailed field and included in detailed field 0314 'Sociology and cultural studies'.
      Studies combining health care and social care (e.g. for old people) are excluded from this detailed field and included in detailed field 0913 'Nursing and midwifery'.
    es: |-
      El trabajo social y orientación es el estudio de las necesidades de bienestar de las comunidades, de grupos específicos y de las personas, y de las formas adecuadas de satisfacer esas necesidades. Se centra en el bienestar social, con énfasis en la política y la práctica sociales.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Orientación sobre abuso de alcohol y drogas
      Alcohol, tabaco, drogas (conocimientos sobre)
      Apoyo en situaciones de crisis
      Orientación familiar y matrimonial
      Acoso laboral y maltrato (conocimientos sobre)
      Formación de funcionarios de libertad condicional
      Formación de funcionarios de libertad vigilada
      Política social
      Práctica social
      Teoría social (aplicada)
      Trabajo social (bienestar)
      Orientación vocacional
      Orientación profesional

      === Exclusiones
      El estudio de la sociología y las ciencias sociales se excluye de este campo detallado y se incluye en el campo detallado 0314 'Sociología y estudios culturales'.
      Los estudios que combinan atención sanitaria y atención social (por ejemplo, para adultos mayores) se excluyen de este campo detallado y se incluyen en el campo detallado 0913 'Enfermería y partería'.
  '1011':
    nombre: servicios domésticos
    en: |-
      Domestic services are the study of various domestic services, such as housekeeping, cleaning, laundering, sewing etc.
      Programmes and qualifications with the following main content are classified here:
      Caretaking, housekeeping and home service workers
      Chimney sweeping
      Cleaning
      Cooking (home)
      Domestic science
      Dry-cleaning
      Funeral services and mortuary science
      Home economics
      Laundry
      Needlework (home)
      Sewing (home)
      Window cleaning

      === Inclusions
      Cleaning is included here even if directed towards cleaning schools, hospitals, factories etc.

      === Exclusions
      Study of building maintenance is excluded from this detailed field and included in detailed field 0732 'Building and civil engineering'.
    es: |-
      Los servicios domésticos son el estudio de diversos servicios domésticos, como el cuidado del hogar, la limpieza, el lavado de ropa, la costura, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Trabajadores de conserjería, cuidado del hogar y servicio doméstico
      Deshollinado
      Limpieza
      Cocina (doméstica)
      Economía doméstica (ciencia)
      Limpieza en seco
      Servicios funerarios y tanatología
      Economía del hogar
      Lavandería
      Labores de aguja (domésticas)
      Costura (doméstica)
      Limpieza de ventanas

      === Inclusiones
      La limpieza se incluye aquí aunque esté orientada a la limpieza de escuelas, hospitales, fábricas, etc.

      === Exclusiones
      El estudio del mantenimiento de edificios se excluye de este campo detallado y se incluye en el campo detallado 0732 'Construcción e ingeniería civil'.
  '1012':
    nombre: peluquería y tratamientos de belleza
    en: |-
      Hair and beauty services are the study of caring for the hair and the body for beautification.
      Programmes and qualifications with the following main content are classified here:
      Barbering
      Beauty therapy
      Cosmetology (make up)
      Fitness and weight control
      Hairdressing
      Manicure
      Pedicure
    es: |-
      La peluquería y tratamientos de belleza es el estudio del cuidado del cabello y del cuerpo con fines estéticos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Barbería
      Tratamientos de belleza
      Cosmetología (maquillaje)
      Acondicionamiento físico y control de peso
      Peluquería
      Manicura
      Pedicura
  '1013':
    nombre: hotelería, restaurantes y servicios de banquetes
    en: |-
      Hotel, restaurants and catering is the study of providing food, beverages, accommodation and related services at hotels, restaurants etc.
      Programmes and qualifications with the following main content are classified here:
      Catering
      Cooking (restaurant and hotel-type)
      Fast food preparation
      Food serving
      Hospitality services
      Hotel and restaurant studies
      Hotel receptionist training
      Hotel services
      Waiting and bar service

      === Exclusions
      Study of food processing (industrial) is excluded from this detailed field and included in detailed field 0721 'Food processing'.
      Receptionist training (general) is excluded from this detailed field and included in detailed field 0415 'Secretarial and office work'.
    es: |-
      La hotelería, restaurantes y servicios de banquetes es el estudio de la prestación de servicios de comida, bebidas, alojamiento y servicios conexos en hoteles, restaurantes, etc.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Servicios de banquetes (catering)
      Cocina (de restaurante y hotel)
      Preparación de comida rápida
      Servicio de comidas
      Servicios de hospitalidad
      Estudios de hotelería y restaurantes
      Formación de recepcionistas de hotel
      Servicios hoteleros
      Servicio de mesa y bar

      === Exclusiones
      El estudio del procesamiento de alimentos (industrial) se excluye de este campo detallado y se incluye en el campo detallado 0721 'Procesamiento de alimentos'.
      La formación de recepcionistas (general) se excluye de este campo detallado y se incluye en el campo detallado 0415 'Secretariado y trabajo de oficina'.
  '1014':
    nombre: deportes
    en: |-
      Sports is the study of techniques and skills in a chosen sport.
      Programmes and qualifications with the following main content are classified here:
      Sport trainer studies
      Techniques and skills in a chosen sport
      Training of umpires/referees and other sports officials

      === Inclusions
      Jockeying is included here. Chess playing is included here.

      === Exclusions
      Training of school teachers in physical education (sports teachers) is excluded from this detailed field and included in detailed field 0114 'Teacher training with subject specialisation'.
      Fitness services are excluded from this detailed field and included in detailed field 1012 'Hair and beauty services'.
    es: |-
      Los deportes son el estudio de las técnicas y habilidades en un deporte determinado.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Estudios de entrenador deportivo
      Técnicas y habilidades en un deporte determinado
      Formación de árbitros y otros oficiales deportivos

      === Inclusiones
      Se incluye aquí la monta de caballos de carrera (jockey). Se incluye aquí la práctica del ajedrez.

      === Exclusiones
      La formación de docentes escolares de educación física (profesores de deporte) se excluye de este campo detallado y se incluye en el campo detallado 0114 'Formación de docentes con especialización en asignaturas'.
      Los servicios de acondicionamiento físico se excluyen de este campo detallado y se incluyen en el campo detallado 1012 'Peluquería y tratamientos de belleza'.
  '1015':
    nombre: viajes, turismo y actividades recreativas
    en: |-
      Travel and tourism is the study of marketing and advertising tourist destinations and events. It includes the study of ticketing and reservation practices. Leisure is the study of recreational and leisure activities for individuals and groups.
      Programmes and qualifications with the following main content are classified here:
      Abseiling (rope climbing)
      Adventure based activities
      Ground crew training (airport)
      Guiding, tour leading
      Recreation and leisure
      Tourist trades programmes
      Travel agency services
      Travel and tourism
      Travel services

      === Inclusions
      Basic training in how to treat tourists is included here.

      === Exclusions
      Study of recreation and leisure activities for school children is excluded from this detailed field and included in detailed field 0922 'Child care and youth services'.
    es: |-
      Viajes y turismo es el estudio de la comercialización y la publicidad de destinos y eventos turísticos. Incluye el estudio de las prácticas de emisión de boletos y reservas. Las actividades recreativas son el estudio de las actividades de recreación y ocio para personas y grupos.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Rapel (descenso con cuerda)
      Actividades de aventura
      Formación de personal de tierra (aeropuerto)
      Guía y conducción de viajes
      Recreación y ocio
      Programas de oficios turísticos
      Servicios de agencias de viajes
      Viajes y turismo
      Servicios de viajes

      === Inclusiones
      Se incluye aquí la formación básica sobre la atención a turistas.

      === Exclusiones
      El estudio de las actividades recreativas y de ocio para escolares se excluye de este campo detallado y se incluye en el campo detallado 0922 'Asistencia a la infancia y servicios para jóvenes'.
  '1021':
    nombre: saneamiento de la comunidad
    en: |-
      Community sanitation is the study of community services dealing with items that affect public health such as hygienic standards in food, water supply, disposal of sewage and garbage and street cleaning.
      Programmes and qualifications with the following main content are classified here:
      Hygiene, community
      Hygienic standards
      Refuse collection
      Refuse/sewage disposal
      Street cleaning
      Water supply (service)
      Waste management
    es: |-
      El saneamiento de la comunidad es el estudio de los servicios comunitarios relacionados con aspectos que afectan la salud pública, como las normas de higiene de los alimentos, el abastecimiento de agua, la eliminación de aguas residuales y basura, y la limpieza de calles.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Higiene comunitaria
      Normas de higiene
      Recolección de residuos
      Eliminación de residuos/aguas residuales
      Limpieza de calles
      Abastecimiento de agua (servicio)
      Gestión de residuos
  '1022':
    nombre: salud y protección laboral
    en: |-
      Occupational health and safety is the study of recognising, evaluating and controlling environmental factors associated with the workplace.
      Programmes and qualifications with the following main content are classified here:
      Ergonomics (occupational health and safety)
      Health and safety in the workplace
      Industrial welfare
      Labour protection
      Labour security
      Labour welfare (safety)
      Occupational health and industrial hygiene
      Occupational safety
      Stress management
      Work environment

      === Exclusions
      Study of vocational rehabilitation and occupational therapy is excluded from this detailed field and included in detailed field 0915 'Therapy and rehabilitation'.
      Study of labour law is excluded from this detailed field and included in 0421 'Law'.
      Study of ergonomics is excluded from this detailed field if emphasis is given to technical aspects and is included in the appropriate detailed field under 071 'Engineering and engineering trades'.
    es: |-
      La salud y protección laboral es el estudio del reconocimiento, la evaluación y el control de los factores ambientales asociados al lugar de trabajo.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Ergonomía (salud y seguridad en el trabajo)
      Salud y seguridad en el lugar de trabajo
      Bienestar industrial
      Protección laboral
      Seguridad laboral
      Bienestar laboral (seguridad)
      Salud ocupacional e higiene industrial
      Seguridad ocupacional
      Manejo del estrés
      Entorno de trabajo

      === Exclusiones
      El estudio de la rehabilitación profesional y la terapia ocupacional se excluye de este campo detallado y se incluye en el campo detallado 0915 'Terapia y rehabilitación'.
      El estudio del derecho laboral se excluye de este campo detallado y se incluye en 0421 'Derecho'.
      El estudio de la ergonomía se excluye de este campo detallado si se hace hincapié en los aspectos técnicos, y se incluye en el campo detallado correspondiente dentro de 071 'Ingeniería y profesiones afines'.
  '1031':
    nombre: educación militar y de defensa
    en: |-
      Military and defence is the study of services to the community connected with war and defence, designed to provide training in the principles and practice of military science.
      Programmes and qualifications with the following main content are classified here:
      Air force training
      Army training
      Defence studies
      Military science
      Navy training
      War theory

      === Exclusions
      Military personnel participating in non-military programmes should be classified according to the subject content of the training programme.
    es: |-
      La educación militar y de defensa es el estudio de los servicios a la comunidad relacionados con la guerra y la defensa, destinados a proporcionar formación en los principios y la práctica de la ciencia militar.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Formación de la fuerza aérea
      Formación del ejército
      Estudios de defensa
      Ciencia militar
      Formación de la armada
      Teoría de la guerra

      === Exclusiones
      El personal militar que participa en programas no militares debe clasificarse según el contenido temático del programa de formación.
  '1032':
    nombre: protección de las personas y de la propiedad
    en: |-
      Protection of persons and property is the study of services to the community concerning protection of property and persons. It comprises training in police work, public security, fire protection and fire-fighting.
      Programmes and qualifications with the following main content are classified here:
      Civil security
      Customs programmes
      Fire-protection (fire-fighting)
      Fire technology
      Life guarding
      Police work
      Policing studies
      Prison work
      Public security
      Security and loss prevention services
      Security guarding

      === Exclusions
      Study of law is excluded from this detailed field and included in 0421 'Law'.
      Study of criminology is excluded from this detailed field and included in detailed field 0314 'Sociology and cultural studies'.
    es: |-
      La protección de las personas y de la propiedad es el estudio de los servicios a la comunidad relacionados con la protección de la propiedad y de las personas. Comprende la formación en trabajo policial, seguridad pública, protección contra incendios y extinción de incendios.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Seguridad civil
      Programas de aduanas
      Protección contra incendios (extinción de incendios)
      Tecnología contra incendios
      Salvamento acuático
      Trabajo policial
      Estudios policiales
      Trabajo penitenciario
      Seguridad pública
      Servicios de seguridad y prevención de pérdidas
      Vigilancia de seguridad

      === Exclusiones
      El estudio del derecho se excluye de este campo detallado y se incluye en 0421 'Derecho'.
      El estudio de la criminología se excluye de este campo detallado y se incluye en el campo detallado 0314 'Sociología y estudios culturales'.
  '1041':
    nombre: servicios de transporte
    en: |-
      Transport is the study of operating, navigating and directing ships, train, aircraft and other forms of transportation.
      Programmes and qualifications with the following main content are classified here:
      Aircraft operation
      Air traffic control
      Air traffic safety
      Cabin crew training
      Communication (air, railway, road etc.) programmes
      Crane and truck driving
      Driving programmes
      Flying and navigation
      Navigation technologies
      Postal service
      Railway operations
      Road motor vehicle operations
      Ship operation
      Shipping
      Transport studies

      === Exclusions
      Programmes in telephone network services are excluded from this detailed field and included in detailed field 0714 'Electronics and automation'. Programmes in switchboard operating are excluded from this detailed field and included in detailed field 0415 'Secretarial and office work'.
    es: |-
      El transporte es el estudio de la operación, la navegación y la conducción de barcos, trenes, aeronaves y otras formas de transporte.
      Se clasifican aquí los programas y las titulaciones cuyo contenido principal es:
      Operación de aeronaves
      Control del tránsito aéreo
      Seguridad del tránsito aéreo
      Formación de tripulantes de cabina
      Programas de comunicación (aérea, ferroviaria, vial, etc.)
      Conducción de grúas y camiones
      Programas de conducción
      Vuelo y navegación
      Tecnologías de navegación
      Servicio postal
      Operaciones ferroviarias
      Operación de vehículos automotores de carretera
      Operación de barcos
      Transporte marítimo
      Estudios de transporte

      === Exclusiones
      Los programas de servicios de redes telefónicas se excluyen de este campo detallado y se incluyen en el campo detallado 0714 'Electrónica y automatización'. Los programas de operación de centrales telefónicas se excluyen de este campo detallado y se incluyen en el campo detallado 0415 'Secretariado y trabajo de oficina'.
  A:
