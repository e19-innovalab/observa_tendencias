  S1.11:
    nombre: diseñar sistemas y productos
    en: Creating a plan or specification for the construction of an object, system or structure based
      on aesthetic and/or functional design concepts.
    es: Crear un plan o una especificación para la construcción de un objeto, sistema o estructura a partir
      de conceptos de diseño estéticos o funcionales.
  S1.11.0:
    nombre: diseñar sistemas y productos
    en: Creating a plan or specification for the construction of an object, system or structure based
      on aesthetic and/or functional design concepts.
    es: Crear un plan o una especificación para la construcción de un objeto, sistema o estructura a partir
      de conceptos de diseño estéticos o funcionales.
  S1.11.1:
    nombre: diseñar sistemas o aplicaciones de tic
    en: Creating a plan or specification for the design of information systems, computer games, databases
      and computer networks, systems and applications.
    es: Crear un plan o una especificación para el diseño de sistemas de información, videojuegos, bases
      de datos y redes, sistemas y aplicaciones informáticos.
  S1.11.2:
    nombre: diseñar sistemas o equipos eléctricos o electrónicos
    en: Creating a plan or specification for the design and development of electrical, electronic or mechatronic
      systems, hardware, products, and components.
    es: Crear un plan o una especificación para el diseño y el desarrollo de sistemas, hardware, productos
      y componentes eléctricos, electrónicos o mecatrónicos.
  S1.11.3:
    nombre: elaborar recetas o menús
    en: Combining innovative and creative ideas to come up with new recipes for food and beverage products
      and to create new menus.
    es: Combinar ideas innovadoras y creativas para idear nuevas recetas de alimentos y bebidas y crear
      nuevos menús.
  S1.11.4:
    nombre: diseñar estructuras o instalaciones
    en: Creating a plan or specification for the design and development of physical structures such as
      buildings, urban infrastructure, or open spaces.
    es: Crear un plan o una especificación para el diseño y el desarrollo de estructuras físicas, como
      edificios, infraestructura urbana o espacios abiertos.
  S1.11.5:
    nombre: diseñar materiales, sistemas o productos industriales
    en: Creating or executing a plan or specification for the design of industrial, materials, products,
      or production systems, based on aesthetic and/or functional design concepts.
    es: Crear o ejecutar un plan o una especificación para el diseño industrial, de materiales, de productos
      o de sistemas de producción, a partir de conceptos de diseño estéticos o funcionales.
  S1.1.2:
    nombre: encargarse de la mediación y la resolución de litigios
    en: Working with two or more separate people or groups involved in a disagreement or dispute to bring
      about an agreement, settlement or compromise.
    es: Trabajar con dos o más personas o grupos separados que participan en un desacuerdo o una controversia
      para lograr un acuerdo, una conciliación o un compromiso.
  S1.12:
    nombre: crear materiales artísticos, visuales o docentes
    en: Creating and developing visual representations and displays, instructional or promotional materials,
      or artistic designs or performances.
    es: Crear y desarrollar representaciones y exposiciones visuales, materiales instructivos o promocionales,
      o diseños o actuaciones artísticas.
  S1.12.0:
    nombre: crear materiales artísticos, visuales o docentes
    en: Creating and developing visual representations and displays, instructional or promotional materials,
      or artistic designs or performances.
    es: Crear y desarrollar representaciones y exposiciones visuales, materiales instructivos o promocionales,
      o diseños o actuaciones artísticas.
  S1.12.1:
    nombre: crear exposiciones y decoraciones visuales
    en: Creating, designing and arranging graphics, visual representations, displays, exhibits or decorations.
    es: Crear, diseñar y disponer gráficos, representaciones visuales, exhibiciones, exposiciones o decoraciones.
  S1.12.2:
    nombre: desarrollar materiales instructivos o promocionales
    en: Creating and developing materials for instructional, educational, advertising or promotional purposes
    es: Crear y desarrollar materiales con fines instructivos, educativos, publicitarios o promocionales.
  S1.12.3:
    nombre: crear diseños o actuaciones artísticas
    en: Creating original works of art such as pictures and sculptures, or creating artistic performances
      such as dance and drama for live or recorded performance.
    es: Crear obras de arte originales, como pinturas y esculturas, o crear actuaciones artísticas, como
      danza y teatro, para su representación en vivo o grabada.
  S1.1.3:
    nombre: responder a las reclamaciones
    en: Handling and responding to complaints from clients or staff.
    es: Gestionar y responder a las reclamaciones de clientes o del personal.
  S1.13:
    nombre: escribir y redactar
    en: Writing text or composing music, creating original work with regard to format, style and content.
    es: Escribir textos o componer música, creando obras originales en cuanto a formato, estilo y contenido.
  S1.13.0:
