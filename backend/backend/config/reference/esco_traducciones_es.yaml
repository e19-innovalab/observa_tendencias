  S5.1:
    nombre: programar sistemas informáticos
    en: Writing and submitting  instructions, specifications and programmes for computers.
    es: Escribir y enviar instrucciones, especificaciones y programas para computadoras.
  S5.1.0:
    nombre: programar sistemas informáticos
    en: Writing and submitting  instructions, specifications and programmes for computers.
    es: Escribir y enviar instrucciones, especificaciones y programas para computadoras.
  S5.2:
    nombre: configurar y proteger sistemas informáticos
    en: Setting up, protecting and resolving problems with computer systems, networks, or similar information
      systems.
    es: Configurar y proteger sistemas informáticos, redes o sistemas de información similares, y resolver
      sus problemas.
  S5.2.1:
    nombre: configurar sistemas informáticos
    en: Setting up computers, networks, or similar information systems. Installing computer software,
      and configuring computer networks.
    es: Configurar computadoras, redes o sistemas de información similares. Instalar software informático
      y configurar redes informáticas.
  S5.2.2:
    nombre: proteger dispositivos de tic
    en: Making use of tools and methods to protect and maximize security of ICT devices and information
      by controlling access, such as by requiring passwords, digital signatures, and biometric identification,
      and by protecting systems through the use of software.
    es: Utilizar herramientas y métodos para proteger y maximizar la seguridad de los dispositivos de
      TIC y de la información mediante el control del acceso, por ejemplo, exigiendo contraseñas, firmas
      digitales e identificación biométrica, y protegiendo los sistemas mediante el uso de software.
  S5.2.3:
    nombre: resolver problemas informáticos
    en: Identifying technical problems with ICT systems and devices and performing actions to solve the
      problems.
    es: Identificar problemas técnicos en sistemas y dispositivos de TIC y realizar acciones para resolverlos.
  S5.5:
    nombre: acceder a y analizar datos digitales
    en: Using digital tools to browse, search, filter, organise, store, retrieve, and analyse data, information
      and digital content, to collaborate and communicate with others, and create and edit new content.
    es: Utilizar herramientas digitales para navegar, buscar, filtrar, organizar, almacenar, recuperar
      y analizar datos, información y contenidos digitales, colaborar y comunicarse con otras personas,
      y crear y editar contenidos nuevos.
  S5.5.0:
    nombre: acceder a y analizar datos digitales
    en: Using digital tools to browse, search, filter, organise, store, retrieve, and analyse data, information
      and digital content, to collaborate and communicate with others, and create and edit new content.
    es: Utilizar herramientas digitales para navegar, buscar, filtrar, organizar, almacenar, recuperar
      y analizar datos, información y contenidos digitales, colaborar y comunicarse con otras personas,
      y crear y editar contenidos nuevos.
  S5.5.1:
    nombre: navegar, buscar y filtrar datos digitales
    en: Articulating information needs, searching for data, information and content in digital environments,
      accessing and navigating them. Creating and updating personal search strategies.
    es: Expresar necesidades de información, buscar datos, información y contenidos en entornos digitales,
      y acceder a ellos y navegar por ellos. Crear y actualizar estrategias de búsqueda personales.
  S5.5.2:
    nombre: gestionar y analizar datos digitales
    en: Using digital tools to organise, store, retrieve, and analyse data, information and digital content.
    es: Utilizar herramientas digitales para organizar, almacenar, recuperar y analizar datos, información
      y contenidos digitales.
  S5.6:
    nombre: utilizar herramientas digitales para el trabajo colaborativo, la creación de contenidos y
      la resolución de problemas
    en: Using ICT software and hardware to collaborate and communicate with others, creating and editing
      new content (from word processing to images and video) and solving conceptual, technical and practical
      problems.
    es: Utilizar software y hardware de TIC para colaborar y comunicarse con otras personas, crear y editar
      contenidos nuevos (desde procesamiento de textos hasta imágenes y video) y resolver problemas conceptuales,
      técnicos y prácticos.
  S5.6.0:
    nombre: utilizar herramientas digitales para el trabajo colaborativo, la creación de contenidos y
      la resolución de problemas
    en: Using ICT software and hardware to collaborate and communicate with others, creating and editing
      new content (from word processing to images and video) and solving conceptual, technical and practical
      problems.
    es: Utilizar software y hardware de TIC para colaborar y comunicarse con otras personas, crear y editar
      contenidos nuevos (desde procesamiento de textos hasta imágenes y video) y resolver problemas conceptuales,
      técnicos y prácticos.
  S5.6.1:
    nombre: utilizar herramientas digitales para la colaboración y la productividad
    en: Using ICT software and hardware to collaborate and communicate with others and to improve productivity.
    es: Utilizar software y hardware de TIC para colaborar y comunicarse con otras personas y para mejorar
      la productividad.
  S5.6.2:
    nombre: utilizar software de tratamiento de textos, edición y presentación
    en: Using ICT software and hardware to develop and edit the content of documents and audio-visual
      and prepare them for publication.
    es: Utilizar software y hardware de TIC para desarrollar y editar el contenido de documentos y materiales
      audiovisuales, y prepararlos para su publicación.
  S5.6.3:
    nombre: utilizar herramientas de dibujo y diseño asistido por ordenador
    en: Using ICT software and hardware to collaborate and communicate with others, creating and editing
      new content (from word processing to images and video) and solving conceptual, technical and practical
      problems.
    es: Utilizar software y hardware de TIC para colaborar y comunicarse con otras personas, crear y editar
      contenidos nuevos (desde procesamiento de textos hasta imágenes y video) y resolver problemas conceptuales,
      técnicos y prácticos.
  S5.6.4:
    nombre: utilizar herramientas digitales para el procesamiento de imágenes y sonido
    en: Using ICT software and hardware to for processing sound and images.
    es: Utilizar software y hardware de TIC para el procesamiento de sonido e imágenes.
  S5.7:
    nombre: utilizar herramientas digitales para controlar maquinaria
    en: Issuing commands to computer controlled machines and equipment by despatching the appropriate
      data and input.
    es: Dar órdenes a máquinas y equipos controlados por computadora mediante el envío de los datos y
      las entradas adecuados.
  S5.7.0:
    nombre: utilizar herramientas digitales para controlar maquinaria
    en: Issuing commands to computer controlled machines and equipment by despatching the appropriate
      data and input.
    es: Dar órdenes a máquinas y equipos controlados por computadora mediante el envío de los datos y
      las entradas adecuados.
  S6:
    nombre: manipular y mover
