# Disciplinas de Argentina en los anuarios del DIU. El nombre final es el de las carreras de
# config/reference/carreras_arg_cine.yaml, el mismo del archivo CTI. Lo usa
# app/datasets/tracked_careers.py (analytics.yaml -> tracked_careers.argentina.names_file).
#
# formas: otras maneras de escribir una disciplina en las planillas.
# columnas_csv: columna de egresados del anuario en CSV -> disciplina. Los cuadros privados abrevian
# algunos nombres, y cada columna se comprobó contra el total de su cuadro.
formas:
  Filosafía: Filosofía
  Paramédicas y Auxiliares dela Medicina: Paramédicas y Auxiliares de la Medicina
  Paramédicas y Auxiliares de a Medicina: Paramédicas y Auxiliares de la Medicina

