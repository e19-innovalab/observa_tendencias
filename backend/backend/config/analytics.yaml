# Methodology parameters for every calculation the platform makes.
# Each section is versioned so results can record which parameters produced them.

employability:
  version: "0.3"
  name: Índice Sintético de Empleabilidad (ISE)
  description: >-
    Índice orientativo por ocupación: ISE = 0,47·Demanda neta + 0,33·Salario PPA −
    0,20·Riesgo de automatización.

    Cada dimensión se escala de 0 a 100 dentro del grupo comparado (todas las ocupaciones de
    los 3 países en el mismo año, para que los puntajes sean comparables entre países). En el riesgo de
    automatización la escala se invierte, que es como se aplica la penalización.

    Demanda neta: crecimiento anual promedio del empleo del grupo ocupacional en los últimos
    window_years años (Argentina y Uruguay: grupos de 2 dígitos CIUO-08, OIT; Chile: grandes
    grupos de 1 dígito CIUO-08.CL, Encuesta Nacional de Empleo vía SIMEL), sin contar 2020 y 2021 (caída y rebote por
    la pandemia) y solo si el grupo tiene al menos min_base miles de ocupados al inicio (con
    muestras más chicas la encuesta varía mucho de un año a otro). Salario: ingreso mensual promedio en USD PPA
    del gran grupo ocupacional (CIUO-08, 1 dígito, OIT). Riesgo de automatización: exposición
    a la IA generativa de la OIT (2025), que mide cuánto de las tareas podría hacer la IA, sea
    automatizándolas o complementándolas.

    Puntaje: de 0 a 100 y relativo. 100 es la mejor combinación del grupo comparado y 0 la
    peor; no es un porcentaje de nada. Niveles: Baja por debajo de levels.low, Alta por encima
    de levels.high, Media en el medio.

    Cobertura: qué parte del peso total del índice tiene datos para esa ocupación y país. Si
    falta una dimensión, su peso se reparte entre las que tienen datos. Si la cobertura es
    menor que min_coverage, el índice no se calcula (Datos insuficientes). Las ocupaciones de un
    mismo grupo comparten los valores de ese grupo.
  # ISE = 0.47·D_neta + 0.33·Salario_PPA − 0.20·Riesgo_Automatización. Version 0.3 removed the
  # insertion rate, which never had a source: same proportions as 0.35 / 0.25 / 0.15, same scores.
  # Each dimension is min-max scaled to 0-100 within the comparison cohort; dimensions where
  # lower is better (automation risk) are inverted, which applies the penalty.
  weights:
    net_demand: 0.466667
    salary_ppp: 0.333333
    automation_risk: 0.2
  # Where each dimension comes from. measure: latest (most recent value) or growth (average
  # annual growth over window_years). indicator: null means no source yet (counts as missing).
  dimensions:
    net_demand:
      indicator: employment
      measure: growth
      window_years: 3
      # Years left out of growth calculations: the 2020 collapse and the 2021 rebound would
      # read as demand (e.g. Chile only has 2020 and 2022 by occupation: +36%/year).
      exclude_years: [2020, 2021]
      # Growth is not computed when the starting value is below this (thousands of people):
      # survey samples that small swing widely from year to year.
      min_base: 10
    salary_ppp:
      indicator: mean_monthly_earnings_ppp
      measure: latest
    automation_risk:
      indicator: genai_exposure
      measure: latest
      # A characteristic of the occupation's tasks, not a yearly measurement: the published
      # table applies to every reference year.
      applies_to_all_years: true
  # Values older than this many years before the reference year are not used.
  max_age_years: 5
  # Scores are computed for every reference year from first_year to the latest year with data.
  first_year: 2018
  # all: the 3 countries x 20 occupations form one cohort (scores comparable across countries);
  # country: each country is scaled on its own.
  cohort: all
  higher_is_better:
    net_demand: true
    salary_ppp: true
    automation_risk: false
  levels:
    low: 40
    high: 70
  # Below this share of total weight with data, the score is not computed. Demand and salary
  # (80 %) are enough; demand and risk (67 %) or salary and risk (53 %) are not, as in version 0.2.
  min_coverage: 0.75
  # Score assigned when every member of the cohort has the same value for a dimension.
  flat_cohort_score: 50.0
  scale_max: 100.0

trends:
  version: "0.1"
  name: Clasificación de tendencias
  description: >-
    Se toman los últimos window_points valores observados de cada serie y se ajusta una
    regresión lineal. La pendiente se normaliza por el nivel medio de la serie: si supera
    +threshold la tendencia es de crecimiento, si es menor que -threshold es de disminución y
    en otro caso es estable. Con menos de min_points valores no se clasifica. Si se elige un
    período (from_year / to_year), se usan todos los valores observados de esos años en lugar
    de los últimos window_points.
  # Number of most recent observed points used to classify the trend.
  window_points: 5
  # normalize: divide the slope by the mean level (relative change per period). Indicators that
  # are already rates of change (growth, inflation) override it in indicators.yaml.
  normalize: true
  # Slope above +threshold is growing, below -threshold is declining.
  threshold: 0.02
  min_points: 4

projections:
  version: "0.1"
  name: Proyecciones orientativas
  # Shown in the explorer and returned by /methodologies/projection. Folded style: line breaks
  # inside a paragraph become spaces; a blank line starts a new paragraph or list item.
  description: >-
    Método: suavizado exponencial de Holt con tendencia aditiva. Es el mismo método para todos
    los indicadores, pero se ajusta por separado a cada serie (indicador × país × sector), así
    que cada una tiene sus propios coeficientes.

    1. Con toda la historia observada se estiman dos componentes: el nivel (dónde está la serie
    hoy, con más peso en los valores recientes) y la tendencia (cuánto cambia por período).

    2. Cuánto reacciona cada componente a los datos nuevos se ajusta automáticamente a la serie:
    una serie volátil reacciona rápido, una estable reacciona lento.

    3. Proyección: valor en h períodos = último nivel + h × última tendencia. Es decir, se
    prolonga en línea recta la tendencia actual.

    4. Intervalo: valor ± ci_z × σ × √h, donde σ es el desvío de los errores del modelo sobre la
    historia. Se ensancha con √h: cuanto más lejos, más incertidumbre. El valor y el intervalo
    se recortan a los valores posibles del indicador (indicators.yaml -> value_range): por
    ejemplo, una tasa nunca se proyecta por debajo de 0 % ni por encima de 100 %.

    Se proyectan horizon períodos en la frecuencia de la serie (años, trimestres o meses). Con
    menos de min_points valores observados no se proyecta.

    Limitaciones: no modela estacionalidad (en series trimestrales y mensuales el intervalo
    sale más ancho), prolonga la tendencia sin amortiguarla y el intervalo es aproximado. Son
    proyecciones orientativas: no anticipan cambios de contexto ni de política.
  min_points: 12
  horizon: 4
  ci_z: 1.96

skill_gaps:
  version: "0.2"
  name: Brechas de habilidades
  description: >-
    Compara cuánto crece la demanda de cada habilidad con cuánto crece la formación que la
    enseña, ambas como crecimiento anual promedio en la misma ventana de años.

    Demanda de una habilidad: crecimiento del empleo de las ocupaciones que la usan (el mismo
    dato de la demanda neta del ISE), promediado según el peso de la habilidad en cada
    ocupación (ESCO).

    Oferta de una habilidad: crecimiento de los titulados de las carreras que forman para esas
    ocupaciones (Chile: Mi Futuro, pregrado; Argentina: datos.gob.ar; Uruguay: anuarios del
    MEC), promediado con los mismos pesos. Una carrera que forma para varias ocupaciones reparte
    sus titulados en partes iguales. Cada carrera se clasifica en un campo de estudio de la
    CINE-F 2013 (UNESCO) y cada campo se asocia a ocupaciones CIUO-08 con una tabla común a los
    tres países; esa correspondencia es un borrador sin revisar (config/reference).

    Argentina: los años que el archivo de Indicadores CTI todavía no tiene se completan con el
    Anuario Estadístico del DIU (la misma información, publicada antes). El anuario no separa
    pregrado de grado: se reparte con la proporción de cada disciplina en el último año del CTI
    (una estimación hasta que el CTI publique ese año).

    El crecimiento de la oferta compara el promedio de los primeros supply_smoothing_years de
    la ventana con el de los últimos, no dos años sueltos. Si la serie de titulados de una
    ocupación salta más de supply_max_jump veces de un año al siguiente dentro de la ventana, se
    considera inestable y esa ocupación queda fuera de la oferta ese año (se informa con la
    brecha).

    La ventana de la oferta (supply_window_years) no excluye 2020 y 2021: la exclusión de la
    demanda responde a la caída del empleo en la pandemia, que no tuvo un equivalente en las
    titulaciones.

    Brecha = demanda − oferta, en puntos porcentuales: positiva si la demanda crece más rápido
    que la formación. Solo se calcula si las ocupaciones con datos de oferta suman al menos
    min_supply_coverage del peso de la habilidad; si no, "datos insuficientes" (nunca se inventa
    una brecha). Una habilidad es emergente si su demanda crece más que emerging_growth por año.

    Grupos de habilidades: ESCO divide un mismo tema en muchas habilidades casi iguales (por
    ejemplo "preparar estados financieros" y "realizar informes estadísticos y financieros").
    También se calcula la brecha de cada grupo de la jerarquía de ESCO (nivel group_level; los
    conocimientos siguen los campos CINE-F), con el mismo método sobre todas las ocupaciones que
    usan alguna habilidad del grupo. En cada ocupación el grupo pesa lo que su habilidad más
    fuerte (no la suma), para que las habilidades repetidas no inflen el resultado.
  emerging_growth: 0.10
  # Gaps are also computed per ESCO skill group, at this level of the hierarchy (3: S2.2.1
  # "preparar documentos, registros, informes o presupuestos financieros", or a CINE-F detailed
  # field such as 0412 for knowledge). ESCO splits topics into many near-identical skills; the
  # group joins them. In each occupation a group weighs as its strongest skill (not their sum).
  group_level: 3
  # Gaps are computed for the latest year with demand and supply data and for this many years
  # in total going back (each year with the data available up to that year), so they can be
  # compared over time. Years without enough data simply get fewer gaps.
  history_years: 5
  # Demand growth window: same as the ISE's net demand (years, excluded years).
  window_years: 3
  exclude_years: [2020, 2021]
  # Supply (graduates) window. The pandemic exclusion is for employment shocks; graduations had
  # no such collapse, and excluding those years would leave Argentina (data up to 2023) with a
  # one-year window that amplifies any swing.
  supply_window_years: 3
  supply_exclude_years: []
  # Minimum graduates per occupation at the start of the window to compute its supply growth.
  min_supply_base: 30
  # Supply growth compares the average of the first supply_smoothing_years of the window with
  # the average of the last ones (not two single years), so a one-off spike does not decide it.
  supply_smoothing_years: 2
  # A graduates series that jumps more than this factor from one year to the next inside the
  # window (e.g. Argentina, Medicina pregrado: 58 -> 645 -> 194) is unstable: that occupation is
  # left out of the supply side for that year and listed with the gap ("serie inestable").
  supply_max_jump: 3.0
  # Share of the skill's total weight that must have supply data to report a gap.
  min_supply_coverage: 0.3
  # Supply data by country: crosswalk files in config/reference. Since v0.2 each career gets a
  # CINE-F 2013 field (carreras_<país>_cine.yaml) and reaches occupations through one table
  # shared by the three countries (cine_f_ciuo.yaml). The direct career -> CIUO files used until
  # v0.1 (carreras_chile_ciuo.yaml, carreras_argentina_ciuo.yaml, carreras_uruguay_ciuo.yaml) are
  # kept for comparison; pointing a country back to one of them restores the old behaviour.
  crosswalks:
    CHL: reference/carreras_chl_cine.yaml
    ARG: reference/carreras_arg_cine.yaml
    URY: reference/carreras_ury_cine.yaml
  # Extra graduate sources per country, used only for the years the crosswalk's own source does
  # not have yet (the DIU yearbook comes out before the CTI file). combined_level: the level the
  # supplement uses for several levels together; it is split into the crosswalk's levels with
  # each career's shares in the latest year of the main source that has them (an estimate).
  supply_supplements:
    ARG: {profile: arg_anuario_diu_egresados, combined_level: Pregrado y grado}
  # Gap above this many percentage points is a "high" gap (used by the new_skill_gap alert).
  high_gap_points: 3.0

moctezuma:
  version: "0.1"
  name: Indicador Moctezuma
  description: >-
    Mide la asimetría de cada ocupación entre el ritmo con que llega el cambio tecnológico y la
    capacidad de respuesta de la sociedad para incorporarlo. El nombre alude al encuentro de
    1519 entre Moctezuma y los europeos, el ejemplo clásico de una tecnología que llega mucho
    más rápido de lo que una sociedad puede incorporarla; la analogía es sobre ese desfase, no
    un juicio sobre las culturas.

    Ritmo del cambio: exposición de las tareas de la ocupación a la IA generativa (OIT, 2025) y
    velocidad de digitalización del país (crecimiento anual promedio de la población que usa
    internet).

    Capacidad de respuesta: crecimiento de los titulados de las carreras que forman para la
    ocupación (los mismos datos y correspondencias que las brechas de habilidades), ajuste
    educativo de quienes ya trabajan en ella (subcalificación del gran grupo ocupacional, en
    contra) y base educativa del país (matrícula bruta en educación superior).

    Cada dimensión se escala de 0 a 100 dentro del grupo comparado (todas las ocupaciones de los
    3 países en el mismo año); en las dimensiones donde un valor bajo indica más ritmo o más
    capacidad la escala se invierte. Ritmo y Capacidad son el promedio ponderado de sus
    dimensiones con datos (dimension weights, relativos dentro de cada lado).

    Indicador = side_weights.pace · Ritmo + side_weights.readiness · (100 − Capacidad).
    50 es equilibrio: el ritmo del cambio y la capacidad de respuesta están parejos. Por encima
    de 50 el cambio va más rápido que la respuesta; 100 sería el ritmo más alto con la menor
    capacidad del grupo. Es un puntaje relativo al grupo comparado, no una medida absoluta.
    Niveles: Baja por debajo de levels.low, Alta por encima de levels.high, Media en el medio.

    Solo se calcula si cada lado tiene datos para al menos min_side_coverage de su peso: sin
    alguno de los dos lados no hay asimetría que medir (Datos insuficientes).

    Limitación: la exposición a la IA es una foto fija (no varía por año ni por país), así que
    el ritmo cambia en el tiempo solo por la digitalización; falta una serie de adopción de IA
    por país.
  side_weights:
    pace: 0.5
    readiness: 0.5
  # side: pace (ritmo del cambio) | readiness (capacidad de respuesta). weight: relative within
  # the side. higher_is_more: true when a higher raw value means a faster pace (pace side) or
  # more capacity (readiness side).
  # scope: occupation (series by occupation) | country (national series, shared by every
  # occupation of the country). indicator: graduates uses the graduates table through the
  # skill_gaps crosswalks instead of an indicator. measure/window_years/exclude_years/min_base/
  # applies_to_all_years: as in the employability dimensions.
  dimensions:
    ai_exposure:
      side: pace
      weight: 1
      indicator: genai_exposure
      scope: occupation
      measure: latest
      applies_to_all_years: true
      higher_is_more: true
    digital_diffusion:
      side: pace
      weight: 1
      indicator: internet_users
      scope: country
      measure: growth
      window_years: 3
      exclude_years: []
      higher_is_more: true
    training_growth:
      side: readiness
      weight: 1
      indicator: graduates
      scope: occupation
      measure: growth
      # Same window and minimum base as the skill gaps' supply (skill_gaps section).
      window_years: 3
      exclude_years: []
      min_base: 30
      higher_is_more: true
    education_fit:
      side: readiness
      weight: 1
      indicator: undereducation_rate
      scope: occupation
      measure: latest
      higher_is_more: false
    tertiary_base:
      side: readiness
      weight: 1
      indicator: tertiary_enrollment
      scope: country
      measure: latest
      higher_is_more: true
  max_age_years: 5
  first_year: 2018
  # all: one cohort for the 3 countries; country: each country scaled on its own.
  cohort: all
  min_side_coverage: 0.5
  levels:
    low: 40
    high: 60
  flat_cohort_score: 50.0
  scale_max: 100.0

ludita:
  version: "0.1"
  name: Indicador Ludita
  description: >-
    Mide cuánto se parece hoy cada ocupación al camino de los oficios que la tecnología
    desplazó. El nombre alude a los luditas, los tejedores ingleses que entre 1811 y 1816
    rompieron los telares mecánicos; la analogía es sobre el desplazamiento, no un juicio sobre
    quienes se resisten al cambio.

    Exposición: cuánto de las tareas de la ocupación puede hacer la IA generativa (OIT, 2025).

    Vitalidad: si el mercado sigue apostando por la ocupación. Crecimiento anual promedio del
    empleo del grupo ocupacional en los últimos 3 años (sin 2020 ni 2021, como en el ISE) y de
    los titulados de las carreras que forman para ella (las mismas correspondencias que las
    brechas de habilidades).

    Cada dimensión se escala de 0 a 100 dentro del grupo comparado (todas las ocupaciones de los
    3 países en el mismo año). Exposición y Vitalidad son el promedio ponderado de sus
    dimensiones con datos.

    Indicador = side_weights.exposure · Exposición + side_weights.vitality · (100 − Vitalidad).
    50 es neutro. Por encima de 50 la ocupación está expuesta y el mercado se retira de ella,
    como los tejedores manuales después del telar mecánico; por debajo, está menos expuesta o
    el mercado sigue apostando por ella. Niveles: Bajo por debajo de levels.low, Alto por encima
    de levels.high.

    Camino: el cuadrante según los valores sin escalar, para que signifique lo mismo todos los
    años. Expuesta es una exposición de al menos paths.exposed_from (donde empiezan los
    gradientes 2 a 4 de la OIT); el mercado se retira cuando el crecimiento promedio del empleo
    y de los titulados es menor que paths.retreat_below. Expuesta y el mercado se retira: camino
    del tejedor (el oficio se achica). Expuesta y el mercado crece: camino del cajero de banco
    (la tecnología cambia el trabajo pero el empleo crece, como los cajeros después del cajero
    automático). Poco expuesta y se achica: otras causas. Poco expuesta y crece: fuera del
    alcance, por ahora.

    Limitaciones: la exposición es una foto fija (no varía por año ni por país); el empleo por
    ocupación es del grupo de 2 dígitos (Argentina, Uruguay) o 1 dígito (Chile), así que las
    ocupaciones de un grupo comparten esa señal; 3 años de datos después de la IA generativa
    son muy pocos para hablar de desplazamiento.
  sides: [exposure, vitality]
  side_weights:
    exposure: 0.5
    vitality: 0.5
  # As in the moctezuma section: side, weight within the side, indicator, scope, measure.
  dimensions:
    ai_exposure:
      side: exposure
      weight: 1
      indicator: genai_exposure
      scope: occupation
      measure: latest
      applies_to_all_years: true
      higher_is_more: true
    employment_growth:
      side: vitality
      weight: 1
      indicator: employment
      scope: occupation
      measure: growth
      # Same window, excluded years and minimum base as the ISE's net demand.
      window_years: 3
      exclude_years: [2020, 2021]
      min_base: 10
      higher_is_more: true
    training_growth:
      side: vitality
      weight: 1
      indicator: graduates
      scope: occupation
      measure: growth
      window_years: 3
      exclude_years: []
      min_base: 30
      higher_is_more: true
  # Path (quadrant) of each scored occupation, on the raw values so it means the same every year:
  # exposed when ai_exposure >= exposed_from (0.40 is where the ILO's gradients 2-4 start);
  # the market moves away when the weighted mean growth of the vitality dimensions with data is
  # below retreat_below (0: employment and training shrink on average).
  paths:
    exposure_dimension: ai_exposure
    exposed_from: 0.40
    retreat_below: 0.0
  max_age_years: 5
  first_year: 2018
  cohort: all
  min_side_coverage: 0.5
  levels:
    low: 40
    high: 60
  flat_cohort_score: 50.0
  scale_max: 100.0

red_queen:
  version: "0.1"
  name: Indicador Reina Roja
  description: >-
    Mide cuánto tiene que actualizarse una ocupación solo para no quedarse atrás: qué parte de lo
    que se le pide cambia cada año. El nombre viene de Alicia a través del espejo, donde la Reina
    Roja explica que hay que correr todo lo posible para quedarse en el mismo lugar.

    Perfil de una ocupación en una versión: las tecnologías que lista O*NET (Technology Skills,
    EE. UU., llevadas a CIUO-08 con el cruce ESCO–O*NET-SOC 2019) o las habilidades que le asigna
    ESCO en esa versión.

    Recambio entre dos versiones: 1 − (elementos en las dos / elementos en alguna), la distancia
    de Jaccard. Se anualiza según los años entre versiones: si s = 1 − recambio es lo que se
    mantiene, lo que se mantiene por año es s^(1/años) y el recambio anual es 1 − ese valor.

    Vida media: años hasta que el perfil comparte solo la mitad con el de hoy,
    ln(0,5) / ln(lo que se mantiene por año).

    Cada año compara la última versión publicada hasta ese año con la última de al menos
    window_years años antes y anualiza el recambio, para no depender de qué ocupaciones revisó
    la fuente en una versión puntual. Los nombres que solo cambian de forma (se agrega o quita el
    fabricante o una palabra) cuentan como el mismo elemento.

    Puntaje: novedades por año, los elementos que entraron al perfil divididos por los años entre
    versiones (lo que hay que aprender para no quedarse atrás). Cada fuente es una dimensión; sus
    novedades por año se escalan de 0 a 100 entre las ocupaciones con dato ese año y el indicador
    es el promedio ponderado de las dimensiones con dato. El recambio y la vida media se
    muestran al lado: dicen qué parte del perfil cambia. Niveles: Baja por debajo de levels.low,
    Alta por encima de levels.high.

    Sesgo conocido: los perfiles grandes suman más novedades; en O*NET una ocupación CIUO puede
    reunir varias ocupaciones de EE. UU. (el cruce ESCO–O*NET) y tener un perfil más grande.

    Limitaciones: O*NET es de Estados Unidos y no actualiza todas las ocupaciones en cada
    versión; ESCO refleja la revisión de expertos de la clasificación, no los avisos. No varía por
    país. Los cambios de una versión pueden ser correcciones de la clasificación y no cambios
    reales del trabajo.
  # source: source_code in sources.yaml. weight: relative. min_items: profiles smaller than this
  # in the earlier version are left out (a change of one item would read as a huge turnover).
  dimensions:
    technology_turnover:
      source: onet_technology
      weight: 1
      min_items: 20
    skill_turnover:
      source: esco_versions
      weight: 1
      min_items: 20
  # Each year compares the latest version published up to that year with the latest one at
  # least window_years older (or the oldest there is, if at least min_years older), and annualizes
  # the turnover: a single release can change little or a lot depending on which occupations the
  # source revised that time.
  window_years: 3
  min_years: 1
  # Two names count as the same item when one is contained in the other (a source adding or
  # dropping the vendor or a word, "Confluence" -> "Atlassian Confluence"), if the shorter one has
  # at least this many characters.
  rename_min_chars: 5
  # A pair of versions is used for a year until this many years after its later version.
  max_age_years: 3
  first_year: 2022
  # Half-life above this many years is shown as "más de" (a profile that barely changes).
  half_life_cap: 50
  levels:
    low: 40
    high: 60
  flat_cohort_score: 50.0
  scale_max: 100.0
  # Every added and removed item is stored; this many are shown before "ver más".
  examples: 12

sisyphus:
  version: "0.1"
  name: Indicador Sísifo
  description: >-
    Mide dónde estudiar más no rinde: grupos de ocupación donde mucha gente tiene más estudios de
    los que pide el puesto y el puesto paga poco frente a lo que suele pagar un título. El nombre
    viene de Sísifo, condenado a subir una piedra que siempre vuelve a caer.

    La piedra: sobreeducación del gran grupo de ocupación (OIT, enfoque normativo: ocupados con
    más educación de la que pide el grupo). Solo existe en los grupos que no piden el nivel más
    alto (en la norma de la OIT, del 4 al 9).

    La recompensa: ingreso medio del gran grupo dividido por el ingreso medio de quien tiene
    educación superior en el país, ese año (los dos en USD PPA, OIT). Debajo de 1, el grupo paga
    menos de lo que paga en promedio un título.

    Cada dimensión se escala de 0 a 100 entre todos los grupos de los 3 países ese año. Indicador
    = side_weights.stone · Piedra + side_weights.reward · (100 − Recompensa). Por encima de 50,
    estudiar más rinde poco en ese grupo. Niveles: Bajo por debajo de levels.low, Alto por encima
    de levels.high.

    Cuadrante, con los valores sin escalar: sobreeducado desde quadrants.overeducated_from (%) y
    mal pago debajo de quadrants.paid_below (ingreso del grupo / ingreso con educación superior).

    Por país: la proporción de ocupados con educación superior que trabajan en un grupo que no la
    pide, y la prima salarial (ingreso con educación superior / con secundaria − 1).

    Limitaciones: la OIT no publica ingresos por educación dentro de cada ocupación: la
    recompensa compara el promedio del grupo con el de los graduados, no lo que gana un graduado
    en ese grupo. En el grupo 9 la norma pide solo primaria, así que cuenta como sobreeducado
    cualquiera con secundaria.
  sides: [stone, reward]
  side_weights:
    stone: 0.5
    reward: 0.5
  dimensions:
    overeducation:
      side: stone
      weight: 1
      indicator: overeducation_rate
      scope: group
      measure: latest
      higher_is_more: true
    earnings_vs_tertiary:
      side: reward
      weight: 1
      indicator: mean_monthly_earnings_ppp
      scope: group
      measure: latest
      # divided by this national series of the same country (latest value up to the same year)
      relative_to: earnings_tertiary_ppp
      higher_is_more: true
  # Unit: ISCO-08 major group (overeducation and earnings by occupation are published by group).
  group_digits: 1
  # Groups whose required education is the highest band cannot be overeducated: left out.
  requirements_file: reference/isco_education_requirements.yaml
  # Shown next to the earnings: the same figures in USD (official rate), as everywhere else.
  display:
    group_earnings_usd: mean_monthly_earnings_usd
    tertiary_usd: earnings_tertiary_usd
    tertiary_ppp: earnings_tertiary_ppp
    secondary_usd: earnings_secondary_usd
    secondary_ppp: earnings_secondary_ppp
  # Occupations listed as examples of each major group (featured ones first).
  group_examples: 8
  quadrants:
    overeducated_from: 20
    paid_below: 0.5
  max_age_years: 2
  first_year: 2015
  cohort: all
  min_side_coverage: 0.5
  levels:
    low: 40
    high: 60
  flat_cohort_score: 50.0
  scale_max: 100.0

alerts:
  version: "0.1"
  name: Alertas
  description: >-
    Después de cada actualización se revisan los últimos datos y se registran alertas.

    Variación significativa: el último valor cambió respecto del período inmediatamente anterior
    (sin huecos, y solo si el dato tiene a lo sumo max_age_years años) más que change_pct
    (indicadores en cantidades, dinero o índices) o más que absolute_change puntos (indicadores
    en porcentaje), o el cambio es atípico (más de z_threshold desvíos de los cambios previos de
    la serie). Es severidad alta si supera high_severity_factor veces el umbral.

    Cambio de tendencia: la tendencia de la última ventana es distinta de la de la ventana que
    termina un período antes (crecimiento, estabilidad o disminución).

    Cambio de nivel del ISE: una ocupación pasó de nivel (Baja, Media, Alta) respecto del año
    anterior.

    Fuente desactualizada: la última actualización exitosa es más vieja que stale_factor veces
    la frecuencia esperada de la fuente.

    Formato de archivo cambiado: un archivo oficial descargado automáticamente no tiene el
    formato validado (hoja, columnas, períodos, valores o revisiones). No se carga y se
    mantienen los datos anteriores hasta que alguien revise el perfil del dataset.

    Cada alerta se registra una sola vez y guarda el valor anterior, el actual y el período.
  change_pct: 0.10
  # Units whose change is measured in their own unit (percentage points) instead of as a ratio,
  # and the threshold for them. Indicators can override it (indicators.yaml -> alerts).
  absolute_units: [percent]
  absolute_change: 1.0
  z_threshold: 2.0
  # Minimum history (points) before the z-score rule is applied.
  z_min_points: 5
  # A change above change_pct * high_severity_factor is high severity.
  high_severity_factor: 2
  # Skill gap (percentage points of growth, skill_gaps section) above which a gap is new.
  gap_threshold: 3.0
  stale_factor: 1.5
  # Ignore relative changes whose previous value is below this (percent changes on tiny bases
  # are noise). Does not apply to absolute_units.
  min_base: 30
  # Which series are checked: national and sector series always; occupation-level series and
  # ISE level changes for featured | all | none occupations.
  occupation_scope: featured
  # Significant changes are only checked between consecutive periods (no gaps in the series)
  # and when the latest value is at most max_age_years old: old or gapped comparisons (e.g.
  # Chile 2020 -> 2022 by occupation) are not news.
  require_consecutive: true
  max_age_years: 2
  severities:
    significant_change_default: medium
    significant_change_high: high
    index_level_change: medium
    trend_reversal: medium
    new_skill_gap: medium
    stale_source: low
    source_format_changed: high
  messages:
    significant_change: "Variación de {change:+.1%} respecto del período anterior"
    significant_change_points: "Variación de {change:+.1f} puntos respecto del período anterior"
    # Appended when one ISCO group change covers several occupations (they share the value).
    shared_group: " (grupo CIUO {group}: {occupations})"
    index_level_change: "El nivel de empleabilidad pasó de {previous} a {current}"
    trend_reversal: "La tendencia cambió de {previous} a {current}"
    new_skill_gap: "La brecha de habilidad superó el umbral por primera vez"
    stale_source: "Fuente sin actualizar desde {last_update:%Y-%m-%d}"
    source_format_changed: "El archivo {file} de {source} no tiene el formato validado: {reason}. No se cargó; se mantienen los datos anteriores."

# Trends and projections per career from the graduates table (app/analytics/graduate_trends_run.py;
# window and thresholds: trends and projections above). Levels: the undergraduate degrees each
# source publishes, without postgraduate ones. Sources: in order of preference for a year that
# two publish; the DIU yearbook adds the years the CTI file does not have yet.
graduate_trends:
  countries:
    ARG:
      levels: [Pregrado, Grado, Pregrado y grado]
      sources: [anuarios_por_institucion, indicadores_cti_argentina, anuario_diu_argentina]
      # The DIU yearbooks, added up from their institution tables (tracked_careers), are preferred:
      # the CTI file falls 17-19 % short of them in 2016-2018 and 2021. 2015 stays on CTI because
      # that yearbook's tables leave out disciplines; 2019 has no yearbook with these tables.
      yearbook_series:
        source: anuarios_por_institucion
        level: Pregrado y grado
        exclude_years: [2015]
    CHL:
      levels: [Pregrado]
      sources: [mifuturo_chile]
    URY:
      levels: [Grado]
      sources: [mec_uruguay]
      # The MEC yearbooks rename degrees between years ("Doctor en Derecho y Ciencias Sociales" ->
      # "Abogacía"): a series by the published name would show renames as growth.
      names_file: reference/carreras_uruguay_nombres.yaml
  sector_file: reference/cine_f_sectores.yaml
  other_sector: otros
  # Not a career: graduates the yearbook does not assign to a discipline.
  skip_careers: [sin disciplina]
  # Footnote marks at the end of published names.
  name_marks: "*"

# Argentina: registered private jobs and salaries per activity (app/datasets/cep_xxi.py, source
# cep_xxi_argentina), and the factors of factores_macro_ppa. The files end in November 2023: they
# are checked each month in case CEP-XXI publishes more.
cep_xxi:
  dataset_code: cep_xxi_actividad
  source_label: AR_CEPXXI
  allowed_hosts: [cdn.produccion.gob.ar, datos.produccion.gob.ar]
  max_bytes: 20000000
  api_max_bytes: 5000000
  date_column: fecha
  activity_column: clae2
  suppressed: -99
  total_label: Total
  currency: ARS
  wage_type: promedio_mensual_privado_registrado
  real_base_year: 2017
  files:
    jobs:
      page: https://datos.produccion.gob.ar/dataset/puestos-de-trabajo-por-sector-productivo
      link_pattern: 'https://cdn\.produccion\.gob\.ar/cdn-cep/datos-por-actividad/puestos/puestos_privados_mensual_por_clae2\.csv'
      value_column: puestos
    mean_wage:
      page: https://datos.produccion.gob.ar/dataset/salarios-promedio-y-mediano-por-sector-de-actividad
      link_pattern: 'https://cdn\.produccion\.gob\.ar/cdn-cep/datos-por-actividad/salarios/w-mean/w_mean_privado_mensual_por_clae2\.csv'
      value_column: w_mean
    women:
      page: https://datos.produccion.gob.ar/dataset/proporcion-segun-generos-por-sector-de-actividad
      link_pattern: 'https://cdn\.produccion\.gob\.ar/cdn-cep/datos-por-actividad/share-mujer/share_mujer_privado_mensual_por_clae2\.csv'
      value_column: share_mujer
  # factores_macro_ppa
  world_bank_url: 'https://api.worldbank.org/v2/country/{countries}/indicator/{indicator}?format=json&per_page=500'
  # Private consumption, the factor the ILO applies to its earnings. Where the World Bank stops
  # publishing it (Argentina, after 2021), it is extended as the ILO does: previous factor x country's
  # prices / US prices.
  ppp_indicator: PA.NUS.PRVT.PP
  ppp_method: PA.NUS.PRVT.PP (Banco Mundial)
  ppp_extended_method: PA.NUS.PRVT.PP extendido con la inflación del país y de EE. UU.
  us_iso3: USA
  fx_indicator: PA.NUS.FCRF
  # Monthly wages to dollars: the month's average of the official daily quote (sources.yaml -> bcra_dolar).
  fx_currency: USD
  fx_label: Dólar oficial mayorista (BCRA), último día hábil anterior
  cpi_base_year: 2016  # ipc_base_2016; Argentina has no value there, INDEC's index starts in December 2016
  world_bank_cpi: {indicator: FP.CPI.TOTL, source: Banco Mundial (FP.CPI.TOTL), base: 2010=100}
  indec_cpi:
    url: 'https://apis.datos.gob.ar/series/api/series/?ids=145.3_INGNACNAL_DICI_M_15&limit=1000&format=json'
    source: INDEC (IPC Nacional)
    base: diciembre 2016=100
  note: >-
    Empleo privado registrado (CEP-XXI): no incluye empleo público ni informal, y los datos llegan hasta
    noviembre de 2023. Los puestos, los pesos y los dólares de 2023 cubren 11 meses. El dólar PPA y el
    salario real llegan hasta 2022, porque sus factores anuales de 2023 incluyen la suba de precios de
    diciembre. Cada mes de salarios pasa a dólares con el promedio de ese mes del dólar oficial mayorista
    diario (BCRA), que puede diferir mucho del paralelo; para comparar países, usá el dólar PPA. El
    salario real descuenta el IPC del INDEC, que empieza en 2017.

# KPIs per sector (app/analytics/sector_kpis_run.py). The sectors of graduates come from the CINE-F
# field of each career and those of employment from ISIC, so density is an approximation.
sector_kpis:
  input_indicators: [employment, employment_women, mean_monthly_earnings_ppp, mean_monthly_earnings_ppp_women, mean_monthly_earnings_ppp_men]
  total_label: Total
  ilostat_source: OIT_ILOSTAT
  graduates_source: {ARG: AR_DIU_ANUARIOS, CHL: CL_MIFUTURO, URY: UY_MEC_ANUARIO}
  density_concept: Graduados anuales por cada 1.000 ocupados
  earnings_type: promedio_mensual_usd_ppa
  earnings_method: CUR_TYPE_PPP (OIT)
  # % of women considered parity (EIGE / ILO criterion in the team's gender analysis). Below
  # parity_min_people the share says little: no diagnosis is given.
  parity_band: [40, 60]
  parity_min_people: 30
  parity_labels:
    parity: Zona de paridad
    women: Concentración femenina
    men: Subrepresentación femenina
    few: Pocos casos
  parity_criterion: Entre 40 % y 60 % de mujeres (EIGE / OIT)
  gender_note: >-
    Titulados: Mi Futuro, anuarios del DIU y del MEC. Ocupados y salarios: OIT. Diagnóstico de paridad
    con el criterio EIGE / OIT: entre 40 % y 60 % de mujeres es zona de paridad; por debajo,
    subrepresentación femenina; por encima, concentración femenina. Con menos de 30 titulados no se da
    diagnóstico. Los años pueden diferir entre columnas: cada una muestra su último dato.
  projection_model: Holt (tendencia aditiva)
  note: >-
    Datos oficiales: titulados de Mi Futuro, los anuarios del DIU y del MEC; empleo y salarios de la
    OIT. La densidad es aproximada: el sector de una carrera sale de su campo de estudio y el del
    empleo, de la actividad económica. Cada país cuenta un nivel distinto de titulados. Argentina
    publica el sexo de los titulados solo para el total del país, no por sector.

# Careers per institution and programs per topic, from each country's official files (app/datasets/
# tracked_careers.py, source carreras_seguimiento). columns (Chile), in this order: year, value,
# program name, level, generic career, institution. Generic careers: the levels of graduate_trends.
# total_tolerance: how far institution sums may be from the published totals before the load stops
# (the MEC's 2024 yearbook leaves two programs empty while their campus counts them: 23 graduates,
# 2.3 % of UCU).
tracked_careers:
  total_tolerance: 0.03
  argentina:
    # The latest yearbook comes from this profile; yearbooks lists the earlier ones. The official
    # page links no yearbook with these tables for 2019. members: the workbooks of each zip with
    # undergraduate tables (some zips repeat them under other names).
    profile: arg_anuario_diu_egresados
    names_file: reference/disciplinas_argentina.yaml
    landing_page: https://www.argentina.gob.ar/educacion/universidades/informacion/publicaciones/anuarios
    allowed_hosts: [www.argentina.gob.ar]
    max_bytes: 80000000
    title_pattern: 'egresad[a-z/]* de t[ií]tulos de pregrado y grado por (disciplina|rama (?!de estudio))'
    year_pattern: '(?:A[nñ]o|,)\s*(20\d{2})'
    value_kinds: [EGRE, EGR]
    header_rows: 14
    # Subtotal rows: some yearbooks do not label them as totals ("Universidades Privadas").
    skip_names_pattern: '^(Total|Universidades (Nacionales|Provinciales|Privadas|Estatales|Extranjeras)|Institutos Universitarios|Instituciones)\b'
    # Columns that are not a discipline: graduates the yearbook assigns to none, and field subtotals
    # that some tables do not label as totals.
    not_disciplines: [sin disciplina, sin rama, ciencias aplicadas, ciencias basicas, ciencias humanas, ciencias sociales, ciencias de la salud]
    # Years whose tables were published without some disciplines: their total counts them but no
    # column does, so those graduates have no institution. 2015: Ciencias Agropecuarias (public),
    # Industrias and Ingeniería (private), about 3,800 graduates.
    known_gaps: [2015]
    # Graduates by sex: the first row of each table of "género", for the whole country.
    sex_title_pattern: 'egresad[a-z/]* de t[ií]tulos de pregrado y grado por (g[eé]nero|sexo)\W*\d*\W*seg[uú]n instituci[oó]n'
    sex_exclude_pattern: 'porcentaje|[ÍI]ndice Cuadros'
    sex_group_pattern: '^egresad'
    sex_labels: {F: '^mujeres', M: '^varones'}
    sex_total_label: Total
    yearbooks:
      - {release: 2014, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2014\.zip', members: 'Cap.{1,3}tulo 2\.[12] '}
      - {release: 2015, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2015\.zip', members: '^2\.[12] - pregado'}
      - {release: 2016, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2016\.zip', members: '^Cuadros_pregrado_grado_(estatal_2016\.xlsx|privado)'}
      - {release: 2017, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2017_2\.zip', members: '^2\.[12] Pregrado'}
      - {release: 2018, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2018_1\.zip', members: '^2\.[12] - Pregrado'}
      - {release: 2020, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2020\.zip', members: '^2\.[12] Pregrado'}
      - {release: 2021, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_2021\.zip', members: '^2\.[12] Pregrado'}
      - release: 2022
        link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_csv_2022\.zip'
        csv:
          folder: 'Anuario 2022/Capitulo 2 Pregrado Grado {management}/'
          name_column: nombre_corto
          graduates_prefix: e_
          total_column: e
          sex_tables: ['Estatal|Cuadro_2_1_4_a.csv', 'Privado|Cuadro_2_2_4_a.csv']
          sex_columns: {F: e_mujeres, M: e_varones}
          not_disciplines: [e_sin_rama]
          tables:
            - names_table: 'Estatal|Cuadro_2_1_9.csv'
              members: ['Estatal|Cuadro_2_1_10.csv', 'Estatal|Cuadro_2_1_11.csv', 'Estatal|Cuadro_2_1_12.csv', 'Estatal|Cuadro_2_1_13.csv', 'Estatal|Cuadro_2_1_14.csv']
            - names_table: 'Privado|Cuadro_2_2_9.csv'
              members: ['Privado|Cuadro_2_2_10.csv', 'Privado|Cuadro_2_2_11.csv', 'Privado|Cuadro_2_2_12.csv', 'Privado|Cuadro_2_2_13.csv', 'Privado|Cuadro_2_2_14.csv']
      - {release: 2023, link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?rv_anuario_finales_todos\.zip', members: '^2\.[12] Pregrado'}
  uruguay: {profile: mec_uy_egresados_grado, source: mec_uruguay, level: Grado, sex_columns: {M: 8, F: 9}}
  file: reference/carreras_seguimiento.yaml
  dataset_code: carreras_seguimiento
  profile: mifuturo_titulados
  source: mifuturo_chile
  country: CHL
  granularity: seguimiento
  institution_granularity: generica_institucion
  sex_granularity: sexo
  sex_columns: {F: TITULACIONES MUJERES POR PROGRAMA, M: TITULACIONES HOMBRES POR PROGRAMA, NB: TITULACIONES NB E INDEFINIDO POR PROGRAMA}
  generic_levels: [Pregrado]
  columns: ["AÑO", "TOTAL TITULACIONES", "NOMBRE CARRERA", "NIVEL GLOBAL", "ÁREA CARRERA GENÉRICA", "NOMBRE INSTITUCIÓN"]

# Graduates per university and rankings (app/datasets/universities.py, source
# universidades_egresados, GET /graduates/universities). Every file comes from its publisher's
# page. Names go through names_file; types of management stay as published: in Chile "Universidades
# CRUCH" mixes public and private universities.
universities:
  dataset_code: universidades_egresados
  names_file: reference/universidades_nombres.yaml
  # Where each file is found: the page and pattern of a dataset profile, or its own.
  inputs:
    arg_latest: {profile: arg_anuario_diu_egresados}
    arg_history:
      # 2012-2013: the latest yearbook starts in 2014.
      landing_page: https://www.argentina.gob.ar/educacion/universidades/informacion/publicaciones/anuarios
      download:
        link_pattern: '/sites/default/files/(?:\d{4}/\d{2}/)?anuario_csv_2022\.zip'
        allowed_hosts: [www.argentina.gob.ar]
        max_bytes: 80000000
    chl: {profile: mifuturo_titulados}
    ury: {profile: mec_uy_egresados_grado}
    udelar:
      landing_page: https://planeamiento.udelar.edu.uy/portal/egresados/egresados-de-grado/
      download:
        page_pattern: '/portal/publicacion_generica/egresos-totales-serie-(?P<release>[\d-]+)/'
        link_pattern: '/portal/wp-content/uploads/sites/33/\d{4}/\d{2}/1\.Serie-Egresos-totales-Grado-por-Servicio-2000-\d{4}\.ods'
        allowed_hosts: [planeamiento.udelar.edu.uy]
        max_bytes: 5000000
  missing_text: ["", "-", "s/d", "s/i", "n/a", "///", "None", "nan"]
  # Institution sums may differ this much from the published total before the load stops.
  total_tolerance: 0.02
  control_pending: revisar
  footnote_pattern: '(\s*\(\d+\))+$'
  institute_type: instituto universitario
  ranked_institution_type: universidad
  arg:
    source: anuario_diu_argentina
    title_word: egresad
    footnote_starts: ["Fuente", "Nota", "(", "*"]
    latest_tables:
      - {management: publica, member_prefix: "Z 2.1", sheet: "C 2.1.4"}
      - {management: privada, member_prefix: "Z 2.2", sheet: "C2.2.4"}
    history_name_column: nombre_corto
    history_tables:
      - {management: publica, member: "Anuario 2022/Capitulo 2 Pregrado Grado Estatal/Cuadro_2_1_3.csv"}
      - {management: privada, member: "Anuario 2022/Capitulo 2 Pregrado Grado Privado/Cuadro_2_2_3.csv"}
  chl:
    source: mifuturo_chile
    institution_type: Universidades
    columns:
      anio: AÑO
      egresados: TOTAL TITULACIONES
      tipo: CLASIFICACIÓN INSTITUCIÓN NIVEL 1
      gestion: CLASIFICACIÓN INSTITUCIÓN NIVEL 2
      institucion: NOMBRE INSTITUCIÓN
      nivel: NIVEL GLOBAL
  ury:
    source: mec_uruguay
    graduates_column: 7
    sheets: ["II-7.2.1", "II-7.2.2", "II-7.2.3"]
    total_pattern: '^TOTAL( PAÍS| UNIVERSIDADES P[ÚU]BLICAS)?$'
    institutions:
      - {sheet: "II-7.2.1", management: publica, pattern: '^(TOTAL UDELAR|UdelaR)$', name: "Universidad de la República (UdelaR)"}
      - {sheet: "II-7.2.1", management: publica, pattern: '^(UNIVERSIDAD TECNOL[ÓO]GICA\s*-\s*UTEC|UTEC)$', name: "Universidad Tecnológica (UTEC)"}
      - {sheet: "II-7.2.2", management: privada, pattern: '^UCU$', name: "Universidad Católica del Uruguay (UCU)"}
      - {sheet: "II-7.2.2", management: privada, pattern: '^UNIVERSIDAD ORT URUGUAY$', name: "Universidad ORT Uruguay"}
      - {sheet: "II-7.2.2", management: privada, pattern: '^UNIVERSIDAD DE MONTEVIDEO$', name: "Universidad de Montevideo"}
      - {sheet: "II-7.2.2", management: privada, pattern: '^UNIVERSIDAD DE LA EMPRESA', name: "Universidad de la Empresa (UDE)"}
      - {sheet: "II-7.2.2", management: privada, pattern: '^UNIVERSIDAD CLAEH$', name: "Universidad CLAEH"}
    institute_sheet: "II-7.2.3"
    institute_pattern: '^(INST\b|INSTITUTO\b(?!.*/ CARRERA)|FUNDACI[ÓO]N\b|ESCUELA NACIONAL DE POLIC[ÍI]A)'
    public_institute_pattern: 'MILITAR|POLIC[ÍI]A'
  udelar:
    source: udelar_planeamiento
    name: "Universidad de la República (UdelaR)"
    management: publica
    header_starts: Área/servicio
    total_row: TOTAL UNIVERSIDAD
    max_repeat: 40
  # The files have no sector: every row is the institution's total.
  sector_label: Total
  top_n: 10
  period_type: anual
  ranking_type: mayor_volumen_egresados
  regional_criterion: Último año con datos de los tres países
  coverage: Solo universidades; no incluye institutos universitarios
  levels:
    ARG: Pregrado y grado
    CHL: Pregrado
    URY: Grado
  max_rows: 5000
  note: >-
    Mide cantidad de egresados, no calidad. Cada país cuenta un nivel distinto (Argentina: pregrado
    y grado; Chile: pregrado; Uruguay: grado), así que la comparación entre países es aproximada.
    Los valores son los que publica cada fuente, sin ajustes.

# Which occupation-level series get trends and projections after each update: featured | all |
# none. Occupation series repeat the values of their ISCO group, so computing them for every
# occupation adds time without adding information. The employability index always covers all.
recompute:
  occupation_series: featured
  # Results computed with parameters no longer in this file (superseded methodologies) are
  # deleted when their calculation runs again; the methodologies rows are always kept, so what
  # each version used stays documented. true keeps the old results too (the API only shows the
  # current ones either way).
  keep_superseded_results: true
