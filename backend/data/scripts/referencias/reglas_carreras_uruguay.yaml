# Reglas para la correspondencia carrera → ocupación (CIUO-08) de Uruguay.
#
# Las carreras del Anuario Estadístico de Educación (MEC) aparecen con muchas variantes del mismo
# nombre ("Licenciatura en Psicología" y "Licenciado en Psicología", "Contador Público" en cada
# universidad). En vez de escribir 534 filas a mano, cada regla asocia un patrón a los códigos
# CIUO-08 de 4 dígitos para los que forma la carrera. generar_correspondencia_uruguay.py aplica las
# reglas a todas las carreras cargadas y escribe config/reference/carreras_uruguay_ciuo.yaml.
#
# - El patrón es una expresión regular sobre el nombre normalizado (minúsculas, sin tildes, espacios
#   simples). Gana la PRIMERA regla que coincide: las más específicas van antes.
# - codes: [] marca una carrera genérica, que no forma para una ocupación concreta (ciclos
#   iniciales comunes): sus egresados no cuentan para ninguna ocupación.
# - Mismos criterios que Chile y Argentina (data/scripts/referencias/README.md, sección 5). Es un
#   borrador sin revisar.

# Pasar a true cuando Data Analytics termine la revisión (se copia al archivo generado).
revisada: false

reglas:
  # --- Genéricas: ciclos iniciales y básicos (no titulan para una ocupación) -------------------
  - {patron: '^ciclo |^cio |ciclo (inicial|basico|unico)', codes: [], nota: ciclo común}

  # --- Ciencias económicas y administración ---------------------------------------------------
