# Reglas para asignar a cada carrera su campo detallado CINE-F 2013 (4 dígitos), compartidas por
# Argentina, Chile y Uruguay. generar_correspondencia_cine.py las aplica a las carreras cargadas de
# cada país y escribe config/reference/carreras_<país>_cine.yaml. Las ocupaciones salen después de
# una sola tabla común: config/reference/cine_f_ciuo.yaml.
#
# - El patrón es una expresión regular sobre el nombre normalizado (minúsculas, sin tildes, espacios
#   simples). Gana la PRIMERA regla que coincide: las más específicas van antes.
# - cine: null marca una carrera genérica (plan común, bachillerato, "otros..."), sin campo ni
#   ocupación.
# - Chile publica el campo específico (3 dígitos) de cada carrera: el script avisa cuando la regla
#   asigna un campo detallado de otro campo específico.
# - Es un borrador sin revisar (mismos criterios que data/scripts/referencias/README.md, sección 5).

# Pasar a true cuando Data Analytics termine la revisión (se copia a los archivos generados).
revisada: false

# Carreras técnicas (CINE 5: técnico, tecnólogo, tecnicatura...): usan las ocupaciones "tecnico" de
# cine_f_ciuo.yaml. Se reconocen por el nombre, o por el nivel en los países donde el nivel lo dice
# (niveles_tecnicos).
patron_tecnico: '^(tecnic|tecnologo|tecnologa|tecnologo/a|analista|asistente|auxiliar|laboratorista|higienista|perito|operador|otros tecnicos|escalonada)|tecnicatura'
niveles_tecnicos:
  ARG: [Pregrado]

reglas:
  # --- Genéricas ------------------------------------------------------------------------------
  - {patron: '^ciclo |^cio |ciclo (inicial|basico|unico)|plan comun|^bachillerato|^otras ciencias|^otros profesionales de (administracion|arte|ciencias|educacion|humanidades|salud|tecnologia)|^otros tecnicos de (administracion|arte|ciencias|educacion|humanidades|salud|tecnologia)|^otras ingenierias', cine: null}

  # --- Casos que otras reglas confundirían (van primero) --------------------------------------
  # Chile (Mi Futuro) los ubica en estos campos específicos.
  - {patron: 'gastronom|cocina|hoteler', cine: "1013"}
