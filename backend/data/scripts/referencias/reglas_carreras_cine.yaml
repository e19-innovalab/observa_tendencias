  - {patron: 'preparacion fisica|deporte|deportiv|fitness|futbol', cine: "1014"}
  - {patron: 'dibujo arquitectonico|dibujo tecnico|proyectos de ingenieria', cine: "0732"}
  - {patron: 'ingenieria (civil )?(en )?(medio )?ambient|tecnico en medio ambiente', cine: "0712"}
  - {patron: 'ingenieria (civil )?(en )?sonido', cine: "0714"}
  - {patron: 'ingenieria (civil )?(en )?(biotecnolog|bioquimica)|bioingenieria|biotecnologia industrial', cine: "0711"}
