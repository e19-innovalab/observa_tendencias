  - {patron: '^educacion$', cine: "0114"}
  # Argentina: la disciplina reúne contadores, administradores y economistas; la mayoría son
  # contadores (Contador Público es la carrera con más egresados). A revisar.
  - {patron: '^economia y administracion$', cine: "0411"}

